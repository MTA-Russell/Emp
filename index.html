.value;save();});row.appendChild(grid);\n  if(item.readings.length){var wrap=element('div','readings'),fields=element('div','fields');\n   if(item.number==='53'){\n    wrap.appendChild(element('p','sub','Brake lining remaining: enter measurements with units. Each position is one wheel end; the dual tires share that wheel end.'));\n    wrap.appendChild(element('p','reading-hint','Printed checklist note for air drum brakes: reline below 3/8 inch at the shoe center on non-steering axles, or below 1/4 inch on steering axles.'));\n   }\n   item.readings.forEach(function(r){var n=input(c.readings[r.key]);field(fields,r.label,'reading'+i+'_'+r.key,n);n.addEventListener('input',function(){c.readings[r.key]=n.value;save();});});wrap.appendChild(fields);row.appendChild(wrap);\n  }\n  el(item.group+'Items').appendChild(row);\n });}\n function buildTires(){var group='';C.tires.forEach(function(t,i){if(group!==t.group){group=t.group;el('tires').appendChild(element('h3','tire-group',group));}var reading=state.tires[i],row=element('div','tire');row.appendChild(element('div','tire-name',t.label));var fields=element('div','fields'),psi=input(reading.psi),tread=input(reading.tread);field(fields,'PSI','psi'+i,psi);field(fields,'Tread depth (32nds)','tread'+i,tread);psi.addEventListener('input',function(){reading.psi=psi.value;save();});tread.addEventListener('input',function(){reading.tread=tread.value;save();});row.appendChild(fields);el('tires').appendChild(row);});}\n function review(){var c=R.counts(state),summary='Inspected & OK: '+c.OK+' | Minor repairs made: '+c.R+' | Shop repairs required: '+c.SR+' | N/A: '+c['N/A']+'.';if(c.missing)summary+=' '+c.missing+' items have no result and will show as Not recorded.';if(c.initials)summary+=' Enter the technician name in Details to include initials with selected results.';el('completion').textContent=summary;el('reportText').value=R.report(state);el('openEmail').href=R.link(state,true);el('shortEmail').href=R.link(state,false);el('recipientList').textContent=C.recipients.join('; ');}\n function show(index){step=Math.max(0,Math.min(panels.length-1,index));panels.forEach(function(id,i){el(id).hidden=i!==step;});document.querySelectorAll('[data-step]').forEach(function(b){if(Number(b.dataset.step)===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});el('stepCount').textContent='Section '+(step+1)+' of '+panels.length;el('progressFill').style.width=((step+1)/panels.length*100)+'%';el('back').hidden=step===0;el('next').hidden=step===panels.length-1;el('next').textContent=step===panels.length-2?'Review inspection':'Next';el('foot').hidden=false;if(step===panels.length-1)review();window.scrollTo(0,0);}\n document.querySelectorAll('[data-key]').forEach(function(n){n.value=state.fields[n.dataset.key]||'';n.addEventListener('input',function(){state.fields[n.dataset.key]=n.value;save();});});\n document.querySelectorAll('[data-step]').forEach(function(n){n.addEventListener('click',function(){show(Number(n.dataset.step));});});\n el('back').addEventListener('click',function(){show(step-1);});el('next').addEventListener('click',function(){show(step+1);});\n el('openEmail').addEventListener('click',function(){save();el('mailStatus').textContent='Opening your email app. Check all 10 tire positions and END OF INSPECTION are present, then send. Use the backup below if any text is missing.';});\n el('shortEmail').addEventListener('click',function(){el('copyStatus').textContent='Paste the complete report into the email body, review the addresses, then send.';});\n function selectReport(){var n=el('reportText');n.focus();n.select();n.setSelectionRange(0,n.value.length);}\n function legacyCopy(){selectReport();var ok=false;try{ok=document.execCommand('copy');}catch(e){}el('copyStatus').textContent=ok?'Full report copied. Open the email to paste it.':'Report selected. Use your device\\'s Copy command, then open the email to paste it.';}\n el('copyReport').addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el('reportText').value).then(function(){el('copyStatus').textContent='Full report copied. Open the email to paste it.';},legacyCopy);}else legacyCopy();});\n el('selectReport').addEventListener('click',function(){selectReport();el('copyStatus').textContent='Report selected. Use your device\\'s Copy command, then open the email to paste it.';});\n el('clear').addEventListener('click',function(){if(!window.confirm('Clear this inspection and start a new one?'))return;state=R.fresh();try{localStorage.removeItem(KEY);}catch(e){}document.querySelectorAll('[data-key]').forEach(function(n){n.value=state.fields[n.dataset.key]||'';});C.groups.forEach(function(g){el(g.id+'Items').replaceChildren();});el('tires').replaceChildren();buildItems();buildTires();el('mailStatus').textContent='';el('copyStatus').textContent='';el('reportText').value='';el('backup').open=false;el('draftStatus').textContent='New heavy duty inspection started.';show(0);});\n buildItems();buildTires();el('content').hidden=false;show(0);\n})(HeavyDutyConfig,HeavyDutyReport);\n\u003c/script>\n\u003cstyle id=\"portalCleanUi\">.recipients,.backup,.status,.bottom small,.head>p.sub,.btn .s{display:none!important}\u003c/style>\n\u003cscript id=\"portalEmailBridge\">\n(function(){\n'use strict';\ndocument.addEventListener('click',function(event){\n var link=event.target.closest?event.target.closest('a'):null;\n if(!link)return;\n var href=link.href||'';\n if(href.slice(0,7).toLowerCase()!=='mailto:')return;\n event.preventDefault();\n window.parent.MagTecPortal.requestEmail('HDinsp',href);\n});\n})();\n\u003c/script>\n\u003c/body>\u003c/html>"},"TANKinsp":{"title":"Tank Inspection","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#14181c\">\u003cmeta name=\"apple-mobile-web-app-title\" content=\"Tank Inspection\">\u003ctitle>MagTec Tank Inspection\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--bg:#14181c;--panel:#1c2127;--line:#36404a;--text:#eef1f4;--sub:#adb7c1;--amber:#f5a623}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 12px 32px}.app{max-width:880px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}h1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 8px}h2{font-size:20px;font-weight:600;margin:0 0 8px}p{margin:0 0 16px}.sub{color:var(--sub);font-size:14px}.head p{margin:0}.steps{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}.step{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:6px;min-height:44px;padding:9px 12px;font:600 13px/1.3 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}.step[aria-current=step]{background:var(--amber);border-color:var(--amber);color:#211809}.progress{height:4px;background:var(--line)}#progressFill{height:100%;width:0;background:var(--amber)}.content{padding:24px}.panel[hidden]{display:none!important}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label,.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:16px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif}textarea{resize:vertical;min-height:88px}input,select{min-height:48px}input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.field-help{color:var(--sub);font-size:12px;margin:5px 0 0}.check{padding:18px 0;border-bottom:1px solid var(--line)}.check:first-child{padding-top:0}.check:last-child{border-bottom:0}.item-name{font-size:16px;font-weight:600;margin:0 0 12px}.number{color:var(--amber);display:inline-block;min-width:28px}.check-fields{display:grid;grid-template-columns:150px 90px minmax(0,1fr);gap:12px;align-items:start}.comment textarea{min-height:48px;height:48px}.expiry{margin-top:12px;max-width:290px}.check[data-result=Fail]{border-left:3px solid #ff9389;padding-left:12px}.check[data-result=Pass]{border-left:3px solid #62c994;padding-left:12px}.check[data-result=\"N/A\"]{border-left:3px solid #a5b8cf;padding-left:12px}.tire{border-bottom:1px solid var(--line);padding:18px 0}.tire:first-child{padding-top:0}.tire-name{font-weight:600;margin-bottom:10px}.notes{margin-top:24px}.foot{display:flex;gap:12px;border-top:1px solid var(--line);padding:18px 24px}.button{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);cursor:pointer;text-align:center}.primary{background:var(--amber);border-color:var(--amber);color:#211809}.primary:hover{background:#ffbb4d}.grow{flex:1}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.actions .button{flex:1 1 180px}.notice{padding:14px;border:1px solid #846332;border-radius:7px;background:#30281b;color:var(--text);font-size:14px;margin-bottom:18px}.recipients{padding:14px;background:var(--bg);border-radius:7px;margin:16px 0;overflow-wrap:anywhere;font-size:13px}.recipients strong{display:block;margin-bottom:4px;color:var(--sub)}.report{font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:360px;white-space:pre-wrap}.backup{border:1px solid var(--line);border-radius:7px;padding:14px;margin-top:18px}.backup summary{font-size:14px;font-weight:600;cursor:pointer;min-height:28px}.backup p{margin-top:12px;margin-bottom:8px}.status{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line)}.bottom .button{font-size:12px;min-height:40px;padding:8px 12px}.bottom small{color:var(--sub);font-size:12px}.step-count{font-size:12px;color:var(--sub);margin-bottom:12px}noscript{display:block;padding:24px;color:var(--text)}\n@media(max-width:620px){body{padding:0}.app{border:0;border-radius:0}.head,.content{padding:20px 16px}.steps{padding:12px 16px;gap:5px}.step{flex:1 1 28%;font-size:12px;padding:8px}.fields{grid-template-columns:1fr}.check-fields{grid-template-columns:minmax(0,1fr) 90px}.comment{grid-column:1/-1}.comment textarea{height:72px}.foot,.bottom{padding:16px}.tire .fields{grid-template-columns:1fr 1fr}.report{font-size:13px}.bottom{align-items:flex-start}.head h1{font-size:22px}}\n\n.app [hidden]{display:none!important}.entry{padding:20px 0;border-bottom:1px solid var(--line)}.entry:first-child{padding-top:0}.entry:last-child{border-bottom:0}.entry h3{font-size:17px;font-weight:600;margin:0 0 12px}.entry .answer-notes{margin-top:12px}.entry .answer-notes textarea{min-height:70px}.entry .quantity-fields{display:grid;grid-template-columns:minmax(130px,1fr) minmax(0,2fr);gap:14px}.entry .quantity-fields textarea{min-height:48px;height:48px}.entry .condition{min-height:75px}.entry select{max-width:300px}@media(max-width:620px){.entry .quantity-fields{grid-template-columns:1fr}.entry .quantity-fields textarea{height:75px}.entry select{max-width:none}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cmain class=\"app\">\n\u003cheader class=\"head\">\u003cdiv class=\"brand\">MagTec Alaska\u003c/div>\u003ch1>Tank Inspection\u003c/h1>\u003cp class=\"sub\">400 BBL &amp; 600 BBL tanks &middot; In, Out &amp; Yard inspections\u003c/p>\u003c/header>\n\u003cnav class=\"steps\" aria-label=\"Inspection sections\">\n \u003cbutton type=\"button\" class=\"step\" data-step=\"0\" aria-controls=\"detailsPanel\">1. Details\u003c/button>\n \u003cbutton type=\"button\" class=\"step\" data-step=\"1\" aria-controls=\"fittings\">2. Fittings &amp; safety\u003c/button>\n \u003cbutton type=\"button\" class=\"step\" data-step=\"2\" aria-controls=\"tankFoam\">3. Tank &amp; foam\u003c/button>\n \u003cbutton type=\"button\" class=\"step\" data-step=\"3\" aria-controls=\"notesPanel\">4. Accessories &amp; notes\u003c/button>\n \u003cbutton type=\"button\" class=\"step\" data-step=\"4\" aria-controls=\"review\">5. Review &amp; email\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n\u003cnoscript>Open this page in Safari, Chrome, or Edge with JavaScript enabled to fill out the inspection.\u003c/noscript>\n\u003cdiv class=\"content\" id=\"content\" hidden>\n \u003cdiv class=\"step-count\" id=\"stepCount\" aria-live=\"polite\">\u003c/div>\n \u003csection class=\"panel\" id=\"detailsPanel\" aria-labelledby=\"detailsTitle\">\n  \u003ch2 id=\"detailsTitle\">Tank &amp; inspector details\u003c/h2>\u003cp class=\"sub\">Select the inspection type and tank size, then enter the details below.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"inspectionType\">Inspection type\u003c/label>\u003cselect id=\"inspectionType\" data-key=\"inspectionType\">\u003coption value=\"\">Select inspection type\u003c/option>\u003coption value=\"In\">In\u003c/option>\u003coption value=\"Out\">Out\u003c/option>\u003coption value=\"Yard\">Yard\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv>\u003clabel for=\"tankSize\">Tank size\u003c/label>\u003cselect id=\"tankSize\" data-key=\"tankSize\">\u003coption value=\"\">Select tank size\u003c/option>\u003coption value=\"400 BBL\">400 BBL\u003c/option>\u003coption value=\"600 BBL\">600 BBL\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv>\u003clabel for=\"asset\">Asset number\u003c/label>\u003cinput id=\"asset\" data-key=\"asset\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"technician\">Technician / inspector name\u003c/label>\u003cinput id=\"technician\" data-key=\"technician\" type=\"text\" autocomplete=\"name\">\u003cp class=\"field-help\">Your name supplies the initials for each answered inspection item.\u003c/p>\u003c/div>\n\u003cdiv>\u003clabel for=\"date\">Inspection date\u003c/label>\u003cinput id=\"date\" data-key=\"date\" type=\"date\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"associatedSE\">Associated SE# (if available)\u003c/label>\u003cinput id=\"associatedSE\" data-key=\"associatedSE\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"standbyDate\">Standby date (if applicable)\u003c/label>\u003cinput id=\"standbyDate\" data-key=\"standbyDate\" type=\"date\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"rentalCustomer\">Rental order number or customer name\u003c/label>\u003cinput id=\"rentalCustomer\" data-key=\"rentalCustomer\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"serial\">Serial number\u003c/label>\u003cinput id=\"serial\" data-key=\"serial\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003c/div>\n \u003c/section>\n \u003csection class=\"panel\" id=\"fittings\" aria-labelledby=\"fittingsTitle\" hidden>\n  \u003ch2 id=\"fittingsTitle\">Fittings &amp; safety\u003c/h2>\u003cp class=\"sub\">Enter the quantities present and select the condition of each item. Add notes wherever needed.\u003c/p>\u003cdiv id=\"fittingsItems\">\u003c/div>\n \u003c/section>\n \u003csection class=\"panel\" id=\"tankFoam\" aria-labelledby=\"tankFoamTitle\" hidden>\n  \u003ch2 id=\"tankFoamTitle\">Tank &amp; foam\u003c/h2>\u003cp class=\"sub\">Record the tank component conditions and foam findings. Add details wherever needed.\u003c/p>\u003cdiv id=\"tankFoamItems\">\u003c/div>\n \u003c/section>\n \u003csection class=\"panel\" id=\"notesPanel\" aria-labelledby=\"notesTitle\" hidden>\n  \u003ch2 id=\"notesTitle\">Accessories &amp; notes\u003c/h2>\n  \u003clabel for=\"accessories\">Accessories\u003c/label>\u003ctextarea id=\"accessories\" data-key=\"accessories\" rows=\"4\">\u003c/textarea>\n  \u003cdiv class=\"notes\">\u003clabel for=\"notes\">Additional comments / repairs needed\u003c/label>\u003ctextarea id=\"notes\" data-key=\"notes\" rows=\"5\">\u003c/textarea>\u003c/div>\n \u003c/section>\n \u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden>\n  \u003ch2 id=\"reviewTitle\">Review &amp; open email\u003c/h2>\u003cp class=\"sub\">The completed inspection goes in the email body. Review the draft in your email app, then send it.\u003c/p>\n  \u003cdiv id=\"completion\" class=\"notice\">\u003c/div>\n  \u003cdiv class=\"recipients\">\u003cstrong>Email recipients\u003c/strong>\u003cspan id=\"recipientList\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"actions\">\u003ca class=\"button primary\" id=\"openEmail\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">Open filled-out email\u003c/a>\u003c/div>\n  \u003cp class=\"status\" id=\"mailStatus\" role=\"status\">\u003c/p>\n  \u003clabel for=\"reportText\">Complete email body\u003c/label>\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\">\u003c/textarea>\n  \u003cp class=\"field-help\">The completed email should end with END OF INSPECTION.\u003c/p>\n  \u003cdetails class=\"backup\" id=\"backup\">\u003csummary>Backup if the email opens with missing text\u003c/summary>\n   \u003cp class=\"sub\">If your phone limits the email text, copy the full report, open the addressed email, and paste it into the body.\u003c/p>\n   \u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"button\" id=\"copyReport\">1. Copy full report\u003c/button>\u003ca class=\"button\" id=\"shortEmail\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">2. Open email to paste\u003c/a>\u003c/div>\n   \u003cbutton type=\"button\" class=\"button\" id=\"selectReport\">Select report for manual copy\u003c/button>\u003cp class=\"status\" id=\"copyStatus\" role=\"status\">\u003c/p>\n   \u003cp class=\"field-help\">If your device blocks copying or opening email from this browser, use your approved email app with the addresses and report shown above.\u003c/p>\n  \u003c/details>\n \u003c/section>\n\u003c/div>\n\u003cdiv class=\"foot\" id=\"foot\" hidden>\u003cbutton class=\"button\" id=\"back\" type=\"button\">Back\u003c/button>\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\">Next\u003c/button>\u003c/div>\n\u003cfooter class=\"bottom\">\u003csmall id=\"draftStatus\" role=\"status\">Your entries stay here while you fill out the form.\u003c/small>\u003cbutton class=\"button\" id=\"clear\" type=\"button\">Start over\u003c/button>\u003c/footer>\n\u003c/main>\n\u003cscript id=\"inspectionTextLayout\">var InspectionTextLayout=(function(){\n'use strict';\nvar COLUMN=24,WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length>width){\n   var end=width;while(end>0&&!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))&&/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){\n  var pending=[];\n  function full(item){line(item.title+' | '+(item.values||[]).join('; '));if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);}\n  function flush(){\n   if(pending.length\u003c3){pending.forEach(full);pending=[];return;}\n   var row=pending,cells=row.map(function(item){return wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN);}),height=Math.max.apply(null,cells.map(function(c){return c.length;}));\n   for(var i=0;i\u003cheight;i++){\n    lines.push(cells.map(function(c){return (c[i]||'').padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));\n   }\n   row.forEach(function(item){if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);});\n   pending=[];\n  }\n  items.forEach(function(item){var height=wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN).length;if(height>4){flush();full(item);}else{pending.push(item);if(pending.length===3)flush();}});flush();\n }\n function fields(list){\n  var row=[];\n  function flush(){if(row.length){lines.push(row.map(function(s){return s.padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));row=[];}}\n  list.forEach(function(f){var entry=f[0]+': '+text(f[1]);if(entry.length>COLUMN||/[\\r\\n]/.test(entry)){flush();line(entry);}else{row.push(entry);if(row.length===3)flush();}});flush();\n }\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script>\n\u003cscript id=\"tankConfig\">var TankConfig={\"fields\": [{\"key\": \"inspectionType\", \"label\": \"Inspection type\", \"type\": \"select\", \"options\": [\"In\", \"Out\", \"Yard\"]}, {\"key\": \"tankSize\", \"label\": \"Tank size\", \"type\": \"select\", \"options\": [\"400 BBL\", \"600 BBL\"]}, {\"key\": \"asset\", \"label\": \"Asset number\", \"type\": \"text\"}, {\"key\": \"technician\", \"label\": \"Technician / inspector name\", \"type\": \"text\"}, {\"key\": \"date\", \"label\": \"Inspection date\", \"type\": \"date\"}, {\"key\": \"associatedSE\", \"label\": \"Associated SE# (if available)\", \"type\": \"text\"}, {\"key\": \"standbyDate\", \"label\": \"Standby date (if applicable)\", \"type\": \"date\"}, {\"key\": \"rentalCustomer\", \"label\": \"Rental order number or customer name\", \"type\": \"text\"}, {\"key\": \"serial\", \"label\": \"Serial number\", \"type\": \"text\"}], \"groups\": [{\"id\": \"fittings\", \"title\": \"Fittings & safety\"}, {\"id\": \"tankFoam\", \"title\": \"Tank & foam\"}], \"items\": [{\"key\": \"valves\", \"group\": \"fittings\", \"title\": \"4\\\" butterfly valves\", \"type\": \"quantity\"}, {\"key\": \"plugs\", \"group\": \"fittings\", \"title\": \"4\\\" plugs\", \"type\": \"quantity\"}, {\"key\": \"steamPlugs\", \"group\": \"fittings\", \"title\": \"2\\\" steam line plugs\", \"type\": \"quantity\"}, {\"key\": \"ladder\", \"group\": \"fittings\", \"title\": \"Condition of ladder\", \"type\": \"condition\"}, {\"key\": \"fallRestraint\", \"group\": \"fittings\", \"title\": \"Fall restraint\", \"type\": \"condition\"}, {\"key\": \"fallSlider\", \"group\": \"fittings\", \"title\": \"Fall restraint slider\", \"type\": \"condition\"}, {\"key\": \"sling\", \"group\": \"fittings\", \"title\": \"Bridal\", \"type\": \"condition\"}, {\"key\": \"bridalCollar\", \"group\": \"fittings\", \"title\": \"Bridal collar condition\", \"type\": \"condition\"}, {\"key\": \"gaugeBoard\", \"group\": \"tankFoam\", \"title\": \"Gauge board\", \"type\": \"condition\"}, {\"key\": \"gaugePulleys\", \"group\": \"tankFoam\", \"title\": \"Gauge board pulleys\", \"type\": \"condition\"}, {\"key\": \"topVent\", \"group\": \"tankFoam\", \"title\": \"Top aluminum vent\", \"type\": \"condition\"}, {\"key\": \"landingBracket\", \"group\": \"tankFoam\", \"title\": \"Crutch landing bracket\", \"type\": \"condition\"}, {\"key\": \"hatchBolted\", \"group\": \"tankFoam\", \"title\": \"Is the hatch bolted?\", \"type\": \"yesno\"}, {\"key\": \"cleaned\", \"group\": \"tankFoam\", \"title\": \"Has the tank been cleaned?\", \"type\": \"yesno\"}, {\"key\": \"cleanCertificate\", \"group\": \"tankFoam\", \"title\": \"Cleaning certificate / reference (if available)\", \"type\": \"text\", \"optional\": true}, {\"key\": \"foamBubbles\", \"group\": \"tankFoam\", \"title\": \"Foam condition — bubbles\", \"type\": \"condition\", \"foam\": true}, {\"key\": \"foamCracks\", \"group\": \"tankFoam\", \"title\": \"Foam condition — cracks\", \"type\": \"condition\", \"foam\": true}, {\"key\": \"foamOther\", \"group\": \"tankFoam\", \"title\": \"Foam condition — other defects\", \"type\": \"condition\", \"foam\": true}], \"recipients\": [\"NSrentals@magtecalaska.com\", \"nsshop@magtecalaska.com\", \"nsd-mgr@magtecalaska.com\"]};\u003c/script>\n\u003cscript id=\"tankApp\">var TankReport=(function(C){\n 'use strict';\n function str(v){return v==null?'':String(v);}\n function value(v){return str(v).trim()?str(v):'Not recorded';}\n function initials(s){return (str(s.fields.technician).match(/\\p{L}[\\p{L}\\p{M}'’-]*/gu)||[]).map(function(w){return Array.from(w)[0];}).join('').toUpperCase();}\n function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\n function fresh(){var entries={};C.items.forEach(function(i){entries[i.key]={answer:'',condition:'',notes:''};});return {version:1,formKind:'tank',fields:{date:today()},entries:entries};}\n function normalize(s){\n  var d=fresh();if(!s||s.version!==1||s.formKind!=='tank')return d;\n  C.fields.concat([{key:'accessories'},{key:'notes'}]).forEach(function(f){var v=(s.fields||{})[f.key];if(typeof v==='string'&&(!f.options||f.options.indexOf(v)>=0||v===''))d.fields[f.key]=v;});\n  C.items.forEach(function(i){var e=(s.entries||{})[i.key]||{},v=d.entries[i.key];v.answer=str(e.answer);v.notes=str(e.notes);v.condition=['In good condition','Needs repair'].indexOf(e.condition)>=0?e.condition:'';\n   if(i.type==='condition'&&['','In good condition','Needs repair'].indexOf(v.answer)\u003c0){\n    var previous=v.answer;\n    if(i.foam&&['Yes','No'].indexOf(previous)>=0){v.answer=previous==='Yes'?'Needs repair':'In good condition';}else{v.answer='';}\n    v.notes='Previous answer: '+previous+(v.notes?'\\n'+v.notes:'');\n   }\n   if(i.type==='yesno'&&['','Yes','No','N/A'].indexOf(v.answer)\u003c0)v.answer='';\n  });return d;\n }\n function report(s){\n var p=InspectionTextLayout.create('TANK INSPECTION REPORT');\n p.fields(C.fields.map(function(f){return [f.label,value(s.fields[f.key])];}));p.line('Inspector initials (from name): '+value(initials(s)));\n C.groups.forEach(function(g){p.section(g.title);p.grid(C.items.filter(function(i){return i.group===g.id;}).map(function(i){\n  var e=s.entries[i.key],values=i.type==='quantity'?['Qty: '+value(e.answer),value(e.condition)]:[(i.type==='condition'?'':'Answer: ')+value(e.answer)];\n  if(e.answer.trim()||e.notes.trim()||str(e.condition).trim())values[values.length-1]+=' ['+value(initials(s))+']';\n  return {title:i.title,values:values,notes:e.notes};\n }));});\n if(str(s.fields.accessories).trim()){p.section('Accessories');p.line(s.fields.accessories);}\n if(str(s.fields.notes).trim()){p.section('Additional comments / repairs needed');p.line(s.fields.notes);}\n return p.finish();\n}\n\n function encode(v){var s=str(v);if(s.toWellFormed)s=s.toWellFormed();else s=s.replace(/[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDFFF]/g,function(m){return m.length===2?m:'\\uFFFD';});return encodeURIComponent(s);}\n function link(s,body){var subject=['Tank Inspection',value(s.fields.inspectionType),value(s.fields.tankSize),value(s.fields.asset),value(s.fields.date)].join(' - ');return 'mailto:'+C.recipients.join(',')+'?subject='+encode(subject)+(body?'&body='+encode(report(s)):'');}\n return {fresh:fresh,normalize:normalize,initials:initials,report:report,link:link};\n})(TankConfig);\n\n(function(C,R){\n 'use strict';\n var KEY='magtec-tank-inspection-draft-v1',state=R.fresh(),step=0;\n var panels=['detailsPanel','fittings','tankFoam','notesPanel','review'];\n function el(id){return document.getElementById(id);}\n try{var saved=localStorage.getItem(KEY);if(saved){state=R.normalize(JSON.parse(saved));el('draftStatus').textContent='Saved tank inspection restored on this device.';}}catch(e){}\n function save(){try{localStorage.setItem(KEY,JSON.stringify(state));el('draftStatus').textContent='Draft saved on this device.';}catch(e){el('draftStatus').textContent='Keep this page open to retain your entries.';}}\n function element(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}\n function field(parent,labelText,id,control){var wrap=element('div'),label=element('label','',labelText);label.htmlFor=id;control.id=id;wrap.append(label,control);parent.appendChild(wrap);return wrap;}\n function textarea(value){var n=element('textarea');n.rows=2;n.value=value||'';return n;}\n function conditionSelect(value){var n=element('select');[['','Select condition'],['In good condition','In good condition'],['Needs repair','Needs repair']].forEach(function(v){var o=element('option','',v[1]);o.value=v[0];n.appendChild(o);});n.value=value||'';return n;}\n function buildItems(){C.items.forEach(function(i){\n  var entry=state.entries[i.key],row=element('div','entry');row.appendChild(element('h3','',i.title));\n  var answer;\n  if(i.type==='quantity'){\n   var grid=element('div','quantity-fields');answer=element('input');answer.type='text';answer.value=entry.answer;answer.autocomplete='off';field(grid,'Quantity','answer-'+i.key,answer);\n   var condition=conditionSelect(entry.condition);field(grid,'Condition','condition-'+i.key,condition);condition.addEventListener('change',function(){entry.condition=condition.value;save();});\n   var notes=textarea(entry.notes);field(grid,'Notes / repairs needed','notes-'+i.key,notes);notes.addEventListener('input',function(){entry.notes=notes.value;save();});row.appendChild(grid);\n  }else if(i.type==='condition'){\n   answer=conditionSelect(entry.answer);field(row,'Condition','answer-'+i.key,answer);\n   var conditionNotes=textarea(entry.notes);field(row,'Notes / repairs needed','notes-'+i.key,conditionNotes).className='answer-notes';conditionNotes.addEventListener('input',function(){entry.notes=conditionNotes.value;save();});\n  }else if(i.type==='yesno'){\n   answer=element('select');[['','Select answer'],['Yes','Yes'],['No','No'],['N/A','N/A']].forEach(function(v){var o=element('option','',v[1]);o.value=v[0];answer.appendChild(o);});answer.value=entry.answer;field(row,'Answer','answer-'+i.key,answer);\n   var details=textarea(entry.notes);field(row,'Details / notes','notes-'+i.key,details).className='answer-notes';details.addEventListener('input',function(){entry.notes=details.value;save();});\n  }else{\n   answer=textarea(entry.answer);answer.className='condition';field(row,i.type==='condition'?'Condition / findings':'Certificate details / reference','answer-'+i.key,answer);\n  }\n  answer.addEventListener((i.type==='yesno'||i.type==='condition')?'change':'input',function(){entry.answer=answer.value;save();});el(i.group+'Items').appendChild(row);\n });}\n function review(){var questions=C.items.filter(function(i){return !i.optional;}),answered=questions.filter(function(i){var e=state.entries[i.key];return e.answer.trim()!==''&&(i.type!=='quantity'||e.condition.trim()!=='');}).length;\n  var summary=answered+' of '+questions.length+' inspection questions answered. Blank fields appear as Not recorded.';\n  if(!state.fields.inspectionType)summary+=' Inspection type is not selected.';if(!state.fields.tankSize)summary+=' Tank size is not selected.';if(!R.initials(state))summary+=' Enter the technician name in Details to include initials.';\n  el('completion').textContent=summary;el('reportText').value=R.report(state);el('openEmail').href=R.link(state,true);el('shortEmail').href=R.link(state,false);el('recipientList').textContent=C.recipients.join('; ');\n }\n function show(index){step=Math.max(0,Math.min(panels.length-1,index));panels.forEach(function(id,i){el(id).hidden=i!==step;});document.querySelectorAll('[data-step]').forEach(function(b){if(Number(b.dataset.step)===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});el('stepCount').textContent='Section '+(step+1)+' of '+panels.length;el('progressFill').style.width=((step+1)/panels.length*100)+'%';el('back').hidden=step===0;el('next').hidden=step===panels.length-1;el('next').textContent=step===panels.length-2?'Review inspection':'Next';el('foot').hidden=false;if(step===panels.length-1)review();window.scrollTo(0,0);}\n document.querySelectorAll('[data-key]').forEach(function(n){n.value=state.fields[n.dataset.key]||'';n.addEventListener(n.tagName==='SELECT'?'change':'input',function(){state.fields[n.dataset.key]=n.value;save();});});\n document.querySelectorAll('[data-step]').forEach(function(n){n.addEventListener('click',function(){show(Number(n.dataset.step));});});\n el('back').addEventListener('click',function(){show(step-1);});el('next').addEventListener('click',function(){show(step+1);});\n el('openEmail').addEventListener('click',function(){save();el('mailStatus').textContent='Opening your email app. Check that the draft ends with END OF INSPECTION, then send it. Use the backup below if text is missing.';});\n el('shortEmail').addEventListener('click',function(){el('copyStatus').textContent='Paste the full report into the email body, review the addresses, then send.';});\n function selectReport(){var n=el('reportText');n.focus();n.select();n.setSelectionRange(0,n.value.length);}\n function legacyCopy(){selectReport();var ok=false;try{ok=document.execCommand('copy');}catch(e){}el('copyStatus').textContent=ok?'Full report copied. Open the email to paste it.':'Report selected. Use your device\\'s Copy command, then open the email to paste it.';}\n el('copyReport').addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el('reportText').value).then(function(){el('copyStatus').textContent='Full report copied. Open the email to paste it.';},legacyCopy);}else legacyCopy();});\n el('selectReport').addEventListener('click',function(){selectReport();el('copyStatus').textContent='Report selected. Use your device\\'s Copy command, then open the email to paste it.';});\n el('clear').addEventListener('click',function(){if(!window.confirm('Clear this inspection and start a new one?'))return;state=R.fresh();try{localStorage.removeItem(KEY);}catch(e){}document.querySelectorAll('[data-key]').forEach(function(n){n.value=state.fields[n.dataset.key]||'';});C.groups.forEach(function(g){el(g.id+'Items').replaceChildren();});buildItems();el('mailStatus').textContent='';el('copyStatus').textContent='';el('reportText').value='';el('backup').open=false;el('draftStatus').textContent='New tank inspection started.';show(0);});\n buildItems();el('content').hidden=false;show(0);\n})(TankConfig,TankReport);\n\u003c/script>\n\u003cstyle id=\"portalCleanUi\">.recipients,.backup,.status,.bottom small,.head>p.sub,.btn .s{display:none!important}\u003c/style>\n\u003cscript id=\"portalEmailBridge\">\n(function(){\n'use strict';\ndocument.addEventListener('click',function(event){\n var link=event.target.closest?event.target.closest('a'):null;\n if(!link)return;\n var href=link.href||'';\n if(href.slice(0,7).toLowerCase()!=='mailto:')return;\n event.preventDefault();\n window.parent.MagTecPortal.requestEmail('TANKinsp',href);\n});\n})();\n\u003c/script>\n\u003c/body>\u003c/html>"},"EVinsp":{"title":"EV Inspection","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#14181c\">\u003cmeta name=\"apple-mobile-web-app-title\" content=\"EV Inspection\">\u003ctitle>MagTec EV Inspection\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--bg:#14181c;--panel:#1c2127;--line:#36404a;--text:#eef1f4;--sub:#adb7c1;--amber:#f5a623}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 12px 32px}.app{max-width:880px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}h1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 8px}h2{font-size:20px;font-weight:600;margin:0 0 8px}p{margin:0 0 16px}.sub{color:var(--sub);font-size:14px}.head p{margin:0}.steps{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}.step{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:6px;min-height:44px;padding:9px 12px;font:600 13px/1.3 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}.step[aria-current=step]{background:var(--amber);border-color:var(--amber);color:#211809}.progress{height:4px;background:var(--line)}#progressFill{height:100%;width:0;background:var(--amber)}.content{padding:24px}.panel[hidden]{display:none!important}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label,.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:16px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif}textarea{resize:vertical;min-height:88px}input,select{min-height:48px}input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.field-help{color:var(--sub);font-size:12px;margin:5px 0 0}.check{padding:18px 0;border-bottom:1px solid var(--line)}.check:first-child{padding-top:0}.check:last-child{border-bottom:0}.item-name{font-size:16px;font-weight:600;margin:0 0 12px}.number{color:var(--amber);display:inline-block;min-width:28px}.check-fields{display:grid;grid-template-columns:150px 90px minmax(0,1fr);gap:12px;align-items:start}.comment textarea{min-height:48px;height:48px}.expiry{margin-top:12px;max-width:290px}.check[data-result=Fail]{border-left:3px solid #ff9389;padding-left:12px}.check[data-result=Pass]{border-left:3px solid #62c994;padding-left:12px}.check[data-result=\"N/A\"]{border-left:3px solid #a5b8cf;padding-left:12px}.tire{border-bottom:1px solid var(--line);padding:18px 0}.tire:first-child{padding-top:0}.tire-name{font-weight:600;margin-bottom:10px}.notes{margin-top:24px}.foot{display:flex;gap:12px;border-top:1px solid var(--line);padding:18px 24px}.button{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);cursor:pointer;text-align:center}.primary{background:var(--amber);border-color:var(--amber);color:#211809}.primary:hover{background:#ffbb4d}.grow{flex:1}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.actions .button{flex:1 1 180px}.notice{padding:14px;border:1px solid #846332;border-radius:7px;background:#30281b;color:var(--text);font-size:14px;margin-bottom:18px}.recipients{padding:14px;background:var(--bg);border-radius:7px;margin:16px 0;overflow-wrap:anywhere;font-size:13px}.recipients strong{display:block;margin-bottom:4px;color:var(--sub)}.report{font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:360px;white-space:pre-wrap}.backup{border:1px solid var(--line);border-radius:7px;padding:14px;margin-top:18px}.backup summary{font-size:14px;font-weight:600;cursor:pointer;min-height:28px}.backup p{margin-top:12px;margin-bottom:8px}.status{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line)}.bottom .button{font-size:12px;min-height:40px;padding:8px 12px}.bottom small{color:var(--sub);font-size:12px}.step-count{font-size:12px;color:var(--sub);margin-bottom:12px}noscript{display:block;padding:24px;color:var(--text)}\n@media(max-width:620px){body{padding:0}.app{border:0;border-radius:0}.head,.content{padding:20px 16px}.steps{padding:12px 16px;gap:5px}.step{flex:1 1 28%;font-size:12px;padding:8px}.fields{grid-template-columns:1fr}.check-fields{grid-template-columns:minmax(0,1fr) 90px}.comment{grid-column:1/-1}.comment textarea{height:72px}.foot,.bottom{padding:16px}.tire .fields{grid-template-columns:1fr 1fr}.report{font-size:13px}.bottom{align-items:flex-start}.head h1{font-size:22px}}\n\n.app [hidden]{display:none!important}.entry{padding:20px 0;border-bottom:1px solid var(--line)}.entry:first-child{padding-top:0}.entry:last-child{border-bottom:0}.entry h3{font-size:17px;font-weight:600;margin:0 0 12px}.entry .answer-notes{margin-top:12px}.entry .answer-notes textarea{min-height:70px}.entry .quantity-fields{display:grid;grid-template-columns:minmax(130px,1fr) minmax(0,2fr);gap:14px}.entry .quantity-fields textarea{min-height:48px;height:48px}.entry .condition{min-height:75px}.entry select{max-width:300px}@media(max-width:620px){.entry .quantity-fields{grid-template-columns:1fr}.entry .quantity-fields textarea{height:75px}.entry select{max-width:none}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cmain class=\"app\">\n\u003cheader class=\"head\">\u003cdiv class=\"brand\">MagTec Alaska\u003c/div>\u003ch1>EV Inspection\u003c/h1>\u003cp class=\"sub\">Envirovac &middot; In, Out &amp; Yard inspections\u003c/p>\u003c/header>\n\u003cnav class=\"steps\" aria-label=\"Inspection sections\">\n \u003cbutton type=\"button\" class=\"step\" data-step=\"0\" aria-controls=\"detailsPanel\">1. Details\u003c/button>\n \u003cbutton type=\"button\" class=\"step\" data-step=\"1\" aria-controls=\"equipment\">2. Equipment condition\u003c/button>\n \u003cbutton type=\"button\" class=\"step\" data-step=\"2\" aria-controls=\"condition\">3. Condition &amp; preparation\u003c/button>\n \u003cbutton type=\"button\" class=\"step\" data-step=\"3\" aria-controls=\"notesPanel\">4. Accessories &amp; notes\u003c/button>\n \u003cbutton type=\"button\" class=\"step\" data-step=\"4\" aria-controls=\"review\">5. Review &amp; email\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n\u003cnoscript>Open this page in Safari, Chrome, or Edge with JavaScript enabled to fill out the inspection.\u003c/noscript>\n\u003cdiv class=\"content\" id=\"content\" hidden>\n \u003cdiv class=\"step-count\" id=\"stepCount\" aria-live=\"polite\">\u003c/div>\n \u003csection class=\"panel\" id=\"detailsPanel\" aria-labelledby=\"detailsTitle\">\n  \u003ch2 id=\"detailsTitle\">EV &amp; inspector details\u003c/h2>\u003cp class=\"sub\">Enter the asset details and select In, Out, or Yard inspection.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"asset\">Asset number\u003c/label>\u003cinput id=\"asset\" data-key=\"asset\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"technician\">Technician / inspector name\u003c/label>\u003cinput id=\"technician\" data-key=\"technician\" type=\"text\" autocomplete=\"name\">\u003cp class=\"field-help\">Your name supplies the initials for each answered inspection item.\u003c/p>\u003c/div>\n\u003cdiv>\u003clabel for=\"date\">Inspection date\u003c/label>\u003cinput id=\"date\" data-key=\"date\" type=\"date\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"associatedSE\">Associated SE# (if available)\u003c/label>\u003cinput id=\"associatedSE\" data-key=\"associatedSE\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"inspectionType\">Inspection type\u003c/label>\u003cselect id=\"inspectionType\" data-key=\"inspectionType\">\u003coption value=\"\">Select inspection type\u003c/option>\u003coption value=\"In\">In\u003c/option>\u003coption value=\"Out\">Out\u003c/option>\u003coption value=\"Yard\">Yard\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv>\u003clabel for=\"evType\">EV type\u003c/label>\u003cselect id=\"evType\" data-key=\"evType\">\u003coption value=\"\">Select ev type\u003c/option>\u003coption value=\"53 ft\">53 ft\u003c/option>\u003coption value=\"20 ft 2 stall\">20 ft 2 stall\u003c/option>\u003coption value=\"20 ft 1 stall and shower\">20 ft 1 stall and shower\u003c/option>\u003coption value=\"Other\">Other\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv id=\"evTypeOtherField\" hidden>\u003clabel for=\"evTypeOther\">Other EV type — please specify\u003c/label>\u003ctextarea id=\"evTypeOther\" data-key=\"evTypeOther\" rows=\"3\">\u003c/textarea>\u003c/div>\n\u003cdiv>\u003clabel for=\"standbyDate\">Standby date (if applicable)\u003c/label>\u003cinput id=\"standbyDate\" data-key=\"standbyDate\" type=\"date\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"rentalCustomer\">Rental order number or customer name\u003c/label>\u003cinput id=\"rentalCustomer\" data-key=\"rentalCustomer\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"serial\">Serial number\u003c/label>\u003cinput id=\"serial\" data-key=\"serial\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"hours\">Hours\u003c/label>\u003cinput id=\"hours\" data-key=\"hours\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fuelLevel\">Fuel level\u003c/label>\u003cinput id=\"fuelLevel\" data-key=\"fuelLevel\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003c/div>\n \u003c/section>\n \u003csection class=\"panel\" id=\"equipment\" aria-labelledby=\"equipmentTitle\" hidden>\n  \u003ch2 id=\"equipmentTitle\">Equipment condition\u003c/h2>\u003cp class=\"sub\">Select the condition of each item and add notes. Enter a quantity for fire extinguishers.\u003c/p>\u003cdiv id=\"equipmentItems\">\u003c/div>\n \u003c/section>\n \u003csection class=\"panel\" id=\"condition\" aria-labelledby=\"conditionTitle\" hidden>\n  \u003ch2 id=\"conditionTitle\">Condition &amp; preparation\u003c/h2>\u003cp class=\"sub\">Record the water and sewer tank status, winterization, and condition of each component. Add notes wherever needed.\u003c/p>\u003cdiv id=\"conditionItems\">\u003c/div>\u003cdiv id=\"otherItems\">\u003c/div>\u003cbutton type=\"button\" class=\"button\" id=\"addOther\">Add another other\u003c/button>\n \u003c/section>\n \u003csection class=\"panel\" id=\"notesPanel\" aria-labelledby=\"notesTitle\" hidden>\n  \u003ch2 id=\"notesTitle\">Accessories &amp; notes\u003c/h2>\n  \u003clabel for=\"accessories\">Accessories\u003c/label>\u003ctextarea id=\"accessories\" data-key=\"accessories\" rows=\"4\">\u003c/textarea>\n  \u003cdiv class=\"notes\">\u003clabel for=\"notes\">Additional comments / repairs needed\u003c/label>\u003ctextarea id=\"notes\" data-key=\"notes\" rows=\"5\">\u003c/textarea>\u003c/div>\n \u003c/section>\n \u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden>\n  \u003ch2 id=\"reviewTitle\">Review &amp; open email\u003c/h2>\u003cp class=\"sub\">The completed inspection goes in the email body. Review the draft in your email app, then send it.\u003c/p>\n  \u003cdiv id=\"completion\" class=\"notice\">\u003c/div>\n  \u003cdiv class=\"recipients\">\u003cstrong>Email recipients\u003c/strong>\u003cspan id=\"recipientList\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"actions\">\u003ca class=\"button primary\" id=\"openEmail\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">Open filled-out email\u003c/a>\u003c/div>\n  \u003cp class=\"status\" id=\"mailStatus\" role=\"status\">\u003c/p>\n  \u003clabel for=\"reportText\">Complete email body\u003c/label>\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\">\u003c/textarea>\n  \u003cp class=\"field-help\">The completed email should end with END OF INSPECTION.\u003c/p>\n  \u003cdetails class=\"backup\" id=\"backup\">\u003csummary>Backup if the email opens with missing text\u003c/summary>\n   \u003cp class=\"sub\">If your phone limits the email text, copy the full report, open the addressed email, and paste it into the body.\u003c/p>\n   \u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"button\" id=\"copyReport\">1. Copy full report\u003c/button>\u003ca class=\"button\" id=\"shortEmail\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">2. Open email to paste\u003c/a>\u003c/div>\n   \u003cbutton type=\"button\" class=\"button\" id=\"selectReport\">Select report for manual copy\u003c/button>\u003cp class=\"status\" id=\"copyStatus\" role=\"status\">\u003c/p>\n   \u003cp class=\"field-help\">If your device blocks copying or opening email from this browser, use your approved email app with the addresses and report shown above.\u003c/p>\n  \u003c/details>\n \u003c/section>\n\u003c/div>\n\u003cdiv class=\"foot\" id=\"foot\" hidden>\u003cbutton class=\"button\" id=\"back\" type=\"button\">Back\u003c/button>\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\">Next\u003c/button>\u003c/div>\n\u003cfooter class=\"bottom\">\u003csmall id=\"draftStatus\" role=\"status\">Your entries stay here while you fill out the form.\u003c/small>\u003cbutton class=\"button\" id=\"clear\" type=\"button\">Start over\u003c/button>\u003c/footer>\n\u003c/main>\n\u003cscript id=\"inspectionTextLayout\">var InspectionTextLayout=(function(){\n'use strict';\nvar COLUMN=24,WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length>width){\n   var end=width;while(end>0&&!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))&&/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){\n  var pending=[];\n  function full(item){line(item.title+' | '+(item.values||[]).join('; '));if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);}\n  function flush(){\n   if(pending.length\u003c3){pending.forEach(full);pending=[];return;}\n   var row=pending,cells=row.map(function(item){return wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN);}),height=Math.max.apply(null,cells.map(function(c){return c.length;}));\n   for(var i=0;i\u003cheight;i++){\n    lines.push(cells.map(function(c){return (c[i]||'').padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));\n   }\n   row.forEach(function(item){if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);});\n   pending=[];\n  }\n  items.forEach(function(item){var height=wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN).length;if(height>4){flush();full(item);}else{pending.push(item);if(pending.length===3)flush();}});flush();\n }\n function fields(list){\n  var row=[];\n  function flush(){if(row.length){lines.push(row.map(function(s){return s.padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));row=[];}}\n  list.forEach(function(f){var entry=f[0]+': '+text(f[1]);if(entry.length>COLUMN||/[\\r\\n]/.test(entry)){flush();line(entry);}else{row.push(entry);if(row.length===3)flush();}});flush();\n }\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script>\n\u003cscript id=\"evConfig\">var EVConfig={\"fields\": [{\"key\": \"asset\", \"label\": \"Asset number\", \"type\": \"text\"}, {\"key\": \"technician\", \"label\": \"Technician / inspector name\", \"type\": \"text\"}, {\"key\": \"date\", \"label\": \"Inspection date\", \"type\": \"date\"}, {\"key\": \"associatedSE\", \"label\": \"Associated SE# (if available)\", \"type\": \"text\"}, {\"key\": \"inspectionType\", \"label\": \"Inspection type\", \"type\": \"select\", \"options\": [\"In\", \"Out\", \"Yard\"]}, {\"key\": \"evType\", \"label\": \"EV type\", \"type\": \"select\", \"options\": [\"53 ft\", \"20 ft 2 stall\", \"20 ft 1 stall and shower\", \"Other\"]}, {\"key\": \"evTypeOther\", \"label\": \"Other EV type — please specify\", \"type\": \"textarea\"}, {\"key\": \"standbyDate\", \"label\": \"Standby date (if applicable)\", \"type\": \"date\"}, {\"key\": \"rentalCustomer\", \"label\": \"Rental order number or customer name\", \"type\": \"text\"}, {\"key\": \"serial\", \"label\": \"Serial number\", \"type\": \"text\"}, {\"key\": \"hours\", \"label\": \"Hours\", \"type\": \"text\"}, {\"key\": \"fuelLevel\", \"label\": \"Fuel level\", \"type\": \"text\"}], \"groups\": [{\"id\": \"equipment\", \"title\": \"Equipment condition\"}, {\"id\": \"condition\", \"title\": \"Condition & preparation\"}], \"items\": [{\"key\": \"stairsRails\", \"group\": \"equipment\", \"title\": \"Stairs / rails\", \"type\": \"condition\"}, {\"key\": \"platforms\", \"group\": \"equipment\", \"title\": \"Platforms\", \"type\": \"condition\"}, {\"key\": \"landings\", \"group\": \"equipment\", \"title\": \"Landings\", \"type\": \"condition\"}, {\"key\": \"landingPads\", \"group\": \"equipment\", \"title\": \"Landing pads\", \"type\": \"condition\"}, {\"key\": \"levelingLegs\", \"group\": \"equipment\", \"title\": \"Leveling / adjustment legs\", \"type\": \"condition\"}, {\"key\": \"powerCord\", \"group\": \"equipment\", \"title\": \"Main power cord\", \"type\": \"condition\"}, {\"key\": \"fireExtinguisher\", \"group\": \"equipment\", \"title\": \"Fire extinguisher\", \"type\": \"quantity\"}, {\"key\": \"waterEmpty\", \"group\": \"condition\", \"title\": \"Water tank — empty?\", \"type\": \"yesno\"}, {\"key\": \"waterCondition\", \"group\": \"condition\", \"title\": \"Water tank — condition\", \"type\": \"condition\"}, {\"key\": \"sewerEmpty\", \"group\": \"condition\", \"title\": \"Sewer tank — empty?\", \"type\": \"yesno\"}, {\"key\": \"sewerCondition\", \"group\": \"condition\", \"title\": \"Sewer tank — condition\", \"type\": \"condition\"}, {\"key\": \"winterized\", \"group\": \"condition\", \"title\": \"Winterized?\", \"type\": \"yesno\"}, {\"key\": \"sinks\", \"group\": \"condition\", \"title\": \"Sinks\", \"type\": \"condition\"}, {\"key\": \"urinals\", \"group\": \"condition\", \"title\": \"Urinals\", \"type\": \"condition\"}, {\"key\": \"toilets\", \"group\": \"condition\", \"title\": \"Toilets\", \"type\": \"condition\"}, {\"key\": \"stallWallsDoors\", \"group\": \"condition\", \"title\": \"Stall walls and doors\", \"type\": \"condition\"}, {\"key\": \"pumps\", \"group\": \"condition\", \"title\": \"Pumps\", \"type\": \"condition\"}, {\"key\": \"plumbing\", \"group\": \"condition\", \"title\": \"Plumbing\", \"type\": \"condition\"}, {\"key\": \"interiorLights\", \"group\": \"condition\", \"title\": \"Interior lights\", \"type\": \"condition\"}, {\"key\": \"exteriorLights\", \"group\": \"condition\", \"title\": \"Exterior lights\", \"type\": \"condition\"}, {\"key\": \"exitSigns\", \"group\": \"condition\", \"title\": \"Exit signs\", \"type\": \"c class=\"head\">\u003cdiv class=\"brand\">MagTec Alaska\u003c/div>\u003ch1>Trailer Inspection\u003c/h1>\u003cp class=\"sub\">Complete the trailer inspection, then open the filled-out email.\u003c/p>\u003c/header>\n \u003cnav class=\"steps\" aria-label=\"Inspection sections\">\u003cbutton type=\"button\" class=\"step\" data-step=\"0\" aria-controls=\"detailsPanel\">1. Details\u003c/button>\u003cbutton type=\"button\" class=\"step\" data-step=\"1\" aria-controls=\"couplings\">2. Couplings &amp; landing gear\u003c/button>\u003cbutton type=\"button\" class=\"step\" data-step=\"2\" aria-controls=\"body\">3. Frame &amp; body\u003c/button>\u003cbutton type=\"button\" class=\"step\" data-step=\"3\" aria-controls=\"lights\">4. Lights &amp; connections\u003c/button>\u003cbutton type=\"button\" class=\"step\" data-step=\"4\" aria-controls=\"hydraulics\">5. Hydraulics &amp; hoses\u003c/button>\u003cbutton type=\"button\" class=\"step\" data-step=\"5\" aria-controls=\"lifting\">6. Hoist &amp; lifting equipment\u003c/button>\u003cbutton type=\"button\" class=\"step\" data-step=\"6\" aria-controls=\"runningGear\">7. Brakes &amp; suspension\u003c/button>\u003cbutton type=\"button\" class=\"step\" data-step=\"7\" aria-controls=\"tiresPanel\">8. Tires &amp; sign-off\u003c/button>\u003cbutton type=\"button\" class=\"step\" data-step=\"8\" aria-controls=\"review\">9. Review &amp; email\u003c/button>\u003c/nav>\n \u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n \u003cnoscript>Open this page in Safari, Chrome, or Edge with JavaScript enabled to fill out the inspection.\u003c/noscript>\n \u003cdiv class=\"content\" id=\"content\" hidden>\n  \u003cdiv id=\"stepCount\" class=\"step-count\" aria-live=\"polite\">\u003c/div>\n\u003csection class=\"panel\" id=\"detailsPanel\" aria-labelledby=\"detailsTitle\">\u003ch2 id=\"detailsTitle\">Trailer &amp; inspector details\u003c/h2>\u003cp class=\"sub\">Enter the asset details and the name of the person completing the inspection.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"asset\">Asset number\u003c/label>\u003cinput id=\"asset\" data-key=\"asset\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"technician\">Technician / inspector name\u003c/label>\u003cinput id=\"technician\" data-key=\"technician\" type=\"text\" autocomplete=\"name\">\u003cp class=\"field-help\">Your name supplies initials for each selected inspection result.\u003c/p>\u003c/div>\u003cdiv>\u003clabel for=\"date\">Inspection date\u003c/label>\u003cinput id=\"date\" data-key=\"date\" type=\"date\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"associatedSE\">Associated SE# (if available)\u003c/label>\u003cinput id=\"associatedSE\" data-key=\"associatedSE\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"make\">Equipment make\u003c/label>\u003cinput id=\"make\" data-key=\"make\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"year\">Year\u003c/label>\u003cinput id=\"year\" data-key=\"year\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"vin\">VIN number\u003c/label>\u003cinput id=\"vin\" data-key=\"vin\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"description\">Description\u003c/label>\u003cinput id=\"description\" data-key=\"description\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"panel\" id=\"couplings\" aria-labelledby=\"couplingsTitle\" hidden>\u003ch2 id=\"couplingsTitle\">Couplings &amp; landing gear\u003c/h2>\u003cp class=\"legend\">OK = In good condition / ready to use · SR = Service required\u003cbr>RN = Repair / replacement needed · N/A = Not applicable\u003c/p>\u003cdiv id=\"couplingsItems\">\u003c/div>\u003c/section>\u003csection class=\"panel\" id=\"body\" aria-labelledby=\"bodyTitle\" hidden>\u003ch2 id=\"bodyTitle\">Frame &amp; body\u003c/h2>\u003cp class=\"legend\">OK = In good condition / ready to use · SR = Service required\u003cbr>RN = Repair / replacement needed · N/A = Not applicable\u003c/p>\u003cdiv id=\"bodyItems\">\u003c/div>\u003c/section>\u003csection class=\"panel\" id=\"lights\" aria-labelledby=\"lightsTitle\" hidden>\u003ch2 id=\"lightsTitle\">Lights &amp; connections\u003c/h2>\u003cp class=\"legend\">OK = In good condition / ready to use · SR = Service required\u003cbr>RN = Repair / replacement needed · N/A = Not applicable\u003c/p>\u003cdiv id=\"lightsItems\">\u003c/div>\u003c/section>\u003csection class=\"panel\" id=\"hydraulics\" aria-labelledby=\"hydraulicsTitle\" hidden>\u003ch2 id=\"hydraulicsTitle\">Hydraulics &amp; hoses\u003c/h2>\u003cp class=\"legend\">OK = In good condition / ready to use · SR = Service required\u003cbr>RN = Repair / replacement needed · N/A = Not applicable\u003c/p>\u003cdiv id=\"hydraulicsItems\">\u003c/div>\u003c/section>\u003csection class=\"panel\" id=\"lifting\" aria-labelledby=\"liftingTitle\" hidden>\u003ch2 id=\"liftingTitle\">Hoist &amp; lifting equipment\u003c/h2>\u003cp class=\"legend\">OK = In good condition / ready to use · SR = Service required\u003cbr>RN = Repair / replacement needed · N/A = Not applicable\u003c/p>\u003cdiv id=\"liftingItems\">\u003c/div>\u003c/section>\u003csection class=\"panel\" id=\"runningGear\" aria-labelledby=\"runningGearTitle\" hidden>\u003ch2 id=\"runningGearTitle\">Brakes &amp; suspension\u003c/h2>\u003cp class=\"legend\">OK = In good condition / ready to use · SR = Service required\u003cbr>RN = Repair / replacement needed · N/A = Not applicable\u003c/p>\u003cdiv id=\"runningGearItems\">\u003c/div>\u003c/section>\u003csection class=\"panel\" id=\"tiresPanel\" aria-labelledby=\"tiresTitle\" hidden>\n   \u003ch2 id=\"tiresTitle\">Tires - 12 positions\u003c/h2>\n   \u003cp class=\"sub\">Axles are numbered front to rear: 1 = front, 2 = middle, 3 = rear. Driver and passenger sides are viewed facing forward. Each side has an inner and outer tire; inner tires are nearest the chassis.\u003c/p>\n   \u003cp class=\"sub\">Select the condition of each tire and record PSI and tread depth in 32nds of an inch. Add notes or other units as needed.\u003c/p>\u003cdiv id=\"tires\">\u003c/div>\n\u003ch3>Release &amp; sign-off\u003c/h3>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"released\">Unit released to continue service?\u003c/label>\u003cselect id=\"released\" data-key=\"released\">\u003coption value=\"\">Select answer\u003c/option>\u003coption>Yes\u003c/option>\u003coption>No\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"technicianSignoff\">Technician sign-off name (typed)\u003c/label>\u003cinput id=\"technicianSignoff\" data-key=\"technicianSignoff\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"technicianDate\">Technician sign-off date\u003c/label>\u003cinput id=\"technicianDate\" data-key=\"technicianDate\" type=\"date\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"driverSignoff\">Driver sign-off name (typed)\u003c/label>\u003cinput id=\"driverSignoff\" data-key=\"driverSignoff\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"driverDate\">Driver sign-off date\u003c/label>\u003cinput id=\"driverDate\" data-key=\"driverDate\" type=\"date\" autocomplete=\"off\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"notes\">\u003clabel for=\"notes\">Comments / notes\u003c/label>\u003ctextarea id=\"notes\" data-key=\"notes\" rows=\"5\">\u003c/textarea>\u003c/div>\n  \u003c/section>\n  \u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden>\n   \u003ch2 id=\"reviewTitle\">Review &amp; open email\u003c/h2>\u003cp class=\"sub\">The full inspection goes in the email body. Review the draft in your email app, then send it.\u003c/p>\n   \u003cdiv id=\"completion\" class=\"notice\">\u003c/div>\n   \u003cdiv class=\"recipients\">\u003cstrong>Email recipients\u003c/strong>\u003cspan id=\"recipientList\">\u003c/span>\u003c/div>\n   \u003cdiv class=\"actions\">\u003ca id=\"openEmail\" class=\"button primary\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">Open filled-out email\u003c/a>\u003c/div>\n   \u003cp id=\"mailStatus\" class=\"status\" role=\"status\">\u003c/p>\n   \u003clabel for=\"reportText\">Complete email body\u003c/label>\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\">\u003c/textarea>\n   \u003cp class=\"field-help\">Check that your email includes all 12 tire positions and ends with END OF INSPECTION.\u003c/p>\n   \u003cdetails class=\"backup\" id=\"backup\">\u003csummary>Backup if the email opens with missing text\u003c/summary>\n    \u003cp class=\"sub\">This is a long inspection. If your phone limits the email text, copy the complete report, open the addressed email, and paste into the body.\u003c/p>\n    \u003cdiv class=\"actions\">\u003cbutton id=\"copyReport\" class=\"button\" type=\"button\">1. Copy full report\u003c/button>\u003ca id=\"shortEmail\" class=\"button\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">2. Open email to paste\u003c/a>\u003c/div>\n    \u003cbutton id=\"selectReport\" class=\"button\" type=\"button\">Select report for manual copy\u003c/button>\u003cp id=\"copyStatus\" class=\"status\" role=\"status\">\u003c/p>\n    \u003cp class=\"field-help\">If your device blocks copying or opening email from this browser, use your approved email app with the recipient addresses and full report shown above.\u003c/p>\n   \u003c/details>\n  \u003c/section>\n \u003c/div>\n \u003cdiv class=\"foot\" id=\"foot\" hidden>\u003cbutton class=\"button\" id=\"back\" type=\"button\">Back\u003c/button>\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\">Next\u003c/button>\u003c/div>\n \u003cfooter class=\"bottom\">\u003csmall id=\"draftStatus\" role=\"status\">Your entries stay here while you fill out the form.\u003c/small>\u003cbutton class=\"button\" id=\"clear\" type=\"button\">Start over\u003c/button>\u003c/footer>\n\u003c/main>\u003cscript id=\"inspectionTextLayout\">var InspectionTextLayout=(function(){\n'use strict';\nvar COLUMN=24,WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length>width){\n   var end=width;while(end>0&&!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))&&/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){\n  var pending=[];\n  function full(item){line(item.title+' | '+(item.values||[]).join('; '));if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);}\n  function flush(){\n   if(pending.length\u003c3){pending.forEach(full);pending=[];return;}\n   var row=pending,cells=row.map(function(item){return wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN);}),height=Math.max.apply(null,cells.map(function(c){return c.length;}));\n   for(var i=0;i\u003cheight;i++){\n    lines.push(cells.map(function(c){return (c[i]||'').padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));\n   }\n   row.forEach(function(item){if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);});\n   pending=[];\n  }\n  items.forEach(function(item){var height=wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN).length;if(height>4){flush();full(item);}else{pending.push(item);if(pending.length===3)flush();}});flush();\n }\n function fields(list){\n  var row=[];\n  function flush(){if(row.length){lines.push(row.map(function(s){return s.padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));row=[];}}\n  list.forEach(function(f){var entry=f[0]+': '+text(f[1]);if(entry.length>COLUMN||/[\\r\\n]/.test(entry)){flush();line(entry);}else{row.push(entry);if(row.length===3)flush();}});flush();\n }\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script>\n\u003cscript>var TrailerConfig={\"legacyItemNumbers\": [\"1a\", \"1b\", \"1c\", \"2a\", \"2b\", \"2c\", \"3a\", \"3b\", \"3c\", \"3d\", \"3e\", \"4\", \"5a\", \"5b\", \"6a\", \"6b\", \"6c\", \"7a\", \"7b\", \"7c\", \"7d\", \"8a\", \"8b\", \"8c\", \"8d\", \"8e\", \"8f\", \"8g\", \"8h\", \"8i\", \"8j\", \"8k\", \"8l\", \"8m\", \"8n\", \"8p\", \"8q\", \"8r\", \"8s\", \"8t\", \"8u\", \"8v\", \"8w\", \"8x\", \"8y\", \"8z\", \"8aa\", \"8ab\", \"8ac\", \"8ad\", \"8ae\", \"8af\", \"9a\", \"9b\", \"9c\", \"10a\", \"10b\", \"10c\", \"10d\", \"10e\", \"11a\", \"11b\", \"11c\", \"11d\", \"12\", \"13\", \"14a\", \"14b\", \"14c\", \"14d\", \"14e\", \"15\", \"16\", \"17\"], \"groups\": [{\"id\": \"couplings\", \"title\": \"Couplings & landing gear\"}, {\"id\": \"body\", \"title\": \"Frame & body\"}, {\"id\": \"lights\", \"title\": \"Lights & connections\"}, {\"id\": \"hydraulics\", \"title\": \"Hydraulics & hoses\"}, {\"id\": \"lifting\", \"title\": \"Hoist & lifting equipment\"}, {\"id\": \"runningGear\", \"title\": \"Brakes & suspension\"}], \"items\": [{\"group\": \"hydraulics\", \"number\": \"1a\", \"label\": \"Hydraulic components: valves\", \"readings\": [], \"displayNumber\": 16}, {\"group\": \"hydraulics\", \"number\": \"2a\", \"label\": \"Hydraulic hoses: abrasion\", \"readings\": [], \"displayNumber\": 17}, {\"group\": \"hydraulics\",  if(!report){el('combinedError').hidden=false;return;}
 flow.inspectionReport=report;flow.controls=bridge.snapshot();saveFlow();
 var body=flow.worksheet.body+'\r\n\r\n'+report;
 el('combinedReport').value=body;el('combinedEmail').disabled=false;syncWorksheet();
}
function renderCombined(){
 if(!flow||!flow.finished){renderInspection();return;}
 hideViews();el('views').hidden=true;el('combinedView').hidden=false;active='SEFill';mode='combinedReview';chrome('Worksheet & Inspection',true);fillCombined();
}
function renderRoute(route){if(route==='WorksheetInspection')renderInspection();else if(route==='WorksheetCombined')renderCombined();else normalRoute(route||'Dashboard');}
function navigate(route){cancelEmail();if(window.location.hash!=='#'+route)window.location.hash=route;renderRoute(route);}
function show(key){navigate(known(key)?key:'Dashboard');}
function fromHash(){var route;try{route=decodeURIComponent(window.location.hash.slice(1));}catch(e){route='Dashboard';}cancelEmail();renderRoute(route);}
function beginInspection(key,packet){
 if(INSPECTIONS.indexOf(key)<0||!packet||typeof packet.body!=='string')return;
 if(flow&&flow.key!==key&&comboFrame){comboFrame.remove();comboFrame=null;}
 if(!flow)flow={version:1,id:Date.now().toString(36)+'_'+Math.random().toString(36).slice(2),key:key,worksheet:packet,finished:false,seeded:false,controls:{},storageNames:[]};
 else if(flow.key!==key){flow.key=key;flow.finished=false;flow.seeded=false;flow.controls={};flow.inspectionReport='';}
 flow.worksheet=packet;saveFlow();syncWorksheet();navigate('WorksheetInspection');
}
function cancelCombination(returnToWorksheet){
 if(flow){(flow.storageNames||[]).forEach(function(key){try{localStorage.removeItem(key);}catch(e){}});}
 flow=null;saveFlow();if(comboFrame){comboFrame.remove();comboFrame=null;}syncWorksheet();
 if(returnToWorksheet){navigate('SEFill');var app=worksheetApp();if(app)app.goTo(3);}
}
function requestEmail(key,uri){
 if(key!==active||!emailUri([key],'North Slope',uri))return;
 if(mode==='inspection'&&flow&&flow.key===key){flow.finished=true;var at=uri.indexOf('?');flow.inspectionReport=new URLSearchParams(at<0?'':uri.slice(at+1)).get('body')||'';flow.worksheet=latestWorksheet()||flow.worksheet;saveFlow();syncWorksheet();navigate('WorksheetCombined');return;}
 if(key==='SEFill'&&flow){flow.worksheet=latestWorksheet()||flow.worksheet;saveFlow();navigate(flow.finished?'WorksheetCombined':'WorksheetInspection');return;}
 dispatch([key],uri);
}
function sendCombined(){
 if(!flow)return;fillCombined();if(el('combinedEmail').disabled)return;
 var subject=flow.worksheet.subject+' + '+docs[flow.key].title;
 dispatch(['SEFill',flow.key],'mailto:?subject='+encode(subject)+'&body='+encode(el('combinedReport').value));
}
window.MagTecPortal={show:show,requestEmail:requestEmail,beginInspection:beginInspection,cancelCombination:cancelCombination,updateWorksheet:updateWorksheet,worksheetReady:syncWorksheet,inspectionReady:inspectionReady,inspectionChanged:inspectionChanged};
el('dashboardButton').addEventListener('click',function(){show('Dashboard');});
el('dispatchNorthSlope').addEventListener('click',function(){sendEmail('North Slope');});el('dispatchKenai').addEventListener('click',function(){sendEmail('Kenai');});el('dispatchCancel').addEventListener('click',cancelEmail);el('dispatchDialog').addEventListener('cancel',cancelEmail);
el('combinedEmail').addEventListener('click',sendCombined);
el('editWorksheet').addEventListener('click',function(){navigate('SEFill');var app=worksheetApp();if(app)app.goTo(0);});
el('editInspection').addEventListener('click',function(){navigate('WorksheetInspection');var bridge=comboBridge();if(bridge)bridge.edit();});
el('cancelCombinedReview').addEventListener('click',function(){cancelCombination(true);});
window.addEventListener('hashchange',fromHash);fromHash();
})();
</script>
</body>

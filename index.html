<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>MagTec Alaska | Forms &amp; Requests</title>
<style>
:root{color-scheme:dark;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#14181c;color:#eef1f4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
[hidden]{display:none!important}
.toolbar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 20px;border-bottom:1px solid #36404a;background:#1c2127}
.toolbar button{min-height:42px;border:1px solid #f5a623;background:#f5a623;color:#211809;font:600 14px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:6px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.toolbar button:focus-visible{outline:3px solid #eef1f4;outline-offset:2px}
.toolbar span{font-size:14px;font-weight:600;text-align:right}
#views{height:100vh;height:100dvh}
body.form-open #views{height:calc(100vh - 60px);height:calc(100dvh - 60px)}
.view{display:block;width:100%;height:100%;border:0;background:#14181c}
noscript{display:block;padding:24px}
@media(max-width:560px){.toolbar{padding:8px 12px}.toolbar span{font-size:12px}.toolbar button{padding:9px 11px}}
dialog{color:#eef1f4;background:#1c2127;border:1px solid #36404a;border-radius:12px;padding:24px;width:calc(100% - 32px);max-width:440px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font-size:20px;margin:0 0 20px;font-weight:600}
.location-options{display:flex;gap:12px;margin-bottom:18px}
dialog button{min-height:48px;padding:12px;border:1px solid #36404a;border-radius:7px;background:#14181c;color:#eef1f4;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}
.location-options button{flex:1;min-width:0;background:#f5a623;border-color:#f5a623;color:#211809}
dialog button:focus-visible{outline:3px solid #eef1f4;outline-offset:3px}
.combined-view{height:calc(100vh - 60px);height:calc(100dvh - 60px);overflow:auto;padding:20px 12px 32px}
.combined-card{max-width:880px;margin:auto;background:#1c2127;border:1px solid #36404a;border-radius:12px;padding:24px}
.combined-card h1{font-size:24px;font-weight:600;margin:0 0 20px}
.combined-card label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.combined-card textarea{width:100%;background:#14181c;color:#eef1f4;border:1px solid #36404a;border-radius:6px;padding:12px;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical;min-height:420px}
.combined-actions{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 18px}
.combined-actions:last-child{margin:18px 0 0}
.combined-button{flex:1;min-height:48px;padding:12px 16px;border:1px solid #36404a;border-radius:7px;background:#14181c;color:#eef1f4;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}
.combined-button.primary{background:#f5a623;border-color:#f5a623;color:#211809}
.combined-button:disabled{opacity:.5;cursor:default}
.combined-button:focus-visible{outline:3px solid #eef1f4;outline-offset:3px}
.toolbar span{max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){.combined-view{padding:0}.combined-card{border:0;border-radius:0;padding:20px 16px}.combined-card h1{font-size:22px}}
</style>
</head>
<body>
<header class="toolbar" id="toolbar" hidden>
<button id="dashboardButton" type="button">← Dashboard</button>
<span id="formTitle"></span>
</header>
<main id="views"></main>
<section id="combinedView" class="combined-view" hidden>
<div class="combined-card"><h1>Worksheet &amp; Inspection</h1>
<div class="combined-actions"><button id="combinedEmail" class="combined-button primary" type="button">Open Email</button></div>
<div class="combined-actions"><button id="editWorksheet" class="combined-button" type="button">Edit Worksheet</button><button id="editInspection" class="combined-button" type="button">Edit Inspection</button></div>
<p id="combinedError" hidden>The inspection could not be loaded. Open Edit Inspection and try again.</p>
<label for="combinedReport">Complete email body</label><textarea id="combinedReport" readonly spellcheck="false" rows="24"></textarea>
<div class="combined-actions"><button id="cancelCombinedReview" class="combined-button" type="button">Cancel Combination</button></div>
</div></section>
<dialog id="dispatchDialog" aria-labelledby="dispatchTitle">
<h2 id="dispatchTitle">Location</h2>
<div class="location-options"><button id="dispatchNorthSlope" type="button">North Slope</button><button id="dispatchKenai" type="button">Kenai</button></div>
<button id="dispatchCancel" type="button">Cancel</button>
</dialog>

0 8px}\n#magtec-sections .mp-description{color:var(--mp-sub);font-size:14px;line-height:1.6;margin:0 0 18px;flex:1}\n#magtec-sections .mp-open{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;color:var(--mp-ink);background:var(--mp-amber);border:1px solid var(--mp-amber);border-radius:6px;padding:10px 13px;min-height:44px;font-size:14px;font-weight:600}\n#magtec-sections .mp-open:hover{background:#ffbb4d;border-color:#ffbb4d}\n#magtec-sections .mp-repo{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--mp-sub);text-decoration:none;font-size:11px;margin-top:9px;min-height:30px}\n#magtec-sections .mp-repo:hover{color:var(--mp-text);text-decoration:underline}\n#magtec-sections .mp-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mp-sub);border-top:1px solid var(--mp-line);font-size:11px;margin-top:28px;padding-top:18px}\n#magtec-sections .mp-footer p{margin:0}\n@media(max-width:600px){#magtec-sections .mp-submenu{grid-template-columns:minmax(0,1fr);padding:12px}#magtec-sections .mp-main{padding:26px 16px}#magtec-sections .mp-bar{padding:20px 16px}#magtec-sections .mp-bar-label{font-size:11px;max-width:90px;text-align:right}#magtec-sections h1{font-size:28px}#magtec-sections summary{padding:18px 14px;gap:12px}#magtec-sections .mp-section-title{font-size:19px}#magtec-sections .mp-section-sub{font-size:12px}#magtec-sections .mp-tool{padding:18px}#magtec-sections .mp-repo{min-height:44px}}\n\n#magtec-sections .mp-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 20px}\n#magtec-sections .mp-direct{display:flex;align-items:center;gap:16px;min-width:0;min-height:88px;padding:18px 22px;border:1px solid var(--mp-line);border-radius:10px;background:var(--mp-panel);color:var(--mp-text);text-decoration:none}\n#magtec-sections .mp-direct::after{content:'\\2192';margin-left:auto;color:var(--mp-amber);font-size:24px}\n#magtec-sections .mp-direct:hover{background:#252c34;border-color:#846333}\n#magtec-sections .mp-direct .mp-section-title{font-size:19px}\n#magtec-sections .mp-service-groups{display:grid;gap:12px;padding:16px;border-top:1px solid var(--mp-line);background:var(--mp-bg);border-radius:0 0 10px 10px}\n#magtec-sections .mp-subcategory{border:1px solid var(--mp-line);border-radius:8px;background:var(--mp-panel);min-width:0}\n#magtec-sections .mp-subcategory>summary{min-height:64px;padding:16px 18px;border-radius:8px}\n#magtec-sections .mp-subcategory>summary .mp-section-title{font-size:18px}\n@media(max-width:600px){#magtec-sections .mp-shortcuts{grid-template-columns:minmax(0,1fr);gap:12px}#magtec-sections .mp-direct{min-height:76px;padding:16px 14px;gap:12px}#magtec-sections .mp-service-groups{padding:12px}#magtec-sections .mp-subcategory>summary{padding:16px 14px}}\n\u003c/style>\n\u003cdiv id=\"magtec-sections\">\n  \u003cheader class=\"mp-bar\">\n    \u003cdiv class=\"mp-brand\">MAG\u003cspan>TEC\u003c/span>\u003csmall class=\"mp-alaska\">ALASKA\u003c/small>\u003c/div>\n    \u003cdiv class=\"mp-bar-label\">Operations portal\u003c/div>\n  \u003c/header>\n  \u003cmain class=\"mp-main\">\n    \u003cdiv class=\"mp-eyebrow\">Field &amp; shop resources\u003c/div>\n    \u003ch1>Forms &amp; requests\u003c/h1>\n    \u003cp class=\"mp-intro\">Choose a section, then open the form you need.\u003c/p>\n    \u003cnav class=\"mp-shortcuts\" aria-label=\"Quick forms\">\n      \u003ca class=\"mp-direct cursor-interaction\" href=\"#HourLOG\" data-form=\"HourLOG\">\u003cspan class=\"mp-symbol\" aria-hidden=\"true\">HR\u003c/span>\u003cspan class=\"mp-section-title\">Hours Entry\u003c/span>\u003c/a>\n      \u003ca class=\"mp-direct cursor-interaction\" href=\"#SpotSwap\" data-form=\"SpotSwap\">\u003cspan class=\"mp-symbol\" aria-hidden=\"true\">ES\u003c/span>\u003cspan class=\"mp-section-title\">Equipment Swap\u003c/span>\u003c/a>\n    \u003c/nav>\n    \u003cdetails class=\"mp-section\">\n      \u003csummary class=\"cursor-interaction\">\u003cspan class=\"mp-symbol\" aria-hidden=\"true\">SE\u003c/span>\u003cspan>\u003cspan class=\"mp-section-title\">Service\u003c/span>\u003cspan class=\"mp-section-sub\">Service orders &amp; inspections\u003c/span>\u003c/span>\u003c/summary>\n      \u003cdiv class=\"mp-service-groups\">\n        \u003cdetails class=\"mp-subcategory\">\n          \u003csummary class=\"cursor-interaction\">\u003cspan class=\"mp-section-title\">Service Orders\u003c/span>\u003c/summary>\n          \u003cnav class=\"mp-submenu\" aria-label=\"Service Orders submenu\">\n\u003carticle class=\"mp-tool\">\n          \u003ch2>SE Request\u003c/h2>\n          \u003cp class=\"mp-description\">Request work on an asset. Include the issue, location, priority, and your contact information.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#REQ\" data-form=\"REQ\" aria-label=\"Open Service Order Request\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n\u003carticle class=\"mp-tool\">\n          \u003ch2>Worksheet\u003c/h2>\n          \u003cp class=\"mp-description\">Record service work, repairs, parts used, and labor time. Prepare the completed worksheet for email.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#SEFill\" data-form=\"SEFill\" aria-label=\"Open Service Order Worksheet\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n          \u003c/nav>\n        \u003c/details>\n        \u003cdetails class=\"mp-subcategory\">\n          \u003csummary class=\"cursor-interaction\">\u003cspan class=\"mp-section-title\">Inspection Forms\u003c/span>\u003c/summary>\n          \u003cnav class=\"mp-submenu\" aria-label=\"Inspection Forms submenu\">\n\u003carticle class=\"mp-tool\">\n          \u003ch2>ACB Inspection\u003c/h2>\n          \u003cp class=\"mp-description\">Complete the ACB inspection checklist, identify needed repairs, and prepare the inspection email.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#ACBinsp\" data-form=\"ACBinsp\" aria-label=\"Open ACB Inspection\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n\u003carticle class=\"mp-tool\">\n          \u003ch2>Light Duty Inspection\u003c/h2>\n          \u003cp class=\"mp-description\">Complete the light duty vehicle checklist, record tire readings and comments, and prepare the inspection email.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#LDinsp\" data-form=\"LDinsp\" aria-label=\"Open Light Duty Inspection\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n\u003carticle class=\"mp-tool\">\n          \u003ch2>Heavy Duty Inspection\u003c/h2>\n          \u003cp class=\"mp-description\">Complete the tractor inspection, record tire and brake readings, and prepare the inspection email.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#HDinsp\" data-form=\"HDinsp\" aria-label=\"Open Heavy Duty Inspection\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n\u003carticle class=\"mp-tool\">\n          \u003ch2>Tank Inspection\u003c/h2>\n          \u003cp class=\"mp-description\">Inspect 400 BBL and 600 BBL tanks for In, Out, or Yard use. Record equipment and foam conditions.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#TANKinsp\" data-form=\"TANKinsp\" aria-label=\"Open Tank Inspection\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n\u003carticle class=\"mp-tool\">\n          \u003ch2>EV Inspection\u003c/h2>\n          \u003cp class=\"mp-description\">Inspect Envirovac units, check tanks and interior components, and record conditions and repair notes.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#EVinsp\" data-form=\"EVinsp\" aria-label=\"Open EV Inspection\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n\u003carticle class=\"mp-tool\">\n          \u003ch2>Trailer Inspection\u003c/h2>\n          \u003cp class=\"mp-description\">Inspect trailer components, brakes, suspension, landing gear, and all 12 tire positions.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#TRLinsp\" data-form=\"TRLinsp\" aria-label=\"Open Trailer Inspection\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n          \u003c/nav>\n        \u003c/details>\n      \u003c/div>\n    \u003c/details>\n    \u003cdetails class=\"mp-section\">\n      \u003csummary class=\"cursor-interaction\">\u003cspan class=\"mp-symbol\" aria-hidden=\"true\">FW\u003c/span>\u003cspan>\u003cspan class=\"mp-section-title\">Facilities\u003c/span>\u003cspan class=\"mp-section-sub\">Fuel, water/sewer &amp; trash requests\u003c/span>\u003c/span>\u003c/summary>\n      \u003cnav class=\"mp-submenu\" aria-label=\"Facilities submenu\">\n        \u003carticle class=\"mp-tool\">\n          \u003ch2>Fuel Request\u003c/h2>\n          \u003cp class=\"mp-description\">Request gas, diesel, or both. Record gallons, asset, location, and priority.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#Fuel\" data-form=\"Fuel\" aria-label=\"Open Fuel Request\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n        \u003c/article>\n        \u003carticle class=\"mp-tool\">\n          \u003ch2>Water/Sewer Request\u003c/h2>\n          \u003cp class=\"mp-description\">Request water, sewer service, or both. Include water-connex gallons when applicable.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#Facil\" data-form=\"Facil\" aria-label=\"Open Water/Sewer Request\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n        \u003c/article>\n              \u003carticle class=\"mp-tool\">\n          \u003ch2>Trash Pickup Request\u003c/h2>\n          \u003cp class=\"mp-description\">Request pickup for an almost full or full dumpster.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#Trash\" data-form=\"Trash\" aria-label=\"Open Trash Pickup Request\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n        \u003c/article>\n      \u003c/nav>\n    \u003c/details>\n    \u003cdetails class=\"mp-section\">\n      \u003csummary class=\"cursor-interaction\">\u003cspan class=\"mp-symbol\" aria-hidden=\"true\">GS\u003c/span>\u003cspan>\u003cspan class=\"mp-section-title\">Billeting\u003c/span>\u003cspan class=\"mp-section-sub\">Guest stays &amp; arrival details\u003c/span>\u003c/span>\u003c/summary>\n      \u003cnav class=\"mp-submenu mp-single\" aria-label=\"Billeting submenu\">\n        \u003carticle class=\"mp-tool\">\n          \u003ch2>Guest Stay\u003c/h2>\n          \u003cp class=\"mp-description\">Submit guest details, arrival and departure dates, a purchase order, and an internal project code.\u003c/p>\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#BillREQ\" data-form=\"BillREQ\" aria-label=\"Open Guest Stay\">Open form \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/a>\n          \n        \u003c/article>\n      \u003c/nav>\n    \u003c/details>\n    \n  \u003c/main>\n\u003c/div>\n\n\u003cscript>\n(function(){\n'use strict';\ndocument.querySelectorAll('[data-form]').forEach(function(link){\nlink.addEventListener('click',function(event){event.preventDefault();window.parent.MagTecPortal.show(link.dataset.form);});\n});\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"},"REQ":{"title":"Service Order Request","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#14181c\">\n\u003ctitle>Service Order Request\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark;--bg:#14181c;--panel:#1c2127;--line:#36404a;--text:#eef1f4;--amber:#f5a623}\n*{box-sizing:border-box}[hidden]{display:none!important}\nbody{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 12px 32px}\n.app{max-width:880px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}\nheader{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}\nh1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 0}h2{font-size:20px;font-weight:600;margin:0 0 18px}\n.content{padding:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}.wide{grid-column:1/-1}\nlabel{display:block;font-size:14px;font-weight:600;margin-bottom:7px}\ninput,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:16px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif}\ninput,select{min-height:48px}textarea{resize:vertical;min-height:88px}#reportText{font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:280px}\ninput:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}\n.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}\nbutton{flex:1;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;color:var(--text);background:var(--bg);font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}\nbutton.primary{background:var(--amber);border-color:var(--amber);color:#211809}button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}\n@media(max-width:620px){body{padding:0}.app{border:0;border-radius:0}header,.content{padding:20px 16px}.fields{grid-template-columns:1fr}h1{font-size:22px}.actions button{flex:1 1 120px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"app\">\n\u003cheader>\u003cdiv class=\"brand\">MagTec Alaska\u003c/div>\u003ch1>Service Order Request\u003c/h1>\u003c/header>\n\u003cdiv class=\"content\">\n\u003csection id=\"entryPanel\" aria-label=\"Details\">\n\u003cform id=\"entryForm\">\u003cdiv id=\"fields\" class=\"fields\">\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton id=\"reviewButton\" class=\"primary\" type=\"submit\">Review\u003c/button>\u003cbutton id=\"clearEntry\" type=\"button\">Start Over\u003c/button>\u003c/div>\u003c/form>\n\u003c/section>\n\u003csection id=\"reviewPanel\" aria-labelledby=\"reviewTitle\" hidden>\n\u003ch2 id=\"reviewTitle\">Review\u003c/h2>\n\u003clabel for=\"reportText\">Email body\u003c/label>\u003ctextarea id=\"reportText\" readonly spellcheck=\"false\" rows=\"14\">\u003c/textarea>\n\u003cdiv class=\"actions\">\u003cbutton id=\"openEmail\" class=\"primary\" type=\"button\">Open Email\u003c/button>\u003cbutton id=\"edit\" type=\"button\">Edit\u003c/button>\u003cbutton id=\"clearReview\" type=\"button\">Start Over\u003c/button>\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003c/main>\n\u003cscript>\nvar CompactConfig={\"key\": \"REQ\", \"title\": \"Service Order Request\", \"subjectField\": \"assetNo\", \"fields\": [{\"key\": \"name\", \"label\": \"Your name\", \"autocomplete\": \"name\"}, {\"key\": \"phone\", \"label\": \"Contact phone number\", \"autocomplete\": \"tel\"}, {\"key\": \"assetNo\", \"label\": \"Asset number\"}, {\"key\": \"location\", \"label\": \"Where is the asset right now?\"}, {\"key\": \"priority\", \"label\": \"Priority level\", \"options\": [[\"LOW\", \"Low\"], [\"MEDIUM\", \"Med\"], [\"HIGH\", \"High\"]]}, {\"key\": \"complaint\", \"label\": \"Description of complaint\", \"type\": \"textarea\", \"wide\": true}]};\n(function(C){\n'use strict';\nvar KEY='magtec-compact-'+C.key+'-v1',state=fresh();\nfunction el(id){return document.getElementById(id);}\nfunction today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\nfunction fresh(){var data={};C.fields.forEach(function(f){data[f.key]=f.today?today():'';});return data;}\ntry{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved)C.fields.forEach(function(f){var v=saved[f.key];if(typeof v==='string'&&(!f.options||v===''||f.options.some(function(o){return (typeof o==='string'?o:o[0])===v;})))state[f.key]=v;});}catch(e){}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}\nfunction visible(f){return !f.when||f.when.every(function(condition){return condition.values.indexOf(state[condition.key])>=0;});}\nfunction updateVisibility(){C.fields.forEach(function(f){el('field-'+f.key).hidden=!visible(f);});}\nfunction option(select,value,text){var n=document.createElement('option');n.value=value;n.textContent=text;select.appendChild(n);}\nC.fields.forEach(function(f){\n var wrap=document.createElement('div');wrap.id='field-'+f.key;if(f.wide)wrap.className='wide';\n var label=document.createElement('label');label.htmlFor=f.key;label.textContent=f.label;\n var input=document.createElement(f.options?'select':f.type==='textarea'?'textarea':'input');input.id=f.key;input.name=f.key;input.dataset.key=f.key;\n if(f.options){option(input,'','Select');f.options.forEach(function(o){option(input,typeof o==='string'?o:o[0],typeof o==='string'?o:o[1]);});}\n else if(f.type==='textarea')input.rows=3;\n else{input.type=f.type==='date'?'date':'text';input.autocomplete=f.autocomplete||'off';}\n input.value=state[f.key];\n function changed(){state[f.key]=input.value;save();updateVisibility();}\n input.addEventListener('input',changed);input.addEventListener('change',changed);wrap.append(label,input);el('fields').appendChild(wrap);\n});\nfunction display(f){var value=state[f.key];if(f.options){var selected=f.options.find(function(o){return (typeof o==='string'?o:o[0])===value;});if(selected&&typeof selected!=='string')value=selected[1];}return value.trim()?value:'Not entered';}\nfunction report(){var lines=[C.title.toUpperCase(),''];C.fields.forEach(function(f){if(visible(f))lines.push(f.label+': '+display(f));});if(C.footer)lines.push('',C.footer);return lines.join('\\n').replace(/\\r\\n|\\r|\\n/g,'\\r\\n');}\nfunction showReview(){save();el('reportText').value=report();el('entryPanel').hidden=true;el('reviewPanel').hidden=false;window.scrollTo(0,0);}\nfunction showEntry(){el('entryPanel').hidden=false;el('reviewPanel').hidden=true;window.scrollTo(0,0);}\nfunction reset(){if(!window.confirm('Clear this form and start over?'))return;state=fresh();C.fields.forEach(function(f){el(f.key).value=state[f.key];});save();updateVisibility();el('reportText').value='';showEntry();}\nfunction encode(value){var s=String(value||'');if(s.toWellFormed)s=s.toWellFormed();else s=s.replace(/[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDFFF]/g,function(m){return m.length===2?m:'\\uFFFD';});return encodeURIComponent(s);}\nel('entryForm').addEventListener('submit',function(event){event.preventDefault();showReview();});\nel('edit').addEventListener('click',showEntry);el('clearEntry').addEventListener('click',reset);el('clearReview').addEventListener('click',reset);\nel('openEmail').addEventListener('click',function(){var detail=state[C.subjectField]||'';window.parent.MagTecPortal.requestEmail(C.key,'mailto:?subject='+encode(C.title+(detail?' - '+detail:''))+'&body='+encode(report()));});\nwindow.CompactForm={report:report,showReview:showReview,showEntry:showEntry};updateVisibility();\n})(CompactConfig);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"SEFill":{"title":"Service Order Worksheet","html":"\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1.0,viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#14181c\">\u003ctitle>MagTec Service Order Worksheet\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--bg:#14181c;--panel:#1c2127;--line:#36404a;--text:#eef1f4;--sub:#adb7c1;--amber:#f5a623}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 12px 32px}.app{max-width:880px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}h1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 8px}h2{font-size:20px;font-weight:600;margin:0 0 8px}p{margin:0 0 16px}.sub{color:var(--sub);font-size:14px}.head p{margin:0}.steps{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}.step{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:6px;min-height:44px;padding:9px 12px;font:600 13px/1.3 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}.step[aria-current=step]{background:var(--amber);border-color:var(--amber);color:#211809}.progress{height:4px;background:var(--line)}#progressFill{height:100%;width:0;background:var(--amber)}.content{padding:24px}.panel[hidden]{display:none!important}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label,.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:16px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif}textarea{resize:vertical;min-height:88px}input,select{min-height:48px}input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.field-help{color:var(--sub);font-size:12px;margin:5px 0 0}.check{padding:18px 0;border-bottom:1px solid var(--line)}.check:first-child{padding-top:0}.check:last-child{border-bottom:0}.item-name{font-size:16px;font-weight:600;margin:0 0 12px}.number{color:var(--amber);display:inline-block;min-width:28px}.check-fields{display:grid;grid-template-columns:150px 90px minmax(0,1fr);gap:12px;align-items:start}.comment textarea{min-height:48px;height:48px}.expiry{margin-top:12px;max-width:290px}.check[data-result=Fail]{border-left:3px solid #ff9389;padding-left:12px}.check[data-result=Pass]{border-left:3px solid #62c994;padding-left:12px}.check[data-result=\"N/A\"]{border-left:3px solid #a5b8cf;padding-left:12px}.tire{border-bottom:1px solid var(--line);padding:18px 0}.tire:first-child{padding-top:0}.tire-name{font-weight:600;margin-bottom:10px}.notes{margin-top:24px}.foot{display:flex;gap:12px;border-top:1px solid var(--line);padding:18px 24px}.button{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);cursor:pointer;text-align:center}.primary{background:var(--amber);border-color:var(--amber);color:#211809}.primary:hover{background:#ffbb4d}.grow{flex:1}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.actions .button{flex:1 1 180px}.notice{padding:14px;border:1px solid #846332;border-radius:7px;background:#30281b;color:var(--text);font-size:14px;margin-bottom:18px}.recipients{padding:14px;background:var(--bg);border-radius:7px;margin:16px 0;overflow-wrap:anywhere;font-size:13px}.recipients strong{display:block;margin-bottom:4px;color:var(--sub)}.report{font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:360px;white-space:pre-wrap}.backup{border:1px solid var(--line);border-radius:7px;padding:14px;margin-top:18px}.backup summary{font-size:14px;font-weight:600;cursor:pointer;min-height:28px}.backup p{margin-top:12px;margin-bottom:8px}.status{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line)}.bottom .button{font-size:12px;min-height:40px;padding:8px 12px}.bottom small{color:var(--sub);font-size:12px}.step-count{font-size:12px;color:var(--sub);margin-bottom:12px}noscript{display:block;padding:24px;color:var(--text)}\n@media(max-width:620px){body{padding:0}.app{border:0;border-radius:0}.head,.content{padding:20px 16px}.steps{padding:12px 16px;gap:5px}.step{flex:1 1 28%;font-size:12px;padding:8px}.fields{grid-template-columns:1fr}.check-fields{grid-template-columns:minmax(0,1fr) 90px}.comment{grid-column:1/-1}.comment textarea{height:72px}.foot,.bottom{padding:16px}.tire .fields{grid-template-columns:1fr 1fr}.report{font-size:13px}.bottom{align-items:flex-start}.head h1{font-size:22px}}\n\n.app [hidden]{display:none!important}\n.check-fields{grid-template-columns:150px 150px minmax(0,1fr)}\n.check[data-repair=\"Yes\"]{border-left:3px solid #ff9389;padding-left:12px}\n.check[data-checked=\"No\"]{border-left:3px solid var(--amber);padding-left:12px}\n@media(max-width:620px){.check-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.comment{grid-column:1/-1}}\ndialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:calc(100% - 32px);max-width:440px}\ndialog::backdrop{background:rgba(0,0,0,.7)}\n.location-options{display:flex;gap:12px;margin:20px 0}\n.location-options .button{flex:1;min-width:0}\n.bottom{justify-content:flex-end}\n\n.part-row{padding:18px 0;border-bottom:1px solid var(--line)}.part-fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.remove-part{margin-top:12px}.bottom{justify-content:flex-end}.button:disabled{opacity:.5;cursor:default}#inspectionChoice{margin:0 0 18px}@media(max-width:620px){.part-fields{grid-template-columns:1fr}}.panel+.panel{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain class=\"app\">\n\u003cheader class=\"head\">\u003cdiv class=\"brand\">MagTec Alaska\u003c/div>\u003ch1>Service Order Worksheet\u003c/h1>\u003c/header>\n\u003cnav class=\"steps\" aria-label=\"Worksheet sections\">\n\u003cbutton type=\"button\" class=\"step\" data-step=\"0\" aria-controls=\"worksheetDetails\">1. Worksheet\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"3\" aria-controls=\"worksheetReview\">2. Review &amp; email\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n\u003cdiv class=\"content\">\u003cdiv class=\"step-count\" id=\"stepCount\" aria-live=\"polite\">\u003c/div>\n\u003csection class=\"panel\" id=\"worksheetDetails\">\u003ch2>Worksheet details\u003c/h2>\u003cdiv class=\"fields\" id=\"detailsFields\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"worksheetWork\" hidden>\u003ch2>Work &amp; service\u003c/h2>\u003cdiv class=\"fields\" id=\"serviceFields\">\u003c/div>\u003cdiv class=\"notes\">\u003clabel for=\"complaint\">Description of complaint\u003c/label>\u003ctextarea id=\"complaint\" data-key=\"complaint\" rows=\"4\">\u003c/textarea>\u003c/div>\u003cdiv class=\"notes\">\u003clabel for=\"correction\">Correction description\u003c/label>\u003ctextarea id=\"correction\" data-key=\"correction\" rows=\"5\">\u003c/textarea>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"worksheetParts\" hidden>\u003ch2>Parts &amp; labor\u003c/h2>\u003cdiv id=\"partsList\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"button\" id=\"addPart\" type=\"button\">Add Part\u003c/button>\u003c/div>\u003cdiv class=\"notes\">\u003clabel for=\"laborTime\">Labor time\u003c/label>\u003cinput id=\"laborTime\" data-key=\"laborTime\" type=\"text\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"worksheetReview\" hidden>\u003ch2>Review worksheet\u003c/h2>\u003cdiv class=\"actions\">\u003cbutton class=\"button primary\" id=\"worksheetEmail\" type=\"button\">Open Email\u003c/button>\u003cbutton class=\"button\" id=\"combineInspection\" type=\"button\">Combine with Inspection\u003c/button>\u003c/div>\n\u003cdiv id=\"inspectionChoice\" hidden>\u003clabel for=\"inspectionType\">Inspection type\u003c/label>\u003cselect id=\"inspectionType\">\u003coption value=\"\">Select inspection\u003c/option>\u003coption value=\"ACBinsp\">ACB Inspection\u003c/option>\u003coption value=\"EVinsp\">EV Inspection\u003c/option>\u003coption value=\"HDinsp\">Heavy Duty Inspection\u003c/option>\u003coption value=\"LDinsp\">Light Duty Inspection\u003c/option>\u003coption value=\"TANKinsp\">Tank Inspection\u003c/option>\u003coption value=\"TRLinsp\">Trailer Inspection\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"actions\" id=\"cancelCombinationRow\" hidden>\u003cbutton class=\"button\" id=\"cancelCombination\" type=\"button\">Cancel Combination\u003c/button>\u003c/div>\n\u003clabel for=\"worksheetReport\">Complete email body\u003c/label>\u003ctextarea id=\"worksheetReport\" class=\"report\" rows=\"18\" readonly spellcheck=\"false\">\u003c/textarea>\u003c/section>\n\u003c/div>\n\u003cdiv class=\"foot\">\u003cbutton class=\"button\" id=\"worksheetBack\" type=\"button\">Back\u003c/button>\u003cbutton class=\"button primary grow\" id=\"worksheetNext\" type=\"button\">Next\u003c/button>\u003c/div>\n\u003cfooter class=\"bottom\">\u003cbutton class=\"button\" id=\"worksheetClear\" type=\"button\">Start Over\u003c/button>\u003c/footer>\n\u003c/main>\n\u003cscript id=\"worksheetLogic\">var WorksheetReport=(function(){\n'use strict';\nvar fields=[\n {key:'techName',label:'Technician name',group:'details'},\n {key:'division',label:'Division',group:'details'},\n {key:'project',label:'Project',group:'details'},\n {key:'date',label:'Date',type:'date',group:'details'},\n {key:'assetNo',label:'Asset number',group:'details'},\n {key:'serviceOrderNo',label:'Service order (SE) number',group:'details'},\n {key:'hours',label:'Current Asset hours',group:'service'},\n {key:'hoursNextServiceDue',label:'Next service hours',group:'service'},\n {key:'seNeeded',label:'SE needed?',type:'choice',group:'service'},\n {key:'seCompleted',label:'SE completed?',type:'choice',group:'service'}\n];\nfunction str(v){return v==null?'':String(v);}\nfunction today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\nfunction fresh(){var f={};fields.forEach(function(field){f[field.key]='';});f.date=today();f.complaint='';f.correction='';f.laborTime='';return {version:2,fields:f,parts:[]};}\nfunction normalize(saved){\n var state=fresh();if(!saved||saved.version!==2)return state;\n Object.keys(state.fields).forEach(function(key){if(typeof (saved.fields||{})[key]==='string')state.fields[key]=saved.fields[key];});\n if(Array.isArray(saved.parts))state.parts=saved.parts.map(function(part){return {desc:str(part.desc),partNo:str(part.partNo),qty:str(part.qty)};});\n return state;\n}\nfunction wrapWorksheetComments(value){\n var paragraphs=String(value==null?'':value).replace(/\\r\\n|\\r/g,'\\n').split('\\n');\n return paragraphs.map(function(line){\n  var lines=[];\n  while(line.length>80){\n   var end=80;\n   while(end>0&&!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=80;\n   // Keep a UTF-16 surrogate pair together when a long word needs to be split.\n   if(end\u003cline.length&&/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))&&/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   lines.push(line.slice(0,end));\n   line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  lines.push(line);return lines.join('\\n');\n }).join('\\n');\n}\n\nfunction report(state){\n var f=state.fields,lines=['MAGTEC SERVICE ORDER WORKSHEET',''];\n fields.forEach(function(field){lines.push(field.label+': '+str(f[field.key]));});\n lines.push('','Description of complaint:',wrapWorksheetComments(f.complaint),'','Correction description:',wrapWorksheetComments(f.correction),'','Parts:');\n var parts=state.parts.filter(function(p){return str(p.desc).trim()||str(p.partNo).trim()||str(p.qty).trim();});\n if(!parts.length)lines.push('None entered');\n parts.forEach(function(part,i){lines.push('Part '+(i+1)+': '+str(part.desc)+' | Part #: '+str(part.partNo)+' | Quantity: '+str(part.qty));});\n lines.push('','Labor time: '+str(f.laborTime),'','END OF WORKSHEET');\n return lines.join('\\n').replace(/\\r\\n|\\r|\\n/g,'\\r\\n');\n}\nfunction packet(state){\n return {state:JSON.parse(JSON.stringify(state)),subject:'SE '+str(state.fields.serviceOrderNo)+' - Asset '+str(state.fields.assetNo),body:report(state),details:{associatedSE:str(state.fields.serviceOrderNo),asset:str(state.fields.assetNo),technician:str(state.fields.techName),date:str(state.fields.date),hours:str(state.fields.hours)}};\n}\nreturn {fields:fields,fresh:fresh,normalize:normalize,report:report,packet:packet};\n})();\n(function(R){\n'use strict';\nvar KEY='magtec-service-worksheet-v2',state=R.fresh(),step=0,combination=null;\nvar panels=['worksheetDetails','worksheetWork','worksheetParts','worksheetReview'];\nfunction el(id){return document.getElementById(id);}\ntry{var saved=localStorage.getItem(KEY);if(saved)state=R.normalize(JSON.parse(saved));}catch(e){}\nfunction parentApi(){return window.parent.MagTecPortal;}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}if(parentApi().updateWorksheet)parentApi().updateWorksheet(R.packet(state));}\nfunction element(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}\nfunction field(parent,text,id,input){var wrap=element('div'),label=element('label','',text);label.htmlFor=id;input.id=id;wrap.append(label,input);parent.appendChild(wrap);}\nfunction buildFields(){\n R.fields.forEach(function(f){\n  var input=element(f.type==='choice'?'select':'input');\n  if(f.type==='choice'){[['','Select'],['YES','Yes'],['NO','No']].forEach(function(v){var option=element('option','',v[1]);option.value=v[0];input.appendChild(option);});}\n  else{input.type=f.type==='date'?'date':'text';input.autocomplete=f.key==='techName'?'name':'off';}\n  input.dataset.key=f.key;input.value=state.fields[f.key];\n  input.addEventListener('input',function(){state.fields[f.key]=input.value;save();});\n  input.addEventListener('change',function(){state.fields[f.key]=input.value;save();});\n  field(el(f.group==='details'?'detailsFields':'serviceFields'),f.label,f.key,input);\n });\n ['complaint','correction','laborTime'].forEach(function(key){var input=el(key);input.value=state.fields[key];input.addEventListener('input',function(){state.fields[key]=input.value;save();});});\n}\nfunction buildParts(){\n el('partsList').replaceChildren();\n state.parts.forEach(function(part,i){\n  var row=element('div','part-row'),title=element('h3','item-name','Part '+(i+1));row.appendChild(title);\n  var grid=element('div','part-fields');\n  [['desc','Part description'],['partNo','Part number'],['qty','Quantity']].forEach(function(f){\n   var input=element('input');input.type='text';input.value=part[f[0]];input.autocomplete='off';\n   input.addEventListener('input',function(){part[f[0]]=input.value;save();});field(grid,f[1],'part-'+i+'-'+f[0],input);\n  });\n  row.appendChild(grid);var remove=element('button','button remove-part','Remove Part');remove.type='button';\n  remove.addEventListener('click',function(){state.parts.splice(i,1);save();buildParts();});row.appendChild(remove);el('partsList').appendChild(row);\n });\n}\nfunction review(){\n el('worksheetReport').value=R.report(state);\n el('worksheetEmail').textContent=combination?(combination.finished?'Review Combined':'Continue Inspection'):'Open Email';\n el('combineInspection').textContent=combination?'Change Inspection':'Combine with Inspection';\n el('cancelCombinationRow').hidden=!combination;\n}\nfunction show(index){\n step=index>=3?3:0;panels.forEach(function(id,i){el(id).hidden=step===3?i!==3:i===3;});\n document.querySelectorAll('[data-step]').forEach(function(button){if(Number(button.dataset.step)===step)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});\n el('stepCount').textContent='Section '+(step===3?2:1)+' of 2';el('progressFill').style.width=(step===3?100:50)+'%';\n el('worksheetBack').hidden=step===0;el('worksheetNext').hidden=step===3;el('worksheetNext').textContent='Review worksheet';\n if(step===3)review();window.scrollTo(0,0);\n}\nwindow.WorksheetApp={getPacket:function(){return R.packet(state);},setCombination:function(info){combination=info;review();},goTo:show};\ndocument.querySelectorAll('[data-step]').forEach(function(button){button.addEventListener('click',function(){show(Number(button.dataset.step));});});\nel('worksheetBack').addEventListener('click',function(){show(0);});el('worksheetNext').addEventListener('click',function(){show(3);});\nel('addPart').addEventListener('click',function(){state.parts.push({desc:'',partNo:'',qty:''});save();buildParts();});\nel('combineInspection').addEventListener('click',function(){save();el('inspectionChoice').hidden=!el('inspectionChoice').hidden;el('inspectionType').value='';if(!el('inspectionChoice').hidden)el('inspectionType').focus();});\nel('inspectionType').addEventListener('change',function(){if(!el('inspectionType').value)return;save();parentApi().beginInspection(el('inspectionType').value,R.packet(state));el('inspectionChoice').hidden=true;});\nel('cancelCombination').addEventListener('click',function(){parentApi().cancelCombination(true);});\nel('worksheetEmail').addEventListener('click',function(){save();var packet=R.packet(state);parentApi().requestEmail('SEFill','mailto:?subject='+encodeURIComponent(packet.subject)+'&body='+encodeURIComponent(packet.body));});\nel('worksheetClear').addEventListener('click',function(){\n if(!window.confirm('Clear this worksheet and start over?'))return;\n state=R.fresh();parentApi().cancelCombination(false);\n document.querySelectorAll('[data-key]').forEach(function(input){input.value=state.fields[input.dataset.key]||'';});\n save();buildParts();el('inspectionChoice').hidden=true;el('inspectionType').value='';show(0);\n});\nbuildFields();buildParts();show(0);if(parentApi().worksheetReady)parentApi().worksheetReady();\n})(WorksheetReport);\n\u003c/script>\u003c/body>\u003c/html>"},"ACBinsp":{"title":"ACB Inspection","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#14181c\">\n\u003cmeta name=\"apple-mobile-web-app-title\" content=\"ACB Inspection\">\n\u003ctitle>MagTec ACB Inspection\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark;--bg:#14181c;--panel:#1c2127;--line:#36404a;--text:#eef1f4;--sub:#adb7c1;--amber:#f5a623}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 12px 32px}.app{max-width:880px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}h1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 8px}h2{font-size:20px;font-weight:600;margin:0 0 8px}p{margin:0 0 16px}.sub{color:var(--sub);font-size:14px}.head p{margin:0}.steps{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}.step{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-ra

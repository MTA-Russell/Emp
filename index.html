ype=\"button\" class=\"step\" data-step=\"3\" aria-controls=\"notesPanel\"\u003e4. Accessories \u0026amp; notes\u003c/button\u003e\n \u003cbutton type=\"button\" class=\"step\" data-step=\"4\" aria-controls=\"review\"\u003e5. Review \u0026amp; email\u003c/button\u003e\n\u003c/nav\u003e\n\u003cdiv class=\"progress\" aria-hidden=\"true\"\u003e\u003cdiv id=\"progressFill\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cnoscript\u003eOpen this page in Safari, Chrome, or Edge with JavaScript enabled to fill out the inspection.\u003c/noscript\u003e\n\u003cdiv class=\"content\" id=\"content\" hidden\u003e\n \u003cdiv class=\"step-count\" id=\"stepCount\" aria-live=\"polite\"\u003e\u003c/div\u003e\n \u003csection class=\"panel\" id=\"detailsPanel\" aria-labelledby=\"detailsTitle\"\u003e\n  \u003ch2 id=\"detailsTitle\"\u003eTank \u0026amp; inspector details\u003c/h2\u003e\u003cp class=\"sub\"\u003eSelect the inspection type and tank size, then enter the details below.\u003c/p\u003e\u003cdiv class=\"fields\"\u003e\u003cdiv\u003e\u003clabel for=\"inspectionType\"\u003eInspection type\u003c/label\u003e\u003cselect id=\"inspectionType\" data-key=\"inspectionType\"\u003e\u003coption value=\"\"\u003eSelect inspection type\u003c/option\u003e\u003coption value=\"In\"\u003eIn\u003c/option\u003e\u003coption value=\"Out\"\u003eOut\u003c/option\u003e\u003coption value=\"Yard\"\u003eYard\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"tankSize\"\u003eTank size\u003c/label\u003e\u003cselect id=\"tankSize\" data-key=\"tankSize\"\u003e\u003coption value=\"\"\u003eSelect tank size\u003c/option\u003e\u003coption value=\"400 BBL\"\u003e400 BBL\u003c/option\u003e\u003coption value=\"600 BBL\"\u003e600 BBL\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"asset\"\u003eAsset number\u003c/label\u003e\u003cinput id=\"asset\" data-key=\"asset\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"technician\"\u003eTechnician / inspector name\u003c/label\u003e\u003cinput id=\"technician\" data-key=\"technician\" type=\"text\" autocomplete=\"name\"\u003e\u003cp class=\"field-help\"\u003eYour name supplies the initials for each answered inspection item.\u003c/p\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"date\"\u003eInspection date\u003c/label\u003e\u003cinput id=\"date\" data-key=\"date\" type=\"date\" autocomplete=\"off\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"associatedSE\"\u003eAssociated SE# (if available)\u003c/label\u003e\u003cinput id=\"associatedSE\" data-key=\"associatedSE\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"standbyDate\"\u003eStandby date (if applicable)\u003c/label\u003e\u003cinput id=\"standbyDate\" data-key=\"standbyDate\" type=\"date\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"rentalCustomer\"\u003eRental order number or customer name\u003c/label\u003e\u003cinput id=\"rentalCustomer\" data-key=\"rentalCustomer\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"serial\"\u003eSerial number\u003c/label\u003e\u003cinput id=\"serial\" data-key=\"serial\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\u003c/div\u003e\n \u003c/section\u003e\n \u003csection class=\"panel\" id=\"fittings\" aria-labelledby=\"fittingsTitle\" hidden\u003e\n  \u003ch2 id=\"fittingsTitle\"\u003eFittings \u0026amp; safety\u003c/h2\u003e\u003cp class=\"sub\"\u003eEnter the quantities present and select the condition of each item. Add notes wherever needed.\u003c/p\u003e\u003cdiv id=\"fittingsItems\"\u003e\u003c/div\u003e\n \u003c/section\u003e\n \u003csection class=\"panel\" id=\"tankFoam\" aria-labelledby=\"tankFoamTitle\" hidden\u003e\n  \u003ch2 id=\"tankFoamTitle\"\u003eTank \u0026amp; foam\u003c/h2\u003e\u003cp class=\"sub\"\u003eRecord the tank component conditions and foam findings. Add details wherever needed.\u003c/p\u003e\u003cdiv id=\"tankFoamItems\"\u003e\u003c/div\u003e\n \u003c/section\u003e\n \u003csection class=\"panel\" id=\"notesPanel\" aria-labelledby=\"notesTitle\" hidden\u003e\n  \u003ch2 id=\"notesTitle\"\u003eAccessories \u0026amp; notes\u003c/h2\u003e\n  \u003clabel for=\"accessories\"\u003eAccessories\u003c/label\u003e\u003ctextarea id=\"accessories\" data-key=\"accessories\" rows=\"4\"\u003e\u003c/textarea\u003e\n  \u003cdiv class=\"notes\"\u003e\u003clabel for=\"notes\"\u003eAdditional comments / repairs needed\u003c/label\u003e\u003ctextarea id=\"notes\" data-key=\"notes\" rows=\"5\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n \u003c/section\u003e\n \u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden\u003e\n  \u003ch2 id=\"reviewTitle\"\u003eReview \u0026amp; open email\u003c/h2\u003e\u003cp class=\"sub\"\u003eThe completed inspection goes in the email body. Review the draft in your email app, then send it.\u003c/p\u003e\n  \u003cdiv id=\"completion\" class=\"notice\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"recipients\"\u003e\u003cstrong\u003eEmail recipients\u003c/strong\u003e\u003cspan id=\"recipientList\"\u003e\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"actions\"\u003e\u003ca class=\"button primary\" id=\"openEmail\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\"\u003eOpen filled-out email\u003c/a\u003e\u003c/div\u003e\n  \u003cp class=\"status\" id=\"mailStatus\" role=\"status\"\u003e\u003c/p\u003e\n  \u003clabel for=\"reportText\"\u003eComplete email body\u003c/label\u003e\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\"\u003e\u003c/textarea\u003e\n  \u003cp class=\"field-help\"\u003eThe completed email should end with END OF INSPECTION.\u003c/p\u003e\n  \u003cdetails class=\"backup\" id=\"backup\"\u003e\u003csummary\u003eBackup if the email opens with missing text\u003c/summary\u003e\n   \u003cp class=\"sub\"\u003eIf your phone limits the email text, copy the full report, open the addressed email, and paste it into the body.\u003c/p\u003e\n   \u003cdiv class=\"actions\"\u003e\u003cbutton type=\"button\" class=\"button\" id=\"copyReport\"\u003e1. Copy full report\u003c/button\u003e\u003ca class=\"button\" id=\"shortEmail\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\"\u003e2. Open email to paste\u003c/a\u003e\u003c/div\u003e\n   \u003cbutton type=\"button\" class=\"button\" id=\"selectReport\"\u003eSelect report for manual copy\u003c/button\u003e\u003cp class=\"status\" id=\"copyStatus\" role=\"status\"\u003e\u003c/p\u003e\n   \u003cp class=\"field-help\"\u003eIf your device blocks copying or opening email from this browser, use your approved email app with the addresses and report shown above.\u003c/p\u003e\n  \u003c/details\u003e\n \u003c/section\u003e\n\u003c/div\u003e\n\u003cdiv class=\"foot\" id=\"foot\" hidden\u003e\u003cbutton class=\"button\" id=\"back\" type=\"button\"\u003eBack\u003c/button\u003e\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\"\u003eNext\u003c/button\u003e\u003c/div\u003e\n\u003cfooter class=\"bottom\"\u003e\u003csmall id=\"draftStatus\" role=\"status\"\u003eYour entries stay here while you fill out the form.\u003c/small\u003e\u003cbutton class=\"button\" id=\"clear\" type=\"button\"\u003eStart over\u003c/button\u003e\u003c/footer\u003e\n\u003c/main\u003e\n\u003cscript id=\"inspectionTextLayout\"\u003evar InspectionTextLayout=(function(){\n'use strict';\nvar WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length\u003ewidth){\n   var end=width;while(end\u003e0\u0026\u0026!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))\u0026\u0026/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){\n items.forEach(function(item,i){\n  if(i)lines.push('');\n  line(item.title);\n  (item.values||[]).forEach(function(value){line('    '+text(value));});\n  if(text(item.notes).trim())line('    Notes: '+item.notes);\n });\n}\n function fields(list){list.forEach(function(f){line(f[0]+': '+text(f[1]));});}\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script\u003e\n\u003cscript id=\"tankConfig\"\u003evar TankConfig={\"fields\": [{\"key\": \"inspectionType\", \"label\": \"Inspection type\", \"type\": \"select\", \"options\": [\"In\", \"Out\", \"Yard\"]}, {\"key\": \"tankSize\", \"label\": \"Tank size\", \"type\": \"select\", \"options\": [\"400 BBL\", \"600 BBL\"]}, {\"key\": \"asset\", \"label\": \"Asset number\", \"type\": \"text\"}, {\"key\": \"technician\", \"label\": \"Technician / inspector name\", \"type\": \"text\"}, {\"key\": \"date\", \"label\": \"Inspection date\", \"type\": \"date\"}, {\"key\": \"associatedSE\", \"label\": \"Associated SE# (if available)\", \"type\": \"text\"}, {\"key\": \"standbyDate\", \"label\": \"Standby date (if applicable)\", \"type\": \"date\"}, {\"key\": \"rentalCustomer\", \"label\": \"Rental order number or customer name\", \"type\": \"text\"}, {\"key\": \"serial\", \"label\": \"Serial number\", \"type\": \"text\"}], \"groups\": [{\"id\": \"fittings\", \"title\": \"Fittings \u0026 safety\"}, {\"id\": \"tankFoam\", \"title\": \"Tank \u0026 foam\"}], \"items\": [{\"key\": \"valves\", \"group\": \"fittings\", \"title\": \"4\\\" butterfly valves\", \"type\": \"quantity\"}, {\"key\": \"plugs\", \"group\": \"fittings\", \"title\": \"4\\\" plugs\", \"type\": \"quantity\"}, {\"key\": \"steamPlugs\", \"group\": \"fittings\", \"title\": \"2\\\" steam line plugs\", \"type\": \"quantity\"}, {\"key\": \"ladder\", \"group\": \"fittings\", \"title\": \"Condition of ladder\", \"type\": \"condition\"}, {\"key\": \"fallRestraint\", \"group\": \"fittings\", \"title\": \"Fall restraint\", \"type\": \"condition\"}, {\"key\": \"fallSlider\", \"group\": \"fittings\", \"title\": \"Fall restraint slider\", \"type\": \"condition\"}, {\"key\": \"sling\", \"group\": \"fittings\", \"title\": \"Bridal\", \"type\": \"condition\"}, {\"key\": \"bridalCollar\", \"group\": \"fittings\", \"title\": \"Bridal collar condition\", \"type\": \"condition\"}, {\"key\": \"gaugeBoard\", \"group\": \"tankFoam\", \"title\": \"Gauge board\", \"type\": \"condition\"}, {\"key\": \"gaugePulleys\", \"group\": \"tankFoam\", \"title\": \"Gauge board pulleys\", \"type\": \"condition\"}, {\"key\": \"topVent\", \"group\": \"tankFoam\", \"title\": \"Top aluminum vent\", \"type\": \"condition\"}, {\"key\": \"landingBracket\", \"group\": \"tankFoam\", \"title\": \"Crutch landing bracket\", \"type\": \"condition\"}, {\"key\": \"hatchBolted\", \"group\": \"tankFoam\", \"title\": \"Is the hatch bolted?\", \"type\": \"yesno\"}, {\"key\": \"cleaned\", \"group\": \"tankFoam\", \"title\": \"Has the tank been cleaned?\", \"type\": \"yesno\"}, {\"key\": \"cleanCertificate\", \"group\": \"tankFoam\", \"title\": \"Cleaning certificate / reference (if available)\", \"type\": \"text\", \"optional\": true}, {\"key\": \"foamBubbles\", \"group\": \"tankFoam\", \"title\": \"Foam condition — bubbles\", \"type\": \"condition\", \"foam\": true}, {\"key\": \"foamCracks\", \"group\": \"tankFoam\", \"title\": \"Foam condition — cracks\", \"type\": \"condition\", \"foam\": true}, {\"key\": \"foamOther\", \"group\": \"tankFoam\", \"title\": \"Foam condition — other defects\", \"type\": \"condition\", \"foam\": true}], \"recipients\": [\"NSrentals@magtecalaska.com\", \"nsshop@magtecalaska.com\", \"nsd-mgr@magtecalaska.com\"]};\u003c/script\u003e\n\u003cscript id=\"tankApp\"\u003evar TankReport=(function(C){\n 'use strict';\n function str(v){return v==null?'':String(v);}\n function value(v){return str(v).trim()?str(v):'Not recorded';}\n function initials(s){return (str(s.fields.technician).match(/\\p{L}[\\p{L}\\p{M}'’-]*/gu)||[]).map(function(w){return Array.from(w)[0];}).join('').toUpperCase();}\n function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\n function fresh(){var entries={};C.items.forEach(function(i){entries[i.key]={answer:'',condition:'',notes:''};});return {version:1,formKind:'tank',fields:{date:today()},entries:entries};}\n function normalize(s){\n  var d=fresh();if(!s||s.version!==1||s.formKind!=='tank')return d;\n  C.fields.concat([{key:'accessories'},{key:'notes'}]).forEach(function(f){var v=(s.fields||{})[f.key];if(typeof v==='string'\u0026\u0026(!f.options||f.options.indexOf(v)\u003e=0||v===''))d.fields[f.key]=v;});\n  C.items.forEach(function(i){var e=(s.entries||{})[i.key]||{},v=d.entries[i.key];v.answer=str(e.answer);v.notes=str(e.notes);v.condition=['In good condition','Needs repair'].indexOf(e.condition)\u003e=0?e.condition:'';\n   if(i.type==='condition'\u0026\u0026['','In good condition','Needs repair'].indexOf(v.answer)\u003c0){\n    var previous=v.answer;\n    if(i.foam\u0026\u0026['Yes','No'].indexOf(previous)\u003e=0){v.answer=previous==='Yes'?'Needs repair':'In good condition';}else{v.answer='';}\n    v.notes='Previous answer: '+previous+(v.notes?'\\n'+v.notes:'');\n   }\n   if(i.type==='yesno'\u0026\u0026['','Yes','No','N/A'].indexOf(v.answer)\u003c0)v.answer='';\n  });return d;\n }\n function report(s){\n var p=InspectionTextLayout.create('TANK INSPECTION REPORT');\n p.fields(C.fields.map(function(f){return [f.label,value(s.fields[f.key])];}));p.line('Inspector initials (from name): '+value(initials(s)));\n C.groups.forEach(function(g){p.section(g.title);p.grid(C.items.filter(function(i){return i.group===g.id;}).map(function(i){\n  var e=s.entries[i.key],values=i.type==='quantity'?['Qty: '+value(e.answer),value(e.condition)]:[(i.type==='condition'?'':'Answer: ')+value(e.answer)];\n  if(e.answer.trim()||e.notes.trim()||str(e.condition).trim())values[values.length-1]+=' ['+value(initials(s))+']';\n  return {title:i.title,values:values,notes:e.notes};\n }));});\n if(str(s.fields.accessories).trim()){p.section('Accessories');p.line(s.fields.accessories);}\n if(str(s.fields.notes).trim()){p.section('Additional comments / repairs needed');p.line(s.fields.notes);}\n return p.finish();\n}\n\n function encode(v){var s=str(v);if(s.toWellFormed)s=s.toWellFormed();else s=s.replace(/[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDFFF]/g,function(m){return m.length===2?m:'\\uFFFD';});return encodeURIComponent(s);}\n function link(s,body){var subject=['Tank Inspection',value(s.fields.inspectionType),value(s.fields.tankSize),value(s.fields.asset),value(s.fields.date)].join(' - ');return 'mailto:'+C.recipients.join(',')+'?subject='+encode(subject)+(body?'\u0026body='+encode(report(s)):'');}\n return {fresh:fresh,normalize:normalize,initials:initials,report:report,link:link};\n})(TankConfig);\n\n(function(C,R){\n 'use strict';\n var KEY='magtec-tank-inspection-draft-v1',state=R.fresh(),step=0;\n var panels=['detailsPanel','fittings','tankFoam','notesPanel','review'];\n function el(id){return document.getElementById(id);}\n try{var saved=localStorage.getItem(KEY);if(saved){state=R.normalize(JSON.parse(saved));el('draftStatus').textContent='Saved tank inspection restored on this device.';}}catch(e){}\n function save(){try{localStorage.setItem(KEY,JSON.stringify e if(i.type==='yesno'){\n   answer=element('select');[['','Select answer'],['Yes','Yes'],['No','No'],['N/A','N/A']].forEach(function(v){var o=element('option','',v[1]);o.value=v[0];answer.appendChild(o);});answer.value=entry.answer;field(row,'Answer','answer-'+i.key,answer);\n   var details=textarea(entry.notes);field(row,'Details / notes','notes-'+i.key,details).className='answer-notes';details.addEventListener('input',function(){entry.notes=details.value;save();});\n  }else{\n   answer=textarea(entry.answer);answer.className='condition';field(row,i.type==='condition'?'Condition / findings':'Certificate details / reference','answer-'+i.key,answer);\n  }\n  answer.addEventListener((i.type==='yesno'||i.type==='condition')?'change':'input',function(){entry.answer=answer.value;save();});el(i.group+'Items').appendChild(row);\n });}\n function review(){var questions=C.items.filter(function(i){return !i.optional;}),answered=questions.filter(function(i){var e=state.entries[i.key];return e.answer.trim()!==''\u0026\u0026(i.type!=='quantity'||e.condition.trim()!=='');}).length;\n  var summary=answered+' of '+questions.length+' inspection questions answered. Blank fields appear as Not recorded.';\n  if(!state.fields.inspectionType)summary+=' Inspection type is not selected.';if(!state.fields.tankSize)summary+=' Tank size is not selected.';if(!R.initials(state))summary+=' Enter the technician name in Details to include initials.';\n  el('completion').textContent=summary;el('reportText').value=R.report(state);el('openEmail').href=R.link(state,true);el('shortEmail').href=R.link(state,false);el('recipientList').textContent=C.recipients.join('; ');\n }\n function show(index){step=Math.max(0,Math.min(panels.length-1,index));panels.forEach(function(id,i){el(id).hidden=i!==step;});document.querySelectorAll('[data-step]').forEach(function(b){if(Number(b.dataset.step)===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});el('stepCount').textContent='Sect c/label\u003e\u003cinput id=\"associatedSE\" data-key=\"associatedSE\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"inspectionType\"\u003eInspection type\u003c/label\u003e\u003cselect id=\"inspectionType\" data-key=\"inspectionType\"\u003e\u003coption value=\"\"\u003eSelect inspection type\u003c/option\u003e\u003coption value=\"In\"\u003eIn\u003c/option\u003e\u003coption value=\"Out\"\u003eOut\u003c/option\u003e\u003coption value=\"Yard\"\u003eYard\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"evType\"\u003eEV type\u003c/label\u003e\u003cselect id=\"evType\" data-key=\"evType\"\u003e\u003coption value=\"\"\u003eSelect ev type\u003c/option\u003e\u003coption value=\"53 ft\"\u003e53 ft\u003c/option\u003e\u003coption value=\"20 ft 2 stall\"\u003e20 ft 2 stall\u003c/option\u003e\u003coption value=\"20 ft 1 stall and shower\"\u003e20 ft 1 stall and shower\u003c/option\u003e\u003coption value=\"Other\"\u003eOther\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n\u003cdiv id=\"evTypeOtherField\" hidden\u003e\u003clabel for=\"evTypeOther\"\u003eOther EV type — please specify\u003c/label\u003e\u003ctextarea id=\"evTypeOther\" data-key=\"evTypeOther\" rows=\"3\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"standbyDate\"\u003eStandby date (if applicable)\u003c/label\u003e\u003cinput id=\"standbyDate\" data-key=\"standbyDate\" type=\"date\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"rentalCustomer\"\u003eRental order number or customer name\u003c/label\u003e\u003cinput id=\"rentalCustomer\" data-key=\"rentalCustomer\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"serial\"\u003eSerial number\u003c/label\u003e\u003cinput id=\"serial\" data-key=\"serial\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"hours\"\u003eHours\u003c/label\u003e\u003cinput id=\"hours\" data-key=\"hours\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\n\u003cdiv\u003e\u003clabel for=\"fuelLevel\"\u003eFuel level\u003c/label\u003e\u003cinput id=\"fuelLevel\" data-key=\"fuelLevel\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\u003c/div\u003e\n \u003c/section\u003e\n \u003csection class=\"panel\" id=\"equipment\" aria-labelledby=\"equipmentTitle\" hidden\u003e\n  \u003ch2 id=\"equipmentTitle\"\u003eEquipment condition\u003c/h2\u003e\u003cp class=\"sub\"\u003eSelect the condition of each item and add notes. Enter a quantity for fire extinguishers.\u003c/p\u003e\u003cdiv id=\"equipmentItems\"\u003e\u003c/div\u003e\n \u003c/section\u003e\n \u003csection class=\"panel\" id=\"condition\" aria-labelledby=\"conditionTitle\" hidden\u003e\n  \u003ch2 id=\"conditionTitle\"\u003eCondition \u0026amp; preparation\u003c/h2\u003e\u003cp class=\"sub\"\u003eRecord the water and sewer tank status, winterization, and condition of each component. Add notes wherever needed.\u003c/p\u003e\u003cdiv id=\"conditionItems\"\u003e\u003c/div\u003e\u003cdiv id=\"otherItems\"\u003e\u003c/div\u003e\u003cbutton type=\"button\" class=\"button\" id=\"addOther\"\u003eAdd another other\u003c/button\u003e\n \u003c/section\u003e\n \u003csection class=\"panel\" id=\"notesPanel\" aria-labelledby=\"notesTitle\" hidden\u003e\n  \u003ch2 id=\"notesTitle\"\u003eAccessories \u0026amp; notes\u003c/h2\u003e\n  \u003clabel for=\"accessories\"\u003eAccessories\u003c/label\u003e\u003ctextarea id=\"accessories\" data-key=\"accessories\" rows=\"4\"\u003e\u003c/textarea\u003e\n  \u003cdiv class=\"notes\"\u003e\u003clabel for=\"notes\"\u003eAdditional comments / repairs needed\u003c/label\u003e\u003ctextarea id=\"notes\" data-key=\"notes\" rows=\"5\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n \u003c/section\u003e\n \u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden\u003e\n  \u003ch2 id=\"reviewTitle\"\u003eReview \u0026amp; open email\u003c/h2\u003e\u003cp class=\"sub\"\u003eThe completed inspection goes in the email body. Review the draft in your email app, then send it.\u003c/p\u003e\n  \u003cdiv id=\"completion\" class=\"notice\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"recipients\"\u003e\u003cstrong\u003eEmail recipients\u003c/strong\u003e\u003cspan id=\"recipientList\"\u003e\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"actions\"\u003e\u003ca class=\"button primary\" id=\"openEmail\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\"\u003eOpen filled-out email\u003c/a\u003e\u003c/div\u003e\n  \u003cp class=\"status\" id=\"mailStatus\" role=\"status\"\u003e\u003c/p\u003e\n  \u003clabel for=\"reportText\"\u003eComplete email body\u003c/label\u003e\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\"\u003e\u003c/textarea\u003e\n  \u003cp class=\"field-help\"\u003eThe completed email should end with END OF INSPECTION.\u003c/p\u003e\n  \u003cdetails class=\"backup\" id=\"backup\"\u003e\u003csummary\u003eBackup if the email opens with missing text\u003c/summary\u003e\n   \u003cp class=\"sub\"\u003eIf your phone limits the email text, copy the full report, open the addressed email, and paste it into the body.\u003c/p\u003e\n   \u003cdiv class=\"actions\"\u003e\u003cbutton type=\"button\" class=\"button\" id=\"copyReport\"\u003e1. Copy full report\u003c/button\u003e\u003ca class=\"button\" id=\"shortEmail\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\"\u003e2. Open email to paste\u003c/a\u003e\u003c/div\u003e\n   \u003cbutton type=\"button\" class=\"button\" id=\"selectReport\"\u003eSelect report for manual copy\u003c/button\u003e\u003cp class=\"status\" id=\"copyStatus\" role=\"status\"\u003e\u003c/p\u003e\n   \u003cp class=\"field-help\"\u003eIf your device blocks copying or opening email from this browser, use your approved email app with the addresses and report shown above.\u003c/p\u003e\n  \u003c/details\u003e\n \u003c/section\u003e\n\u003c/div\u003e\n\u003cdiv class=\"foot\" id=\"foot\" hidden\u003e\u003cbutton class=\"button\" id=\"back\" type=\"button\"\u003eBack\u003c/button\u003e\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\"\u003eNext\u003c/button\u003e\u003c/div\u003e\n\u003cfooter class=\"bottom\"\u003e\u003csmall id=\"draftStatus\" role=\"status\"\u003eYour entries stay here while you fill out the form.\u003c/small\u003e\u003cbutton class=\"button\" id=\"clear\" type=\"button\"\u003eStart over\u003c/button\u003e\u003c/footer\u003e\n\u003c/main\u003e\n\u003cscript id=\"inspectionTextLayout\"\u003evar InspectionTextLayout=(function(){\n'use strict';\nvar WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length\u003ewidth){\n   var end=width;while(end\u003e0\u0026\u0026!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))\u0026\u0026/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){\n items.forEach(function(item,i){\n  if(i)lines.push('');\n  line(item.title);\n  (item.values||[]).forEach(function(value){line('    '+text(value));});\n  if(text(item.notes).trim())line('    Notes: '+item.notes);\n });\n}\n function fields(list){list.forEach(function(f){line(f[0]+': '+text(f[1]));});}\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script\u003e\n\u003cscript id=\"evConfig\"\u003evar EVConfig={\"fields\": [{\"key\": \"asset\", \"label\": \"Asset number\", \"type\": \"text\"}, {\"key\": \"technician\", \"label\": \"Technician / inspector name\", \"type\": \"text\"}, {\"key\": \"date\", \"label\": \"Inspection date\", \"type\": \"date\"}, {\"key\": \"associatedSE\", \"label\": \"Associated SE# (if available)\", \"type\": \"text\"}, {\"key\": \"inspectionType\", \"label\": \"Inspection type\", \"type\": \"select\", \"options\": [\"In\", \"Out\", \"Yard\"]}, {\"key\": \"evType\", \"label\": \"EV type\", \"type\": \"select\", \"options\": [\"53 ft\", \"20 ft 2 stall\", \"20 ft 1 stall and shower\", \"Other\"]}, {\"key\": \"evTypeOther\", \"label\": \"Other EV type — please specify\", \"type\": \"textarea\"}, {\"key\": \"standbyDate\", \"label\": \"Standby date (if applicable)\", \"type\": \"date\"}, {\"key\": \"rentalCustomer\", \"label\": \"Rental order number or customer name\", \"type\": \"text\"}, {\"key\": \"serial\", \"label\": \"Serial number\", \"type\": \"text\"}, {\"key\": \"hours\", \"label\": \"Hours\", \"type\": \"text\"}, {\"key\": \"fuelLevel\", \"label\": \"Fuel level\", \"type\": \"text\"}], \"groups\": [{\"id\": \"equipment\", \"title\": \"Equipment condition\"}, {\"id\": \"condition\", \"title\": \"Condition \u0026 preparation\"}], \"items\": [{\"key\": \"stairsRails\", \"group\": \"equipment\", \"title\": \"Stairs / rails\", \"type\": \"condition\"}, {\"key\": \"platforms\", \"group\": \"equipment\", \"title\": \"Platforms\", \"type\": \"condition\"}, {\"key\": \"landings\", \"group\": \"equipment\", \"title\": \"Landings\", \"type\": \"condition\"}, {\"key\": \"landingPads\", \"group\": \"equipment\", \"title\": \"Landing pads\", \"type\": \"condition\"}, {\"key\": \"levelingLegs\", \"group\": \"equipment\", \"title\": \"Leveling / adjustment legs\", \"type\": \"condition\"}, {\"key\": \"powerCord\", \"group\": \"equipment\", \"title\": \"Main power cord\", \"type\": \"condition\"}, {\"key\": \"fireExtinguisher\", \"group\": \"equipment\", \"title\": \"Fire extinguisher\", \"type\": \"quantity\"}, {\"key\": \"waterEmpty\", \"group\": \"condition\", \"title\": \"Water tank — empty?\", \"type\": \"yesno\"}, {\"key\": \"waterCondition\", \"group\": \"condition\", \"title\": \"Water tank — condition\", \"type\": \"condition\"}, {\"key\": \"sewerEmpty\", \"group\": \"condition\", \"title\": \"Sewer tank — empty?\", \"type\": \"yesno\"}, {\"key\": \"sewerCondition\", \"group\": \"condition\", \"title\": \"Sewer tank — condition\", \"type\": \"condition\"}, {\"key\": \"winterized\", \"group\": \"condition\", \"title\": \"Winterized?\", \"type\": \"yesno\"}, {\"key\": \"sinks\", \"group\": \"condition\", \"title\": \"Sinks\", \"type\": \"condition\"}, {\"key\": \"urinals\", \"group\": \"condition\", \"title\": \"Urinals\", \"type\": \"condition\"}, {\"key\": \"toilets\", \"group\": \"condition\", \"title\": \"Toilets\", \"type\": \"condition\"}, {\"key\": \"stallWallsDoors\", \"group\": \"condition\", \"title\": \"Stall walls and doors\", \"type\": \"condition\"}, {\"key\": \"pumps\", \"group\": \"condition\", \"title\": \"Pumps\", \"type\": \"condition\"}, {\"key\": \"plumbing\", \"group\": \"condition\", \"title\": \"Plumbing\", \"type\": \"condition\"}, {\"key\": \"interiorLights\", \"group\": \"condition\", \"title\": \"Interior lights\", \"type\": \"condition\"}, {\"key\": \"exteriorLights\", \"group\": \"condition\", \"title\": \"Exterior lights\", \"type\": \"condition\"}, {\"key\": \"exitSigns\", \"group\": \"condition\", \"title\": \"Exit signs\", \"type\": \"condition\"}, {\"key\": \"receptacles\", \"group\": \"condition\", \"title\": \"Receptacles\", \"type\": \"condition\"}, {\"key\": \"flooring\", \"group\": \"condition\", \"title\": \"Flooring\", \"type\": \"condition\"}, {\"key\": \"heaters\", \"group\": \"condition\", \"title\": \"Heaters\", \"type\": \"condition\"}, {\"key\": \"heatTrace\", \"group\": \"condition\", \"title\": \"Heat trace\", \"type\": \"condition\"}, {\"key\": \"equipmentCondition\", \"group\": \"condition\", \"title\": \"Condition of equipment\", \"type\": \"condition\"}], \"recipients\": [\"NSrentals@magtecalaska.com\", \"nsshop@magtecalaska.com\", \"nsd-mgr@magtecalaska.com\"]};\u003c/script\u003e\n\u003cscript id=\"evApp\"\u003evar EVReport=(function(C){\n 'use strict';\n function str(v){return v==null?'':String(v);}\n function value(v){return str(v).trim()?str(v):'Not recorded';}\n function initials(s){return (str(s.fields.technician).match(/\\p{L}[\\p{L}\\p{M}'’-]*/gu)||[]).map(function(w){return Array.from(w)[0];}).join('').toUpperCase();}\n function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\n function fresh(){var entries={};C.items.forEach(function(i){entries[i.key]={answer:'',condition:'',notes:''};});return {version:1,schemaRevision:2,formKind:'ev',fields:{date:today()},entries:entries,others:[{name:'',condition:'',notes:''}]};}\n function normalize(s){\n  var d=fresh();if(!s||s.version!==1||s.formKind!=='ev')return d;\n  C.fields.concat([{key:'accessories'},{key:'notes'}]).forEach(function(f){var v=(s.fields||{})[f.key];if(typeof v==='string'\u0026\u0026(!f.options||f.options.indexOf(v)\u003e=0||v===''))d.fields[f.key]=v;});\n  C.items.forEach(function(i){var e=(s.entries||{})[i.key]||{},v=d.entries[i.key];v.answer=str(e.answer);v.notes=str(e.notes);v.condition=['In good condition','Needs repair'].indexOf(e.condition)\u003e=0?e.condition:'';\n   if(s.schemaRevision!==2\u0026\u0026['stairsRails','platforms','landings','landingPads','levelingLegs','powerCord'].indexOf(i.key)\u003e=0){v.answer=v.condition;v.condition='';}\n   if(i.type==='condition'\u0026\u0026['','In good condition','Needs repair'].indexOf(v.answer)\u003c0){\n    var previous=v.answer;\n    v.answer='';\n    v.notes='Previous answer: '+previous+(v.notes?'\\n'+v.notes:'');\n   }\n   if(i.type==='yesno'\u0026\u0026['','Yes','No','N/A'].indexOf(v.answer)\u003c0)v.answer='';\n  });\n  if(Array.isArray(s.others)\u0026\u0026s.others.length)d.others=s.others.map(function(o){o=o||{};return {name:str(o.name),condition:['In good condition','Needs repair'].indexOf(o.condition)\u003e=0?o.condition:'',notes:str(o.notes)};});\n  return d;\n }\n function report(s){\n var p=InspectionTextLayout.create('ENVIROVAC (EV) INSPECTION REPORT');\n p.fields(C.fields.filter(function(f){return f.key!=='evTypeOther'||s.fields.evType==='Other';}).map(function(f){return [f.label,value(s.fields[f.key])];}));p.line('Inspector initials (from name): '+value(initials(s)));\n C.groups.forEach(function(g){p.section(g.title);p.grid(C.items.filter(function(i){return i.group===g.id;}).map(function(i){\n  var e=s.entries[i.key],values=i.type==='quantity'?['Qty: '+value(e.answer),value(e.condition)]:[(i.type==='condition'?'':'Answer: ')+value(e.answer)];\n  if(e.answer.trim()||e.notes.trim()||str(e.condition).trim())values[values.length-1]+=' ['+value(initials(s))+']';\n  return {title:i.title,values:values,notes:e.notes};\n }));});\n var others=(s.others||[]).filter(function(o){return o.name.trim()||o.condition||o.notes.trim();});\n if(others.length){p.section('Other items');p.grid(others.map(function(o,i){return {title:'Other '+(i+1)+': '+value(o.name),values:[value(o.condition)+' ['+value(initials(s))+']'],notes:o.notes};}));}\n if(str(s.fields.accessories).trim()){p.section('Accessories');p.line(s.fields.accessories);}\n if(str(s.fields.notes).trim()){p.section('Additional comments / repairs needed');p.line(s.fields.notes);}\n return p.finish();\n}\n\n function encode(v){var s=str(v);if(s.toWellFormed)s=s.toWellFormed();else s=s.replace(/[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDFFF]/g,function(m){return m.length===2?m:'\\uFFFD';});retur ame=element('input');name.type='text';name.value=o.name;name.autocomplete='off';field(row,'Item / component','otherName'+i,name);\n   var condition=conditionSelect(o.condition);field(row,'Condition','otherCondition'+i,condition).className='answer-notes';\n   var notes=textarea(o.notes);field(row,'Notes / repairs needed','otherNotes'+i,notes).className='answer-notes';\n   [[name,'name'],[condition,'condition'],[notes,'notes']].forEach(function(pair){pair[0].addEventListener(pair[1]==='condition'?'change':'input',function(){o[pair[1]]=pair[0].value;save();});});\n   el('otherItems').appendChild(row);\n  });\n }\n el('addOther').addEventListener('click',function(){state.others.push({name:'',condition:'',notes:''});buildOthers();save();el('otherName'+(state.others.length-1)).focus();});\n function review(){var questions=C.items.filter(function(i){return !i.optional;}),answered=questions.filter(function(i){var e=state.entries[i.key];return e.answer.trim()!==''\u0026\u0026(i.type!=='quantity'||e.condition.trim()!=='');}).length;\n  var others=state.others.filter(function(o){return o.name.trim()||o.condition||o.notes.trim();});\n  var summary=answered+' of '+questions.length+' inspection questions answered. Blank fields appear as Not recorded.';\n  if(others.length)summary+=' '+others.length+' other item(s) entered.';\n  if(!state.fields.inspectionType)summary+=' Inspection type is not selected.';if(!state.fields.evType)summary+=' EV type is not selected.';if(state.fields.evType==='Other'\u0026\u0026!(state.fields.evTypeOther||'').trim())summary+=' Other EV type has not been specified.';if(!R.initials(state))summary+=' Enter the technician name in Details to include initials.';\n  el('completion').textContent=summary;el('reportText').value=R.report(state);el('openEmail').href=R.link(state,true);el('shortEmail').href=R.link(state,false);el('recipientList').textContent=C.recipients.join('; ');\n }\n function show(index){step=Math.max(0,Math.min(panels.length-1,index));panels.forEach(function(id,i){el(id).hidden=i!==step;});document.querySelectorAll('[data-step]').forEach(function(b){if(Number(b.dataset.step)===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});el('stepCount').textContent='Section '+(step+1)+' of '+panels.length;el('progressFill').style.width=((step+1)/panels.length*100)+'%';el('back').hidden=step===0;el('next').hidden=step===panels.length-1;el('next').textContent=step===panels.length-2?'Review inspection':'Next';el('foot').hidden=false;if(step===panels.length-1)review();window.scrollTo(0,0);}\n document.querySelectorAll('[data-key]').forEach(function(n){n.value=state.fields[n.dataset.key]||'';n.addEventListener(n.tagName==='SELECT'?'change':'input',function(){state.fields[n.dataset.key]=n.value;if(n.dataset.key==='evType')syncEVType();save();});});\n document.querySelectorAll('[data-step]').forEach(function(n){n.addEventListener('click',function(){show(Number(n.dataset.step));});});\n el('back').addEventListener('click',function(){show(step-1);});el('next').addEventListener('click',function(){show(step+1);});\n el('openEmail').addEventListener('click',function(){save();el('mailStatus').textContent='Opening your email app. Check that the draft ends with END OF INSPECTION, then send it. Use the backup below if text is missing.';});\n el('shortEmail').addEventListener('click',function(){el('copyStatus').textContent='Paste the full report into the email body, review the addresses, then send.';});\n function selectReport(){var n=el('reportText');n.focus();n.select();n.setSelectionRange(0,n.value.length);}\n function legacyCopy(){selectReport();var ok=false;try{ok=document.execCommand('copy');}catch(e){}el('copyStatus').textContent=ok?'Full report copied. Open the email to paste it.':'Report selected. Use your device\\'s Copy command, then open the email to paste it.';}\n el('copyReport').addEventListener('click',function(){if(navigator.clipboard\u0026\u0026navigator.clipboard.writeText){nav 03e\u003c/section\u003e\u003csection class=\"panel\" id=\"runningGear\" aria-labelledby=\"runningGearTitle\" hidden\u003e\u003ch2 id=\"runningGearTitle\"\u003eBrakes \u0026amp; suspension\u003c/h2\u003e\u003cp class=\"legend\"\u003eOK = In good condition / ready to use · SR = Service required\u003cbr\u003eRN = Repair / replacement needed · N/A = Not applicable\u003c/p\u003e\u003cdiv id=\"runningGearItems\"\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"panel\" id=\"tiresPanel\" aria-labelledby=\"tiresTitle\" hidden\u003e\n   \u003ch2 id=\"tiresTitle\"\u003eTires - 12 positions\u003c/h2\u003e\n   \u003cp class=\"sub\"\u003eAxles are numbered front to rear: 1 = front, 2 = middle, 3 = rear. Driver and passenger sides are viewed facing forward. Each side has an inner and outer tire; inner tires are nearest the chassis.\u003c/p\u003e\n   \u003cp class=\"sub\"\u003eSelect the condition of each tire and record PSI and tread depth in 32nds of an inch. Add notes or other units as needed.\u003c/p\u003e\u003cdiv id=\"tires\"\u003e\u003c/div\u003e\n\u003ch3\u003eRelease \u0026amp; sign-off\u003c/h3\u003e\u003cdiv class=\"fields\"\u003e\u003cdiv\u003e\u003clabel for=\"released\"\u003eUnit released to continue service?\u003c/label\u003e\u003cselect id=\"released\" data-key=\"released\"\u003e\u003coption value=\"\"\u003eSelect answer\u003c/option\u003e\u003coption\u003eYes\u003c/option\u003e\u003coption\u003eNo\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"technicianSignoff\"\u003eTechnician sign-off name (typed)\u003c/label\u003e\u003cinput id=\"technicianSignoff\" data-key=\"technicianSignoff\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"technicianDate\"\u003eTechnician sign-off date\u003c/label\u003e\u003cinput id=\"technicianDate\" data-key=\"technicianDate\" type=\"date\" autocomplete=\"off\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"driverSignoff\"\u003eDriver sign-off name (typed)\u003c/label\u003e\u003cinput id=\"driverSignoff\" data-key=\"driverSignoff\" type=\"text\" autocomplete=\"off\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"driverDate\"\u003eDriver sign-off date\u003c/label\u003e\u003cinput id=\"driverDate\" data-key=\"driverDate\" type=\"date\" autocomplete=\"off\"\u003e\u003c/div\u003e\u003c/div\u003e\n   \u003cdiv class=\"notes\"\u003e\u003clabel for=\"notes\"\u003eComments / notes\u003c/label\u003e\u003ctextarea id=\"notes\" data-key=\"notes\" rows=\"5\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n  \u003c/section\u003e\n  \u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden\u003e\n   \u003ch2 id=\"reviewTitle\"\u003eReview \u0026amp; open email\u003c/h2\u003e\u003cp class=\"sub\"\u003eThe full inspection goes in the email body. Review the draft in your email app, then send it.\u003c/p\u003e\n   \u003cdiv id=\"completion\" class=\"notice\"\u003e\u003c/div\u003e\n   \u003cdiv class=\"recipients\"\u003e\u003cstrong\u003eEmail recipients\u003c/strong\u003e\u003cspan id=\"recipientList\"\u003e\u003c/span\u003e\u003c/div\u003e\n   \u003cdiv class=\"actions\"\u003e\u003ca id=\"openEmail\" class=\"button primary\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\"\u003eOpen filled-out email\u003c/a\u003e\u003c/div\u003e\n   \u003cp id=\"mailStatus\" class=\"status\" role=\"status\"\u003e\u003c/p\u003e\n   \u003clabel for=\"reportText\"\u003eComplete email body\u003c/label\u003e\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\"\u003e\u003c/textarea\u003e\n   \u003cp class=\"field-help\"\u003eCheck that your email includes all 12 tire positions and ends with END OF INSPECTION.\u003c/p\u003e\n   \u003cdetails class=\"backup\" id=\"backup\"\u003e\u003csummary\u003eBackup if the email opens with missing text\u003c/summary\u003e\n    \u003cp class=\"sub\"\u003eThis is a long inspection. If your phone limits the email text, copy the complete report, open the addressed email, and paste into the body.\u003c/p\u003e\n    \u003cdiv class=\"actions\"\u003e\u003cbutton id=\"copyReport\" class=\"button\" type=\"button\"\u003e1. Copy full report\u003c/button\u003e\u003ca id=\"shortEmail\" class=\"button\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\"\u003e2. Open email to paste\u003c/a\u003e\u003c/div\u003e\n    \u003cbutton id=\"selectReport\" class=\"button\" type=\"button\"\u003eSelect report for manual copy\u003c/button\u003e\u003cp id=\"copyStatus\" class=\"status\" role=\"status\"\u003e\u003c/p\u003e\n    \u003cp class=\"field-help\"\u003eIf your device blocks copying or opening email from this browser, use your approved email app with the recipient addresses and full report shown above.\u003c/p\u003e\n   \u003c/details\u003e\n  \u003c/section\u003e\n \u003c/div\u003e\n \u003cdiv class=\"foot\" id=\"foot\" hidden\u003e\u003cbutton class=\"button\" id=\"back\" type=\"button\"\u003eBack\u003c/button\u003e\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\"\u003eNext\u003c/button\u003e\u003c/div\u003e\n \u003cfooter class=\"bottom\"\u003e\u003csmall id=\"draftStatus\" role=\"status\"\u003eYour entries stay here while you fill out the form.\u003c/small\u003e\u003cbutton class=\"button\" id=\"clear\" type=\"button\"\u003eStart over\u003c/button\u003e\u003c/footer\u003e\n\u003c/main\u003e\u003cscript id=\"inspectionTextLayout\"\u003evar InspectionTextLayout=(function(){\n'use strict';\nvar WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length\u003ewidth){\n   var end=width;while(end\u003e0\u0026\u0026!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))\u0026\u0026/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){\n items.forEach(function(item,i){\n  if(i)lines.push('');\n  line(item.title);\n  (item.values||[]).forEach(function(value){line('    '+text(value));});\n  if(text(item.notes).trim())line('    Notes: '+item.notes);\n });\n}\n function fields(list){list.forEach(function(f){line(f[0]+': '+text(f[1]));});}\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script\u003e\n\u003cscript\u003evar TrailerConfig={\"legacyItemNumbers\": [\"1a\", \"1b\", \"1c\", \"2a\", \"2b\", \"2c\", \"3a\", \"3b\", \"3c\", \"3d\", \"3e\", \"4\", \"5a\", \"5b\", \"6a\", \"6b\", \"6c\", \"7a\", \"7b\", \"7c\", \"7d\", \"8a\", \"8b\", \"8c\", \"8d\", \"8e\", \"8f\", \"8g\", \"8h\", \"8i\", \"8j\", \"8k\", \"8l\", \"8m\", \"8n\", \"8p\", \"8q\", \"8r\", \"8s\", \"8t\", \"8u\", \"8v\", \"8w\", \"8x\", \"8y\", \"8z\", \"8aa\", \"8ab\", \"8ac\", \"8ad\", \"8ae\", \"8af\", \"9a\", \"9b\", \"9c\", \"10a\", \"10b\", \"10c\", \"10d\", \"10e\", \"11a\", \"11b\", \"11c\", \"11d\", \"12\", \"13\", \"14a\", \"14b\", \"14c\", \"14d\", \"14e\", \"15\", \"16\", \"17\"], \"groups\": [{\"id\": \"couplings\", \"title\": \"Couplings \u0026 landing gear\"}, {\"id\": \"body\", \"title\": \"Frame \u0026 body\"}, {\"id\": \"lights\", \"title\": \"Lights \u0026 connections\"}, {\"id\": \"hydraulics\", \"title\": \"Hydraulics \u0026 hoses\"}, {\"id\": \"lifting\", \"title\": \"Hoist \u0026 liftin \u003c/main\u003e\n\u003cscript id=\"inspectionTextLayout\"\u003evar InspectionTextLayout=(function(){\n'use strict';\nvar WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length\u003ewidth){\n   var end=width;while(end\u003e0\u0026\u0026!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))\u0026\u0026/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){items.forEach(function(item){var vals=(item.values||[]).join('; '),full=item.title+' - '+vals;if(full.length\u003c=WIDTH)line(full);else{line(item.title);line('    '+vals);}if(text(item.notes).trim())line('Notes - '+item.title+': '+item.notes);});}\n function fields(list){list.forEach(function(f){line(f[0]+': '+text(f[1]));});}\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script\u003e\n\u003cscript id=\"dvirApp\"\u003e\n(function(){\n'use strict';\nvar KEY='magtec-dvir-draft-v1';\nvar TYPES={pickup:'Pickup / light duty',tractor:'Tractor',trailer:'Trailer',tank:'Tank (400 / 600 BBL)',acb:'ACB'};\nvar DOC='Registration \u0026 documents';\nfunction I(t,d,g,r){return {t:t,d:d,g:g||'',r:r||''};}\nvar LISTS={\npickup:[\nI('Engine oil','Check dipstick level.'),\nI('Coolant','Check reservoir le eels','Check inflation by appearance, excessive wear, damage, and missing lug nuts.'),\nI('Lights','Headlights, marker lights, brake lights, turn signals, reverse lights, and reflectors.'),\nI('Fuel tanks \u0026 caps','Caps secure, tanks undamaged, and no visible leaks.'),\nI('Winter equipment','Engine heaters, battery heaters/chargers, and cords visually intact where equipped.'),\nI('Webasto heater','Operates normally, with no visible fuel leaks or exhaust damage.'),\nI('Gauges','Oil pressure, temperature, voltage, air pressure, and warning indicators normal.'),\nI('Air system','Air pressure builds properly, low-pressure warning operates, and no obvious air leaks.'),\nI('Air tanks drained','Drain the air tanks.'),\nI('Brakes','Service brakes and parking brakes operate properly.'),\nI('Steering','Normal operation with no unusual looseness.'),\nI('Fifth wheel','Coupling locked, visible connections secure, and no obvious damage.'),\nI('Pintle hook','Latch locks, pins secure, and no visible damage.'),\nI('Air \u0026 electrical lines','Connections secure, hoses undamaged, and no visible leaks.'),\nI('Windows \u0026 mirrors','Clear and undamaged.'),\nI('Cab equipment','Wipers, washers, heater, defroster, and horn operate.'),\nI(\"Driver's door alarm\",'Operates normally.'),\nI('DEF level','Check DEF level.'),\nI('Safety equipment','Seat belts, fire extinguisher, and emergency equipment present.'),\nI('Exterior','Check visible damage, loose components, mud flaps, and exhaust.'),\nI('Registration','Current registration is in the vehicle.',DOC),\nI('Inspection','Inspection sticker or tag is current.',DOC),\nI('License plate','Plate is present, secure, and legible.',DOC)\n],\ntrailer:[\nI('Tires \u0026 wheels','Check inflation by appearance, excessive wear, damage, and missing lug nuts.'),\nI('Lights \u0026 reflectors','Brake lights, taillights, turn signals, marker lights, and reflectors.'),\nI('Air \u0026 electrical lines','Connections secure, hoses and plugs undamaged.'), ecks[id]||{};d.checks[id]={result:RESULTS.indexOf(c.result)\u003e=0?c.result:'',note:str(c.note),filled:['','Yes','No'].indexOf(c.filled)\u003e=0?c.filled:''};});\n return d;\n}\nvar state=fresh(),step=0;\ntry{var saved=localStorage.getItem(KEY);if(saved)state=normalize(JSON.parse(saved));}catch(e){}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}\nfunction typeLabel(){return TYPES[state.fields.type]||'';}\nfunction get(id){return state.checks[id]||(state.checks[id]={result:'',note:'',filled:''});}\nfunction itemsFor(t){return (LISTS[t]||[]).map(function(it,i){return {id:t+'_'+(i+1),n:i+1,t:it.t,d:it.d,g:it.g,r:it.r,f:!!FLUID[it.t]};});}\nfunction items(){return itemsFor(state.fields.type);}\nfunction defects(){return items().filter(function(it){var k=get(it.id);return k.result==='Defective'\u0026\u0026!(it.f\u0026\u0026k.filled==='Yes');});}\nfunction counts(){var c={OK:0,Defective:0,'N/A':0,missing:0,filled:0};items().forEach(function(it){var k=get(it.id),r=k.result;if(!r)c.missing++;else if(r==='Defective'\u0026\u0026it.f\u0026\u0026k.filled==='Yes')c.filled++;else c[r]++;});return c;}\nfunction initials(){return (str(state.fields.name).match(/\\p{L}[\\p{L}\\p{M}'’-]*/gu)||[]).map(function(w){return Array.from(w)[0];}).join('').toUpperCase();}\nfunction showHours(){var t=state.fields.type;return t==='pickup'||t==='tractor'||t==='acb';}\nfunction showMileage(){var t=state.fields.type;return t==='pickup'||t==='tractor';}\nfunction whereIs(){var f=state.fields,s=f.locName.trim();if(f.rig.trim())s+=(s?' | ':'')+'Rig: '+f.rig.trim();return s;}\nfunction complaint(){\n var d=defects();if(!d.length)return '';\n var lines=['DVIR / pre-use defects on '+typeLabel()+', asset '+v(state.fields.asset)+':'];\n d.forEach(function(it){var n=get(it.id).note.trim();lines.push('- '+it.t+': '+(n||'No details entered'));});\n return lines.join('\\n');\n}\nfunction dvirReport(){\n var f=state.fields,list=items(),d=defects(),c=counts(),ini=initials(),p=InspectionTextLayout.create('DVIR / PRE-TRIP / PRE-USE / WALK-AROUND INSPECTION');\n p.fields([['Equipment type',v(typeLabel())],['Asset #',v(f.asset)],['Inspector',v(f.name)],['Date',v(f.date)],['Phone',v(f.phone)]]);\n p.line('Location: '+v(f.locName));\n p.line('Rig name: '+(f.rig.trim()?f.rig.trim():'None entered'));\n if(showHours())p.line((f.type==='acb'?'Hours: ':'Engine hours: ')+v(f.hours));\n if(showMileage())p.line('Mileage: '+v(f.mileage));\n p.line('Inspector initials: '+v(ini));\n p.line('Result: '+(d.length?'DEFECTS FOUND ('+d.length+')':(c.filled?'NO DEFECTS ('+c.filled+' fluid item'+(c.filled===1?'':'s')+' filled to correct level)':(c.missing?'No defects noted':'ALL ITEMS OK OR N/A'))));\n if(d.length)p.line('Safe to operate: '+v(f.safe));\n p.line('Key: OK = Good working order; Defective = Needs repair; N/A = Not applicable.');\n var groups=[],map={};\n list.forEach(function(it){var g=it.g||'Checklist';if(!map[g]){map[g]=[];groups.push(g);}map[g].push(it);});\n groups.forEach(function(g){\n  p.section(g);\n  p.grid(map[g].map(function(it){var k=get(it.id),rv=v(k.result);if(k.result==='Defective'\u0026\u0026it.f\u0026\u0026k.filled)rv='Defective, filled to correct level: '+k.filled;return {title:it.n+'. '+it.t+(it.r?' (Insp #'+it.r+')':''),values:[rv+(k.result\u0026\u0026ini?' ['+ini+']':'')],notes:k.note};}));\n });\n return p.finish();\n}\nfunction requestText(){\n var f=state.fields,lines=['SERVICE ORDER REQUEST',''];\n lines.push('Your name: '+(f.name.trim()||'Not entered'));\n lines.push('Contact phone number: '+(f.phone.trim()||'Not entered'));\n lines.push('Asset number: '+(f.asset.trim()||'Not entered'));\n lines.push('Where is the asset right now?: '+(whereIs()||'Not entered'));\n lines.push('Priority level: '+(f.priority||'Not entered'));\n lines.push('Description of complaint: '+complaint());\n lines.push('Safe to operate: '+(f.safe||'Not entered'));\n lines.push('Additional notes: '+(f.extra.trim()||'None'));\n return lines.join('\\r\\n').replace(/\\r\\n|\\r|\\n/g,'\\r\\n');\n}\nfunction report(){\n if(!defects().length)return dvirReport();\n return requestText()+'\\r\\n\\r\\nDVIR DETAILS\\r\\n\\r\\n'+dvirReport();\n}\nfunction subject(){var f=state.fields,a=f.asset.trim()||'Not recorded';return defects().length?'Service Order Request - '+a:'DVIR - '+a+' - No Defects';}\nfunction encode(x){var s=str(x);if(s.toWellFormed)s=s.toWellFormed();else s=s.replace(/[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDFFF]/g,function(m){return m.length===2?m:'\\uFFFD';});return encodeURIComponent(s);}\nfunction element(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}\nfunction field(parent,labelText,id,control){var wrap=element('div'),label=element('label','',labelText);label.htmlFor=id;control.id=id;wrap.append(label,control);parent.appendChild(wrap);return wrap;}\nfunction renderItems(){\n var box=el('items');box.replaceChildren();var list=items();\n if(!list.length){box.appendChild(element('p','sub','Select an equipment type in Details to load the checklist.'));return;}\n var multi=false;list.forEach(function(it){if(it.g)multi=true;});\n var group=null;\n list.forEach(function(it){\n  var g=it.g||'Checklist';\n  if(multi\u0026\u0026g!==group){group=g;box.appendChild(element('h3','group-title',g));}\n  var c=get(it.id),row=element('div','check');row.dataset.result=c.result;\n  var heading=element('h3','item-name'),num=element('span','number',it.n+'.');heading.append(num,document.createTextNode(it.t));row.appendChild(heading);\n  row.appendChild(element('p','item-desc',it.d+(it.r?' (Mechanic inspection item '+it.r+')':'')));\n  var grid=element('div','check-fields'),result=element('select');\n  [['','Select result'],['OK','OK'],['Defective','Defective'],['N/A','N/A']].forEach(function(o){var opt=element('option','',o[1]);opt.value=o[0];result.appendChild(opt);});\n  result.value=c.result;\n  var note=element('textarea');note.rows=2;note.value=c.note;\n  field(grid,'Result','result-'+it.id,result);\n  field(grid,'Notes (add details if defective)','note-'+it.id,note);\n  var fill=element('select');[['','Select'],['Yes','Yes'],['No','No']].forEach(function(o){var opt=element('option','',o[1]);opt.value=o[0];fill.appendChild(opt);});fill.value=c.filled||'';\n  var fillWrap=field(grid,'Did you fill it to the correct level?','filled-'+it.id,fill);\n  function paint(){fillWrap.hidden=!(it.f\u0026\u0026c.result==='Defective');row.dataset.result=(c.result==='Defective'\u0026\u0026it.f\u0026\u0026c.filled==='Yes')?'OK':c.result;}\n  result.addEventListener('change',function(){c.result=result.value;if(c.result!=='Defective')c.filled='';fill.value=c.filled;paint();save();updateNav();});\n  fill.addEventListener('change',function(){c.filled=fill.value;paint();save();updateNav();});paint();\n  note.addEventListener('input',function(){c.note=note.value;save();});\n  row.appendChild(grid);box.appendChild(row);\n });\n}\nfunction syncFields(){\n el('hoursWrap').hidden=!showHours();el('mileageWrap').hidden=!showMileage();\n el('hoursLabel').textContent=state.fields.type==='acb'?'Hours':'Engine hours';\n}\nfunction order(){return defects().length?[0,1,2,3]:[0,1,3];}\nfunction updateNav(){\n var ord=order();el('requestStep').hidden=ord.length\u003c4;\n el('stepCount').textContent='Section '+(ord.indexOf(step)+1)+' of '+ord.length;\n el('progressFill').style.width=((ord.indexOf(step)+1)/ord.length*100)+'%';\n}\nfunction renderRequest(){\n var d=defects();\n el('requestSummary').textContent=d.length+' defective item'+(d.length===1?'':'s')+' noted. The request below is filled in from your answers. Choose the priority and whether the unit is safe to operate, then add any other notes.';\n el('complaintText').value=complaint();\n}\nfunction review(){\n var f=state.fields,d=defects(),c=counts(),issues=[],block=false;\n if(!f.type){issues.push('Select an equipment type.');block=true;}\n if(!f.asset.trim())issues.push('Asset number is blank.');\n if(!f.name.trim())issues.push('Name is blank.');\n if(d.length){\n  if(!f.safe){issues.push('Select whether the unit is safe to operate (Service request section).');block=true;}\n  if(!f.priority){issues.push('Select a priority level (Service request section).');block=true;}\n  var noNote=d.filter(function(it){return !get(it.id).note.trim();}).length;\n  if(noNote)issues.push(noNote+' defective item'+(noNote===1?' has':'s have')+' no note.');\n }\n var unans=items().filter(function(it){var k=get(it.id);return it.f\u0026\u0026k.result==='Defective'\u0026\u0026!k.filled;}).length;\n if(unans)issues.push(unans+' fluid item'+(unans===1?' is':'s are')+' marked defective with no answer to \"Did you fill it to the correct level?\". It counts as a defect until answered.');\n if(c.missing)issues.push(c.missing+' item'+(c.missing===1?' has':'s have')+' no result and will show as Not recorded.');\n var summary='OK: '+c.OK+' | Defective: '+c.Defective+' | N/A: '+c['N/A']+(c.filled?' | Filled to level: '+c.filled:'')+'.';\n if(d.length)summary+=' The email goes out as a service order request with the DVIR listed under it.';\n if(issues.length)summary+=' '+issues.join(' ');\n el('completion').textContent=summary;\n el('openEmail').disabled=block;\n el('reportText').value=report();\n}\nvar panelIds=['detailsPanel','checklistPanel','requestPanel','review'];\nfunction show(index){\n var ord=order();if(ord.indexOf(index)\u003c0)index=3;step=index;\n panelIds.forEach(function(id,i){el(id).hidden=i!==step;});\n document.querySelectorAll('[data-step]').forEach(function(b){if(Number(b.dataset.step)===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});\n if(step===2)renderRequest();\n if(step===3)review();\n updateNav();\n var pos=ord.indexOf(step);\n el('back').hidden=pos===0;el('next').hidden=pos===ord.length-1;\n el('next').textContent=ord[pos+1]===3?'Review inspection':'Next';\n el('foot').hidden=false;window.scrollTo(0,0);\n}\nfuncti

enter;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);cursor:pointer;text-align:center}.primary{background:var(--amber);border-color:var(--amber);color:#211809}.primary:hover{background:#ffbb4d}.grow{flex:1}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.actions .button{flex:1 1 180px}.notice{padding:14px;border:1px solid #846332;border-radius:7px;background:#30281b;color:var(--text);font-size:14px;margin-bottom:18px}.recipients{padding:14px;background:var(--bg);border-radius:7px;margin:16px 0;overflow-wrap:anywhere;font-size:13px}.recipients strong{display:block;margin-bottom:4px;color:var(--sub)}.report{font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:360px;white-space:pre-wrap}.backup{border:1px solid var(--line);border-radius:7px;padding:14px;margin-top:18px}.backup summary{font-size:14px;font-weight:600;cursor:pointer;min-height:28px}.backup p{margin-top:12px;margin-bottom:8px}.status{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line)}.bottom .button{font-size:12px;min-height:40px;padding:8px 12px}.bottom small{color:var(--sub);font-size:12px}.step-count{font-size:12px;color:var(--sub);margin-bottom:12px}noscript{display:block;padding:24px;color:var(--text)}\n@media(max-width:620px){body{padding:0}.app{border:0;border-radius:0}.head,.content{padding:20px 16px}.steps{padding:12px 16px;gap:5px}.step{flex:1 1 28%;font-size:12px;padding:8px}.fields{grid-template-columns:1fr}.check-fields{grid-template-columns:minmax(0,1fr) 90px}.comment{grid-column:1/-1}.comment textarea{height:72px}.foot,.bottom{padding:16px}.tire .fields{grid-template-columns:1fr 1fr}.report{font-size:13px}.bottom{align-items:flex-start}.head h1{font-size:22px}}\n\n.app [hidden]{display:none!important}\n.check-fields{grid-template-columns:150px 150px minmax(0,1fr)}\n.check[data-repair=\"Yes\"]{border-left:3px solid #ff9389;padding-left:12px}\n.check[data-checked=\"No\"]{border-left:3px solid var(--amber);padding-left:12px}\n@media(max-width:620px){.check-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.comment{grid-column:1/-1}}\ndialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:calc(100% - 32px);max-width:440px}\ndialog::backdrop{background:rgba(0,0,0,.7)}\n.location-options{display:flex;gap:12px;margin:20px 0}\n.location-options .button{flex:1;min-width:0}\n.bottom{justify-content:flex-end}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"app\">\n\u003cheader class=\"head\">\u003cdiv class=\"brand\">MagTec Alaska\u003c/div>\u003ch1>ACB Inspection\u003c/h1>\u003c/header>\n\u003cnav class=\"steps\" aria-label=\"Inspection sections\">\n\u003cbutton type=\"button\" class=\"step\" data-step=\"0\" aria-controls=\"detailsPanel\" aria-current=\"step\">1. Details\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"1\" aria-controls=\"checklistPanel\">2. Inspection checklist\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"2\" aria-controls=\"review\">3. Review &amp; email\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n\u003cnoscript>Enable JavaScript to fill out this inspection.\u003c/noscript>\n\u003cdiv class=\"content\" id=\"content\" hidden>\n\u003cdiv id=\"stepCount\" class=\"step-count\" aria-live=\"polite\">\u003c/div>\n\u003csection class=\"panel\" id=\"detailsPanel\" aria-labelledby=\"detailsTitle\">\n\u003ch2 id=\"detailsTitle\">ACB &amp; technician details\u003c/h2>\n\u003cdiv class=\"fields\">\n\u003cdiv>\u003clabel for=\"asset\">ACB asset number\u003c/label>\u003cinput id=\"asset\" data-key=\"asset\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"technician\">Technician name\u003c/label>\u003cinput id=\"technician\" data-key=\"technician\" type=\"text\" autocomplete=\"name\">\u003c/div>\n\u003cdiv>\u003clabel for=\"date\">Date\u003c/label>\u003cinput id=\"date\" data-key=\"date\" type=\"date\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel for=\"associatedSE\">Associated SE# (if available)\u003c/label>\u003cinput id=\"associatedSE\" data-key=\"associatedSE\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"panel\" id=\"checklistPanel\" aria-labelledby=\"checklistTitle\" hidden>\n\u003ch2 id=\"checklistTitle\">Inspection checklist\u003c/h2>\n\u003cdiv id=\"inspectionItems\">\u003c/div>\n\u003c/section>\n\u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden>\n\u003ch2 id=\"reviewTitle\">Review &amp; open email\u003c/h2>\n\u003cdiv class=\"actions\">\u003cbutton id=\"openEmail\" class=\"button primary\" type=\"button\">Open Email\u003c/button>\u003c/div>\n\u003clabel for=\"reportText\">Complete email body\u003c/label>\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\">\u003c/textarea>\n\u003c/section>\n\u003c/div>\n\u003cdiv class=\"foot\" id=\"foot\" hidden>\u003cbutton class=\"button\" id=\"back\" type=\"button\">Back\u003c/button>\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\">Next\u003c/button>\u003c/div>\n\u003cfooter class=\"bottom\">\u003cbutton class=\"button\" id=\"clear\" type=\"button\">Start Over\u003c/button>\u003c/footer>\n\u003c/main>\n\n\u003cscript id=\"inspectionTextLayout\">var InspectionTextLayout=(function(){\n'use strict';\nvar COLUMN=24,WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length>width){\n   var end=width;while(end>0&&!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))&&/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){\n  var pending=[];\n  function full(item){line(item.title+' | '+(item.values||[]).join('; '));if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);}\n  function flush(){\n   if(pending.length\u003c3){pending.forEach(full);pending=[];return;}\n   var row=pending,cells=row.map(function(item){return wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN);}),height=Math.max.apply(null,cells.map(function(c){return c.length;}));\n   for(var i=0;i\u003cheight;i++){\n    lines.push(cells.map(function(c){return (c[i]||'').padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));\n   }\n   row.forEach(function(item){if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);});\n   pending=[];\n  }\n  items.forEach(function(item){var height=wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN).length;if(height>4){flush();full(item);}else{pending.push(item);if(pending.length===3)flush();}});flush();\n }\n function fields(list){\n  var row=[];\n  function flush(){if(row.length){lines.push(row.map(function(s){return s.padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));row=[];}}\n  list.forEach(function(f){var entry=f[0]+': '+text(f[1]);if(entry.length>COLUMN||/[\\r\\n]/.test(entry)){flush();line(entry);}else{row.push(entry);if(row.length===3)flush();}});flush();\n }\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script>\n\u003cscript id=\"reportLogic\">\nvar ACBReport=(function(){\n'use strict';\nvar items=[\n    {line:'Check for signs of a leak from level indicator from bad indicator packing.',check:'signs of a leak from the level indicator due to bad indicator packing',repair:'the level indicator / indicator packing'},\n    {line:'Check safety latch for damage',check:'the safety latch for damage',repair:'the safety latch'},\n    {line:'Check ladder for damage',check:'the ladder for damage',repair:'the ladder'},\n    {line:'Ensure all grease points are greased',check:'that all grease points are greased',repair:'the grease points'},\n    {line:'Ensure rollers are functioning',check:'that the rollers are functioning',repair:'the rollers'},\n    {line:'Inspect rear door for heat while the heaters are running',check:'the rear door for heat while the heaters are running',repair:'the rear door / heating'},\n    {line:'Inspect all external hoses for leaks including hydraulic',check:'all external hoses for leaks, including hydraulic hoses',repair:'the external hoses, including hydraulic hoses'},\n    {line:'Ensure exterior exhaust/fan vents are clear of debris',check:'that the exterior exhaust/fan vents are clear of debris',repair:'the exterior exhaust/fan vents'},\n    {line:'Check gauges/gauge lights function',check:'that the gauges and gauge lights function',repair:'the gauges / gauge lights'},\n    {line:'Inspect Wing fittings for damaged bent or broken welds on rear door',check:'the wing fittings on the rear door for damage, bends or broken welds',repair:'the rear door wing fittings / welds'},\n    {line:'Function test 4\" load and suction valves',check:'the function of the 4\" load and suction valves',repair:'the 4\" load and suction valves'},\n    {line:'Check all Camlocks, gaskets, caps and plugs',check:'all Camlocks, gaskets, caps and plugs',repair:'the Camlocks, gaskets, caps and plugs'},\n    {line:'Take note of any damage to front bumpers/exterior skin',check:'the front bumpers / exterior skin for damage',repair:'the front bumpers / exterior skin'}\n  ];\nvar recipients={\n 'North Slope':['NSRentals@magtecalaska.com','nsshop@magtecalaska.com','nsd-mgr@magtecalaska.com','Olivia@magtecalaska.com','ccorwin@magtecalaska.com'],\n 'Kenai':['Olivia@magtecalaska.com','ccorwin@magtecalaska.com','Jwolf@magtecalaska.com']\n};\nfunction str(v){return v==null?'':String(v);}\nfunction value(v){return str(v).trim()?str(v):'Not answered';}\nfunction fresh(){return {fields:{asset:'',technician:'',date:'',associatedSE:'',location:''},checks:items.map(function(){return {checked:'',repair:'',notes:''};})};}\nfunction report(state){\n var f=state.fields,p=InspectionTextLayout.create('ACB INSPECTION'),inspectorInitials=(str(f.technician).match(/\\p{L}[\\p{L}\\p{M}'’-]*/gu)||[]).map(function(word){return Array.from(word)[0];}).join('').toUpperCase();\n p.fields([['ACB asset number',value(f.asset)],['Technician name',value(f.technician)],['Date',value(f.date)],['Associated SE#',value(f.associatedSE)]]);\n if(f.location)p.line('Location: '+f.location);p.line('Inspector initials: '+value(inspectorInitials));\n p.section('Inspection checklist');\n p.grid(items.map(function(item,i){var c=state.checks[i];return {title:(i+1)+'. '+item.line,values:['Checked: '+value(c.checked),'Repair needed: '+value(c.repair)+' ['+value(inspectorInitials)+']'],notes:c.notes};}));\n return p.finish();\n}\n\nfunction encode(v){\n var s=str(v);\n if(s.toWellFormed)s=s.toWellFormed();\n else s=s.replace(/[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDFFF]/g,function(m){return m.length===2?m:'\\uFFFD';});\n return encodeURIComponent(s);\n}\nfunction link(state,location){\n if(!Object.prototype.hasOwnProperty.call(recipients,location))return '';\n var subject='ACB Inspection'+(state.fields.asset?' - '+state.fields.asset:'');\n return 'mailto:'+recipients[location].join(',')+'?subject='+encode(subject)+'&body='+encode(report(state));\n}\nreturn {items:items,recipients:recipients,fresh:fresh,report:report,link:link};\n})();\n\u003c/script>\n\u003cscript id=\"checklistApp\">\n(function(R){\n'use strict';\nvar state=R.fresh(),step=0,panels=['detailsPanel','checklistPanel','review'];\nfunction el(id){return document.getElementById(id);}\nfunction element(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}\nfunction field(parent,labelText,id,control){\n var wrap=element('div'),label=element('label','',labelText);label.htmlFor=id;control.id=id;\n wrap.append(label,control);parent.appendChild(wrap);return wrap;\n}\nfunction choice(){\n var select=element('select');\n [['','Select'],['Yes','Yes'],['No','No']].forEach(function(v){var opt=element('option','',v[1]);opt.value=v[0];select.appendChild(opt);});\n return select;\n}\nfunction buildItems(){\n R.items.forEach(function(item,i){\n  var c=state.checks[i],row=element('div','check');\n  var heading=element('h3','item-name'),number=element('span','number',String(i+1)+'.');\n  heading.append(number,document.createTextNode(item.line));row.appendChild(heading);\n  var grid=element('div','check-fields'),checked=choice(),repair=choice(),notes=element('textarea');\n  checked.value=c.checked;repair.value=c.repair;notes.value=c.notes;notes.rows=1;\n  field(grid,'Checked','checked'+i,checked);\n  field(grid,'Repair needed','repair'+i,repair);\n  field(grid,'Repair details / notes','notes'+i,notes).className='comment';\n  checked.addEventListener('change',function(){c.checked=checked.value;row.dataset.checked=c.checked;});\n  repair.addEventListener('change',function(){c.repair=repair.value;row.dataset.repair=c.repair;});\n  notes.addEventListener('input',function(){c.notes=notes.value;});\n  row.appendChild(grid);el('inspectionItems').appendChild(row);\n });\n}\nfunction review(){\n el('reportText').value=R.report(state);\n}\nfunction show(index){\n step=Math.max(0,Math.min(panels.length-1,index));\n panels.forEach(function(id,i){el(id).hidden=i!==step;});\n document.querySelectorAll('[data-step]').forEach(function(button){\n  if(Number(button.dataset.step)===step)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');\n });\n el('stepCount').textContent='Section '+(step+1)+' of '+panels.length;\n el('progressFill').style.width=((step+1)/panels.length*100)+'%';\n el('back').hidden=step===0;el('next').hidden=step===panels.length-1;\n el('next').textContent=step===panels.length-2?'Review inspection':'Next';\n if(step===panels.length-1)review();\n window.scrollTo(0,0);\n}\ndocument.querySelectorAll('[data-key]').forEach(function(input){\n input.addEventListener('input',function(){state.fields[input.dataset.key]=input.value;});\n});\ndocument.querySelectorAll('[data-step]').forEach(function(button){\n button.addEventListener('click',function(){show(Number(button.dataset.step));});\n});\nel('back').addEventListener('click',function(){show(step-1);});\nel('next').addEventListener('click',function(){show(step+1);});\nel('openEmail').addEventListener('click',function(){\n review();\n var uri='mailto:?subject='+encodeURIComponent('ACB Inspection'+(state.fields.asset?' - '+state.fields.asset:''))+'&body='+encodeURIComponent(R.report(state));\n window.parent.MagTecPortal.requestEmail('ACBinsp',uri);\n});\nel('clear').addEventListener('click',function(){\n if(!window.confirm('Clear this inspection and start a new one?'))return;\n state=R.fresh();\n document.querySelectorAll('[data-key]').forEach(function(input){input.value='';});\n el('inspectionItems').replaceChildren();buildItems();\n el('reportText').value='';show(0);\n});\nbuildItems();el('content').hidden=false;el('foot').hidden=false;show(0);\n})(ACBReport);\n\u003c/script>\n\u003cstyle id=\"portalCleanUi\">.recipients,.backup,.status,.bottom small,.head>p.sub,.btn .s{display:none!important}\u003c/style>\n\u003cscript id=\"portalEmailBridge\">\n(function(){\n'use strict';\ndocument.addEventListener('click',function(event){\n var link=event.target.closest?event.target.closest('a'):null;\n if(!link)return;\n var href=link.href||'';\n if(href.slice(0,7).toLowerCase()!=='mailto:')return;\n event.preventDefault();\n window.parent.MagTecPortal.requestEmail('ACBinsp',href);\n});\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"},"LDinsp":{"title":"Light Duty Inspection","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#14181c\">\n\u003cmeta name=\"apple-mobile-web-app-title\" content=\"Light Duty\">\n\u003ctitle>MagTec Light Duty Vehicle Checklist\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark;--bg:#14181c;--panel:#1c2127;--line:#36404a;--text:#eef1f4;--sub:#adb7c1;--amber:#f5a623}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 12px 32px}.app{max-width:880px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}h1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 8px}h2{font-size:20px;font-weight:600;margin:0 0 8px}p{margin:0 0 16px}.sub{color:var(--sub);font-size:14px}.head p{margin:0}.steps{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}.step{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:6px;min-height:44px;padding:9px 12px;font:600 13px/1.3 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}.step[aria-current=step]{background:var(--amber);border-color:var(--amber);color:#211809}.progress{height:4px;background:var(--line)}#progressFill{height:100%;width:0;background:var(--amber)}.content{padding:24px}.panel[hidden]{display:none!important}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label,.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:16px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif}textarea{resize:vertical;min-height:88px}input,select{min-height:48px}input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.field-help{color:var(--sub);font-size:12px;margin:5px 0 0}.check{padding:18px 0;border-bottom:1px solid var(--line)}.check:first-child{padding-top:0}.check:last-child{border-bottom:0}.item-name{font-size:16px;font-weight:600;margin:0 0 12px}.number{color:var(--amber);display:inline-block;min-width:28px}.check-fields{display:grid;grid-template-columns:150px 90px minmax(0,1fr);gap:12px;align-items:start}.comment textarea{min-height:48px;height:48px}.expiry{margin-top:12px;max-width:290px}.check[data-result=Fail]{border-left:3px solid #ff9389;padding-left:12px}.check[data-result=Pass]{border-left:3px solid #62c994;padding-left:12px}.check[data-result=\"N/A\"]{border-left:3px solid #a5b8cf;padding-left:12px}.tire{border-bottom:1px solid var(--line);padding:18px 0}.tire:first-child{padding-top:0}.tire-name{font-weight:600;margin-bottom:10px}.notes{margin-top:24px}.foot{display:flex;gap:12px;border-top:1px solid var(--line);padding:18px 24px}.button{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);cursor:pointer;text-align:center}.primary{background:var(--amber);border-color:var(--amber);color:#211809}.primary:hover{background:#ffbb4d}.grow{flex:1}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.actions .button{flex:1 1 180px}.notice{padding:14px;border:1px solid #846332;border-radius:7px;background:#30281b;color:var(--text);font-size:14px;margin-bottom:18px}.recipients{padding:14px;background:var(--bg);border-radius:7px;margin:16px 0;overflow-wrap:anywhere;font-size:13px}.recipients strong{display:block;margin-bottom:4px;color:var(--sub)}.report{font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:360px;white-space:pre-wrap}.backup{border:1px solid var(--line);border-radius:7px;padding:14px;margin-top:18px}.backup summary{font-size:14px;font-weight:600;cursor:pointer;min-height:28px}.backup p{margin-top:12px;margin-bottom:8px}.status{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line)}.bottom .button{font-size:12px;min-height:40px;padding:8px 12px}.bottom small{color:var(--sub);font-size:12px}.step-count{font-size:12px;color:var(--sub);margin-bottom:12px}noscript{display:block;padding:24px;color:var(--text)}\n@media(max-width:620px){body{padding:0}.app{border:0;border-radius:0}.head,.content{padding:20px 16px}.steps{padding:12px 16px;gap:5px}.step{flex:1 1 28%;font-size:12px;padding:8px}.fields{grid-template-columns:1fr}.check-fields{grid-template-columns:minmax(0,1fr) 90px}.comment{grid-column:1/-1}.comment textarea{height:72px}.foot,.bottom{padding:16px}.tire .fields{grid-template-columns:1fr 1fr}.report{font-size:13px}.bottom{align-items:flex-start}.head h1{font-size:22px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"app\">\n  \u003cheader class=\"head\">\u003cdiv class=\"brand\">MagTec Alaska\u003c/div>\u003ch1>Light Duty Vehicle Checklist\u003c/h1>\u003cp class=\"sub\">Complete the inspection, then open the filled-out email.\u003c/p>\u003c/header>\n  \u003cnav class=\"steps\" aria-label=\"Inspection sections\">\n    \u003cbutton type=\"button\" class=\"step\" data-step=\"0\" aria-controls=\"detailsPanel\" aria-current=\"step\">1. Details\u003c/button>\n    \u003cbutton type=\"button\" class=\"step\" data-step=\"1\" aria-controls=\"checksOne\">2. Checklist 1\u003c/button>\n    \u003cbutton type=\"button\" class=\"step\" data-step=\"2\" aria-controls=\"checksTwo\">3. Checklist 2\u003c/button>\n    \u003cbutton type=\"button\" class=\"step\" data-step=\"3\" aria-controls=\"tiresPanel\">4. Tires &amp; notes\u003c/button>\n    \u003cbutton type=\"button\" class=\"step\" data-step=\"4\" aria-controls=\"review\">5. Review &amp; email\u003c/button>\n  \u003c/nav>\n  \u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n  \u003cnoscript>Open this page in Safari, Chrome, or Edge with JavaScript enabled to fill out the inspection.\u003c/noscript>\n  \u003cdiv class=\"content\" id=\"content\" hidden>\n    \u003cdiv id=\"stepCount\" class=\"step-count\" aria-live=\"polite\">\u003c/div>\n    \u003csection class=\"panel\" id=\"detailsPanel\" aria-labelledby=\"detailsTitle\">\n      \u003ch2 id=\"detailsTitle\">Vehicle &amp; inspector details\u003c/h2>\n      \u003cp class=\"sub\">Enter the information for this inspection. Your initials are copied to each result when you select it.\u003c/p>\n      \u003cdiv class=\"fields\">\n        \u003cdiv>\u003clabel for=\"asset\">Asset number\u003c/label>\u003cinput id=\"asset\" data-key=\"asset\" type=\"text\" autocomplete=\"off\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"technician\">Technician / inspector name\u003c/label>\u003cinput id=\"technician\" data-key=\"technician\" type=\"text\" autocomplete=\"name\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"date\">Inspection date\u003c/label>\u003cinput id=\"date\" data-key=\"date\" type=\"date\">\u003c/div>\u003cdiv>\u003clabel for=\"associatedSE\">Associated SE# (if available)\u003c/label>\u003cinput id=\"associatedSE\" data-key=\"associatedSE\" type=\"text\" autocomplete=\"off\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"initials\">Your initials\u003c/label>\u003cinput id=\"initials\" data-key=\"initials\" type=\"text\" autocomplete=\"off\">\u003cp class=\"field-help\">You can change the initials on any individual item.\u003c/p>\u003c/div>\n        \u003cdiv>\u003clabel for=\"project\">Project location\u003c/label>\u003cinput id=\"project\" data-key=\"project\" type=\"text\" autocomplete=\"off\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"site\">Site\u003c/label>\u003cinput id=\"site\" data-key=\"site\" type=\"text\" autocomplete=\"off\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"vehicle\">Vehicle type\u003c/label>\u003cinput id=\"vehicle\" data-key=\"vehicle\" type=\"text\" autocomplete=\"off\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"milesHours\">Miles / hours\u003c/label>\u003cinput id=\"milesHours\" data-key=\"milesHours\" type=\"text\" autocomplete=\"off\">\u003cp class=\"field-help\">Include miles, hours, or both.\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"panel\" id=\"checksOne\" aria-labelledby=\"checksOneTitle\" hidden>\n      \u003ch2 id=\"checksOneTitle\">Vehicle checklist - page 1\u003c/h2>\u003cp class=\"sub\">Select N/A, Pass, or Fail and enter initials for each item. Add comments wherever needed.\u003c/p>\u003cdiv id=\"itemsOne\">\u003c/div>\n    \u003c/section>\n    \u003csection class=\"panel\" id=\"checksTwo\" aria-labelledby=\"checksTwoTitle\" hidden>\n      \u003ch2 id=\"checksTwoTitle\">Vehicle checklist - page 2\u003c/h2>\u003cp class=\"sub\">Continue the checklist and record registration and insurance expiration dates.\u003c/p>\u003cdiv id=\"itemsTwo\">\u003c/div>\n    \u003c/section>\n    \u003csection class=\"panel\" id=\"tiresPanel\" aria-labelledby=\"tiresTitle\" hidden>\n      \u003ch2 id=\"tiresTitle\">Tires\u003c/h2>\u003cp class=\"sub\">Enter PSI and tread depth for each tire. Include the units with tread depth, such as 8/32 in.\u003c/p>\u003cdiv id=\"tires\">\u003c/div>\n      \u003cdiv class=\"notes\">\u003clabel for=\"notes\">Comments / notes\u003c/label>\u003ctextarea id=\"notes\" data-key=\"notes\" rows=\"5\">\u003c/textarea>\u003c/div>\n    \u003c/section>\n    \u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden>\n      \u003ch2 id=\"reviewTitle\">Review &amp; open email\u003c/h2>\n      \u003cp class=\"sub\">The full inspection goes in the email body. Review the draft in your email app, then send it.\u003c/p>\n      \u003cdiv id=\"completion\" class=\"notice\">\u003c/div>\n      \u003cdiv class=\"recipients\">\u003cstrong>Email recipients\u003c/strong>\u003cspan id=\"recipientList\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"actions\">\u003ca id=\"openEmail\" class=\"button primary\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">Open filled-out email\u003c/a>\u003c/div>\n      \u003cp id=\"mailStatus\" class=\"status\" role=\"status\">\u003c/p>\n      \u003clabel for=\"reportText\">Complete email body\u003c/label>\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\" aria-describedby=\"reportHelp\">\u003c/textarea>\n      \u003cp id=\"reportHelp\" class=\"field-help\">This includes every checklist item, result, initials, comment, expiration date, tire reading, and note.\u003c/p>\n      \u003cdetails class=\"backup\" id=\"backup\">\n        \u003csummary>Backup if the email opens with missing text\u003c/summary>\n        \u003cp class=\"sub\">Some phones limit how much text can be passed to an email app. Copy the complete report, open an email with the recipients filled in, then paste the report into the body.\u003c/p>\n        \u003cdiv class=\"actions\">\u003cbutton id=\"copyReport\" class=\"button\" type=\"button\">1. Copy full report\u003c/button>\u003ca id=\"shortEmail\" class=\"button\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">2. Open email to paste\u003c/a>\u003c/div>\n        \u003cbutton id=\"selectReport\" class=\"button\" type=\"button\">Select report for manual copy\u003c/button>\n        \u003cp id=\"copyStatus\" class=\"status\" role=\"status\">\u003c/p>\n        \u003cp class=\"field-help\">If your device blocks copying or opening email from this browser, open your approved email app and use the recipient addresses and report shown above.\u003c/p>\n      \u003c/details>\n    \u003c/section>\n  \u003c/div>\n  \u003cdiv class=\"foot\" id=\"foot\" hidden>\u003cbutton class=\"button\" id=\"back\" type=\"button\">Back\u003c/button>\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\">Next\u003c/button>\u003c/div>\n  \u003cfooter class=\"bottom\">\u003csmall id=\"draftStatus\" role=\"status\">Your entries stay here while you fill out the form.\u003c/small>\u003cbutton class=\"button\" id=\"clear\" type=\"button\">Start over\u003c/button>\u003c/footer>\n\u003c/main>\n\u003cscript id=\"inspectionTextLayout\">var InspectionTextLayout=(function(){\n'use strict';\nvar COLUMN=24,WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n return text(value).replace(/\\r\\n|\\r/g,'\\n').split('\\n').reduce(function(all,line){\n  while(line.length>width){\n   var end=width;while(end>0&&!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=width;\n   if(/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))&&/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   all.push(line.slice(0,end));line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  all.push(line);return all;\n },[]);\n}\nfunction create(title){\n var lines=[title,RULE];\n function line(value){wrap(value,WIDTH).forEach(function(s){lines.push(s);});}\n function section(title){if(lines[lines.length-1]!==RULE)lines.push(RULE);line(text(title).toUpperCase());lines.push(RULE);}\n function grid(items){\n  var pending=[];\n  function full(item){line(item.title+' | '+(item.values||[]).join('; '));if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);}\n  function flush(){\n   if(pending.length\u003c3){pending.forEach(full);pending=[];return;}\n   var row=pending,cells=row.map(function(item){return wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN);}),height=Math.max.apply(null,cells.map(function(c){return c.length;}));\n   for(var i=0;i\u003cheight;i++){\n    lines.push(cells.map(function(c){return (c[i]||'').padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));\n   }\n   row.forEach(function(item){if(text(item.notes).trim())line('Notes — '+item.title+': '+item.notes);});\n   pending=[];\n  }\n  items.forEach(function(item){var height=wrap(item.title+' — '+(item.values||[]).join('; '),COLUMN).length;if(height>4){flush();full(item);}else{pending.push(item);if(pending.length===3)flush();}});flush();\n }\n function fields(list){\n  var row=[];\n  function flush(){if(row.length){lines.push(row.map(function(s){return s.padEnd(COLUMN,' ');}).join(' | ').replace(/[ \\t]+$/,''));row=[];}}\n  list.forEach(function(f){var entry=f[0]+': '+text(f[1]);if(entry.length>COLUMN||/[\\r\\n]/.test(entry)){flush();line(entry);}else{row.push(entry);if(row.length===3)flush();}});flush();\n }\n function finish(){if(lines[lines.length-1]!==RULE)lines.push(RULE);lines.push('END OF INSPECTION');return lines.join('\\r\\n');}\n return {line:line,section:section,grid:grid,fields:fields,finish:finish};\n}\nreturn {create:create};\n})();\n\u003c/script>\n\u003cscript id=\"reportLogic\">\nvar LightDutyReport=(function(){\n  'use strict';\n  var recipients=['NSrentals@magtecalaska.com','nsshop@magtecalaska.com','nsd-mgr@magtecalaska.com'];\n  var items=['Body Damage','Windows & Mirrors','Winter Front','Battery Charger & Battery','Engine Oil Pan Heater','Transmission Pan Heater','Block/Coolant Heater','Windshield Wipers','Engine Oil Level','Coolant Level','Brake Fluid','Power Steering Fluid','Transmission Fluid','Windshield Washer Fluid','Marker Lights','Headlights & Taillights','Brake, Turn & Reverse Signals','4X4 Operation','Horn','Gauges (Fuel, Battery, Oil)','Seat Covers','Seat Belts','Floor Mats','Fire Extinguisher/First Aid','No Loose Items in Cab','Spare Tire Jack','Mud Flaps','Interiors & Exteriors Clean','Tags & Registration','Insurance'];\n  var tires=['Left Front','Right Front','Right Rear','Left Rear','Spare'];\n  function str(v){return v==null?'':String(v);}\n  function value(v){return str(v).trim()?str(v):'Not recorded';}\n  function newline(v){return str(v).replace(/\\r\\n|\\r|\\n/g,'\\r\\n');}\n  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\n  function fresh(){return {version:1,fields:{date:today()},checks:items.map(function(){return {result:'',initials:'',comment:'',expiry:''};}),tires:tires.map(function(){return {psi:'',tread:''};})};}\n  function normalize(s){var d=fresh();if(!s||s.version!==1)return d;Object.keys(s.fields||{}).forEach(function(k){d.fields[k]=str(s.fields[k]);});d.checks.forEach(function(c,i){var a=(s.checks||[])[i]||{};Object.keys(c).forEach(function(k){c[k]=str(a[k]);});if(['','N/A','Pass','Fail'].indexOf(c.result)\u003c0)c.result='';});d.tires.forEach(function(t,i){var a=(s.tires||[])[i]||{};t.psi=str(a.psi);t.tread=str(a.tread);});return d;}\n  function counts(s){var c={Pass:0,Fail:0,'N/A':0,missing:0,initials:0};s.checks.forEach(function(r){if(r.result)c[r.result]++;else c.missing++;if(r.result&&!r.initials.trim())c.initials++;});return c;}\n  function report(s){\n var f=s.fields,p=InspectionTextLayout.create('LIGHT DUTY VEHICLE CHECKLIST');\n p.fields([['Asset #',value(f.asset)],['Technician/Inspector',value(f.technician)],['Inspection date',value(f.date)],['Associated SE#',value(f.associatedSE)],['Project location',value(f.project)],['Site',value(f.site)],['Vehicle type',value(f.vehicle)],['Miles/Hours',value(f.milesHours)],['Inspector initials',value(f.initials)]]);\n [[0,20,'Vehicle checks'],[20,items.length,'Cab, safety & documents']].forEach(function(g){\n  p.section(g[2]);var entries=[];\n  for(var i=g[0];i\u003cg[1];i++){var c=s.checks[i],values=[value(c.result)+' ['+value(c.initials)+']'];if(i===28||i===29)values.push('EXP Date: '+value(c.expiry));entries.push({title:(i+1)+'. '+items[i],values:values,notes:c.comment});}\n  p.grid(entries);\n });\n p.section('Tires — PSI / tread depth');p.grid(tires.map(function(label,i){return {title:label,values:['PSI: '+value(s.tires[i].psi),'Tread: '+value(s.tires[i].tread)]};}));\n if(str(f.notes).trim()){p.section('Comments / notes');p.line(f.notes);}\n var c=counts(s);p.line('Result counts: Pass '+c.Pass+'; Fail '+c.Fail+'; N/A '+c['N/A']+'; Not recorded '+c.missing);\n return p.finish();\n}\n\n  function subject(s){return 'Light Duty Inspection - '+value(s.fields.asset)+' - '+value(s.fields.date);}\n  function encode(v){var s=str(v);if(s.toWellFormed)s=s.toWellFormed();else s=s.replace(/[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDFFF]/g,function(m){return m.length===2?m:'\\uFFFD';});return encodeURIComponent(s);}\n  function link(s,withBody){return 'mailto:'+recipients.join(',')+'?subject='+encode(subject(s))+(withBody?'&body='+encode(report(s)):'');}\n  return {recipients:recipients,items:items,tires:tires,fresh:fresh,normalize:normalize,counts:counts,report:report,link:link};\n})();\n\u003c/script>\n\u003cscript>\n(function(){\n  'use strict';\n  var R=LightDutyReport,KEY='magtec-light-duty-draft-v1',state=R.fresh(),step=0;\n  var panels=['detailsPanel','checksOne','checksTwo','tiresPanel','review'];\n  function el(id){return document.getElementById(id);}\n  try{var saved=localStorage.getItem(KEY);if(saved){state=R.normalize(JSON.parse(saved));el('draftStatus').textContent='Saved draft restored on this device.';}}catch(e){}\n  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));el('draftStatus').textContent='Draft saved on this device.';}catch(e){el('draftStatus').textContent='Keep this page open to retain your entries.';}}\n  function element(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}\n  function field(parent,labelText,id,control){var wrap=element('div');var label=element('label','',labelText);label.htmlFor=id;control.id=id;wrap.append(label,control);parent.appendChild(wrap);return wrap;}\n  function input(type,value){var n=element('input');n.type=type;n.value=value||'';n.autocomplete='off';return n;}\n  function buildItems(){\n    R.items.forEach(function(name,i){\n      var c=state.checks[i],row=element('div','check');row.dataset.result=c.result;\n      var heading=element('h3','item-name'),number=element('span','number',String(i+1)+'.');heading.append(number,document.createTextNode(name));row.appendChild(heading);\n      var grid=element('div','check-fields');\n      var result=element('select');[['','Select result'],['N/A','N/A'],['Pass','Pass'],['Fail','Fail']].forEach(function(v){var opt=element('option','',v[1]);opt.value=v[0];result.appendChild(opt);});result.value=c.result;\n      field(grid,'Result','result'+i,result);\n      var initials=input('text',c.initials);field(grid,'Initials','initials'+i,initials);\n      var comment=element('textarea');comment.rows=1;comment.value=c.comment;field(grid,'Comment','comment'+i,comment).className='comment';\n      result.addEventListener('change',function(){c.result=result.value;if(c.result&&!initials.value.trim()&&state.fields.initials){initials.value=state.fields.initials;c.initials=initials.value;}row.dataset.result=c.result;save();});\n      initials.addEventListener('input',function(){c.initials=initials.value;save();});comment.addEventListener('input',function(){c.comment=comment.value;save();});\n      row.appendChild(grid);\n      if(i===28||i===29){var expiration=input('date',c.expiry);field(row,'Expiration date','expiry'+i,expiration).className='expiry';expiration.addEventListener('input',function(){c.expiry=expiration.value;save();});}\n      el(i\u003c20?'itemsOne':'itemsTwo').appendChild(row);\n    });\n  }\n  function buildTires(){R.tires.forEach(function(name,i){var t=state.tires[i],row=element('div','tire');row.appendChild(element('div','tire-name',name));var fields=element('div','fields');var psi=input('text',t.psi),tread=input('text',t.tread);field(fields,'PSI','psi'+i,psi);field(fields,'Tread depth','tread'+i,tread);psi.addEventListener('input',function(){t.psi=psi.value;save();});tread.addEventListener('input',function(){t.tread=tread.value;save();});row.appendChild(fields);el('tires').appendChild(row);});}\n  function review(){\n    var c=R.counts(state),summary='Pass: '+c.Pass+' | Fail: '+c.Fail+' | N/A: '+c['N/A']+'.';\n    if(c.missing)summary+=' '+c.missing+' item'+(c.missing===1?' has':'s have')+' no result and will show as Not recorded.';\n    if(c.initials)summary+=' '+c.initials+' selected result'+(c.initials===1?' is':'s are')+' missing initials.';\n    el('completion').textContent=summary;\n    el('reportText').value=R.report(state);el('openEmail').href=R.link(state,true);el('shortEmail').href=R.link(state,false);\n    el('recipientList').textContent=R.recipients.join('; ');\n  }\n  function show(index){\n    step=Math.max(0,Math.min(4,index));\n    panels.forEach(function(id,i){el(id).hidden=i!==step;});\n    document.querySelectorAll('[data-step]').forEach(function(b){if(Number(b.dataset.step)===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});\n    el('stepCount').textContent='Section '+(step+1)+' of 5';el('progressFill').style.width=((step+1)/5*100)+'%';\n    el('back').hidden=step===0;el('next').hidden=step===4;el('next').textContent=step===3?'Review inspection':'Next';el('foot').hidden=false;\n    if(step===4)review();\n    window.scrollTo(0,0);\n  }\n  document.querySelectorAll('[data-key]').forEach(function(n){n.value=state.fields[n.dataset.key]||'';n.addEventListener('input',function(){state.fields[n.dataset.key]=n.value;save();});});\n  document.querySelectorAll('[data-step]').forEach(function(n){n.addEventListener('click',function(){show(Number(n.dataset.step));});});\n  el('back').addEventListener('click',function(){show(step-1);});el('next').addEventListener('click',function(){show(step+1);});\n  el('openEmail').addEventListener('click',function(){save();el('mailStatus').textContent='Opening your email app. Check that the draft ends with END OF INSPECTION, then send it. If text is missing, use the backup below.';});\n  el('shortEmail').addEventListener('click',function(){el('copyStatus').textContent='Paste the complete report into the email body, review the addresses, then send.';});\n  function selectReport(){var text=el('reportText');text.focus();text.select();text.setSelectionRange(0,text.value.length);}\n  function legacyCopy(){selectReport();var ok=false;try{ok=document.execCommand('copy');}catch(e){}el('copyStatus').textContent=ok?'Full report copied. Open the email to paste it.':'Report selected. Use your device\\'s Copy command, then open the email to paste it.';}\n  el('copyReport').addEventListener('click',function(){\n    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el('reportText').value).then(function(){el('copyStatus').textContent='Full report copied. Open the email to paste it.';},legacyCopy);}else legacyCopy();\n  });\n  el('selectReport').addEventListener('click',function(){selectReport();el('copyStatus').textContent='Report selected. Use your device\\'s Copy command, then open the email to paste it.';});\n  el('clear').addEventListener('click',function(){if(!window.confirm('Clear this inspection and start a new one?'))return;state=R.fresh();try{localStorage.removeItem(KEY);}catch(e){}document.querySelectorAll('[data-key]').forEach(function(n){n.value=state.fields[n.dataset.key]||'';});el('itemsOne').replaceChildren();el('itemsTwo').replaceChildren();el('tires').replaceChildren();buildItems();buildTires();el('mailStatus').textContent='';el('copyStatus').textContent='';el('reportText').value='';el('backup').open=false;el('draftStatus').textContent='New inspection started.';show(0);});\n  buildItems();buildTires();el('content').hidden=false;show(0);\n})();\n\u003c/script>\n\u003cstyle id=\"portalCleanUi\">.recipients,.backup,.status,.bottom small,.head>p.sub,.btn .s{display:none!important}\u003c/style>\n\u003cscript id=\"portalEmailBridge\">\n(function(){\n'use strict';\ndocument.addEventListener('click',function(event){\n var link=event.target.closest?event.target.closest('a'):null;\n if(!link)return;\n var href=link.href||'';\n if(href.slice(0,7).toLowerCase()!=='mailto:')return;\n event.preventDefault();\n window.parent.MagTecPortal.requestEmail('LDinsp',href);\n});\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"},"HDinsp":{"title":"Heavy Duty Inspection","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#14181c\">\u003cmeta name=\"apple-mobile-web-app-title\" content=\"Heavy Duty\">\u003ctitle>MagTec Heavy Duty Inspection\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--bg:#14181c;--panel:#1c2127;--line:#36404a;--text:#eef1f4;--sub:#adb7c1;--amber:#f5a623}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 12px 32px}.app{max-width:880px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}h1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 8px}h2{font-size:20px;font-weight:600;margin:0 0 8px}p{margin:0 0 16px}.sub{color:var(--sub);font-size:14px}.head p{margin:0}.steps{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}.step{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:6px;min-height:44px;padding:9px 12px;font:600 13px/1.3 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}.step[aria-current=step]{background:var(--amber);border-color:var(--amber);color:#211809}.progress{height:4px;background:var(--line)}#progressFill{height:100%;width:0;background:var(--amber)}.content{padding:24px}.panel[hidden]{display:none!important}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label,.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:16px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif}textarea{resize:vertical;min-height:88px}input,select{min-height:48px}input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.field-help{color:var(--sub);font-size:12px;margin:5px 0 0}.check{padding:18px 0;border-bottom:1px solid var(--line)}.check:first-child{padding-top:0}.check:last-child{border-bottom:0}.item-name{font-size:16px;font-weight:600;margin:0 0 12px}.number{color:var(--amber);display:inline-block;min-width:28px}.check-fields{display:grid;grid-template-columns:150px 90px minmax(0,1fr);gap:12px;align-items:start}.comment textarea{min-height:48px;height:48px}.expiry{margin-top:12px;max-width:290px}.check[data-result=Fail]{border-left:3px solid #ff9389;padding-left:12px}.check[data-result=Pass]{border-left:3px solid #62c994;padding-left:12px}.check[data-result=\"N/A\"]{border-left:3px solid #a5b8cf;padding-left:12px}.tire{border-bottom:1px solid var(--line);padding:18px 0}.tire:first-child{padding-top:0}.tire-name{font-weight:600;margin-bottom:10px}.notes{margin-top:24px}.foot{display:flex;gap:12px;border-top:1px solid var(--line);padding:18px 24px}.button{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);cursor:pointer;text-align:center}.primary{background:var(--amber);border-color:var(--amber);color:#211809}.primary:hover{background:#ffbb4d}.grow{flex:1}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.actions .button{flex:1 1 180px}.notice{padding:14px;border:1px solid #846332;border-radius:7px;background:#30281b;color:var(--text);font-size:14px;margin-bottom:18px}.recipients{padding:14px;background:var(--bg);border-radius:7px;margin:16px 0;overflow-wrap:anywhere;font-size:13px}.recipients strong{display:block;margin-bottom:4px;color:var(--sub)}.report{font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:360px;white-space:pre-wrap}.backup{border:1px solid var(--line);border-radius:7px;padding:14px;margin-top:18px}.backup summary{font-size:14px;font-weight:600;cursor:pointer;min-height:28px}.backup p{margin-top:12px;margin-bottom:8px}.status{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line)}.bottom .button{font-size:12px;min-height:40px;padding:8px 12px}.bottom small{color:var(--sub);font-size:12px}.step-count{font-size:12px;color:var(--sub);margin-bottom:12px}noscript{display:block;padding:24px;color:var(--text)}\n@media(max-width:620px){body{padding:0}.app{border:0;border-radius:0}.head,.content{padding:20px 16px}.steps{padding:12px 16px;gap:5px}.step{flex:1 1 28%;font-size:12px;padding:8px}.fields{grid-template-columns:1fr}.check-fields{grid-template-columns:minmax(0,1fr) 90px}.comment{grid-column:1/-1}.comment textarea{height:72px}.foot,.bottom{padding:16px}.tire .fields{grid-template-columns:1fr 1fr}.report{font-size:13px}.bottom{align-items:flex-start}.head h1{font-size:22px}}\n\n.app [hidden]{display:none!important}\n.check-fields{grid-template-columns:165px minmax(0,1fr)}.readings{margin-top:14px}.reading-hint{font-size:12px;color:var(--sub);margin-top:6px}.legend{font-size:13px;color:var(--sub);line-height:1.8}.tire-group{font-size:17px;color:var(--amber);border-bottom:1px solid var(--line);padding:20px 0 10px;margin-bottom:16px}.check[data-result=\"SR\"]{border-left:3px solid #ff9389;padding-left:12px}.check[data-result=\"R\"]{border-left:3px solid #f5a623;padding-left:12px}.check[data-result=\"OK\"]{border-left:3px solid #62c994;padding-left:12px}@media(max-width:620px){.check-fields{grid-template-columns:minmax(0,1fr)}.readings .fields{grid-template-columns:1fr}.tire .fields{grid-template-columns:1fr 1fr}}\u003c/style>\u003c/head>\u003cbody>\n\u003cmain class=\"app\">\n \u003cheader class=\"head\">\u003cdiv class=\"brand\">MagTec Alaska\u003c/div>\u003ch1>Heavy Duty Inspection\u003c/h1>\u003cp class=\"sub\">Complete the tractor inspection, then open the filled-out email.\u003c/p>\u003c/header>\n \u003cnav class=\"steps\" aria-label=\"Inspection sections\">\u003cbutton type=\"button\" class=\"step\" data-step=\"0\" aria-controls=\"detailsPanel\">1. Details\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"1\" aria-controls=\"engine\">2. Engine\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"2\" aria-controls=\"chassis\">3. Chassis\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"3\" aria-controls=\"brakes\">4. Brakes\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"4\" aria-controls=\"cab\">5. Cab &amp; body\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"5\" aria-controls=\"annual\">6. Annual service\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"6\" aria-controls=\"tiresPanel\">7. Tires &amp; notes\u003c/button>\n\u003cbutton type=\"button\" class=\"step\" data-step=\"7\" aria-controls=\"review\">8. Review &amp; email\u003c/button>\u003c/nav>\n \u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n \u003cnoscript>Open this page in Safari, Chrome, or Edge with JavaScript enabled to fill out the inspection.\u003c/noscript>\n \u003cdiv class=\"content\" id=\"content\" hidden>\n  \u003cdiv id=\"stepCount\" class=\"step-count\" aria-live=\"polite\">\u003c/div>\n  \u003csection class=\"panel\" id=\"detailsPanel\" aria-labelledby=\"detailsTitle\">\n   \u003ch2 id=\"detailsTitle\">Tractor &amp; inspector details\u003c/h2>\u003cp class=\"sub\">Record the vehicle, service information, and the person completing the inspection.\u003c/p>\n   \u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"asset\">Asset number\u003c/label>\u003cinput id=\"asset\" data-key=\"asset\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"technician\">Technician / inspector name\u003c/label>\u003cinput id=\"technician\" data-key=\"technician\" type=\"text\" autocomplete=\"name\">\u003cp class=\"field-help\">Initials are generated from this name for every selected checklist result.\u003c/p>\u003c/div>\n\u003cdiv>\u003clabel for=\"date\">Inspection date\u003c/label>\u003cinput id=\"date\" data-key=\"date\" type=\"date\">\u003c/div>\u003cdiv>\u003clabel for=\"associatedSE\">Associated SE# (if available)\u003c/label>\u003cinput id=\"associatedSE\" data-key=\"associatedSE\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"vehicle\">Vehicle / tractor\u003c/label>\u003cinput id=\"vehicle\" data-key=\"vehicle\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"serviceType\">Service type\u003c/label>\u003cinput id=\"serviceType\" data-key=\"serviceType\" type=\"text\" autocomplete=\"off\" list=\"serviceTypes\">\u003c/div>\n\u003cdiv>\u003clabel for=\"hours\">Hours\u003c/label>\u003cinput id=\"hours\" data-key=\"hours\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"mileage\">Mileage\u003c/label>\u003cinput id=\"mileage\" data-key=\"mileage\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"lubeMeter\">Lube meter\u003c/label>\u003cinput id=\"lubeMeter\" data-key=\"lubeMeter\" type=\"text\" autocomplete=\"off\">\u003c/div>\n\u003cdiv>\u003clabel for=\"history\">History file review\u003c/label>\u003cinput id=\"history\" data-key=\"history\" type=\"text\" autocomplete=\"off\">\u003cp class=\"field-help\">Record completion and any relevant details.\u003c/p>\u003c/div>\n\u003cdiv>\u003clabel for=\"logbook\">Log book / repair sign-off\u003c/label>\u003cinput id=\"logbook\" data-key=\"logbook\" type=\"text\" autocomplete=\"off\">\u003cp class=\"field-help\">Record completion and any relevant details.\u003c/p>\u003c/div>\u003c/div>\u003cdatalist id=\"serviceTypes\">\u003coption value=\"Full service\">\u003c/option>\u003coption value=\"Annual service\">\u003c/option>\u003coption value=\"Full and annual service\">\u003c/option>\u003c/datalist>\n  \u003c/section>\n  \u003csection class=\"panel\" id=\"engine\" aria-labelledby=\"engineTitle\" hidden>\n \u003ch2 id=\"engineTitle\">Engine\u003c/h2>\u003cp class=\"sub\">Select a result and add comments or readings where needed. Initials come from the technician name.\u003c/p>\n \u003cp class=\"legend\">\u003cstrong>OK\u003c/strong> = Inspected &amp; OK &nbsp; \u003cstrong>R\u003c/strong> = Minor repairs made\u003cbr>\u003cstrong>SR\u003c/strong> = Shop repairs required &nbsp; \u003cstrong>N/A\u003c/strong> = Not applicable\u003c/p>\n \u003cdiv id=\"engineItems\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"chassis\" aria-labelledby=\"chassisTitle\" hidden>\n \u003ch2 id=\"chassisTitle\">Chassis\u003c/h2>\u003cp class=\"sub\">Select a result and add comments or readings where needed. Initials come from the technician name.\u003c/p>\n \u003cp class=\"legend\">\u003cstrong>OK\u003c/strong> = Inspected &amp; OK &nbsp; \u003cstrong>R\u003c/strong> = Minor repairs made\u003cbr>\u003cstrong>SR\u003c/strong> = Shop repairs required &nbsp; \u003cstrong>N/A\u003c/strong> = Not applicable\u003c/p>\n \u003cdiv id=\"chassisItems\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"brakes\" aria-labelledby=\"brakesTitle\" hidden>\n \u003ch2 id=\"brakesTitle\">Brakes\u003c/h2>\u003cp class=\"sub\">Select a result and add comments or readings where needed. Initials come from the technician name.\u003c/p>\n \u003cp class=\"legend\">\u003cstrong>OK\u003c/strong> = Inspected &amp; OK &nbsp; \u003cstrong>R\u003c/strong> = Minor repairs made\u003cbr>\u003cstrong>SR\u003c/strong> = Shop repairs required &nbsp; \u003cstrong>N/A\u003c/strong> = Not applicable\u003c/p>\n \u003cdiv id=\"brakesItems\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"cab\" aria-labelledby=\"cabTitle\" hidden>\n \u003ch2 id=\"cabTitle\">Cab &amp; body\u003c/h2>\u003cp class=\"sub\">Select a result and add comments or readings where needed. Initials come from the technician name.\u003c/p>\n \u003cp class=\"legend\">\u003cstrong>OK\u003c/strong> = Inspected &amp; OK &nbsp; \u003cstrong>R\u003c/strong> = Minor repairs made\u003cbr>\u003cstrong>SR\u003c/strong> = Shop repairs required &nbsp; \u003cstrong>N/A\u003c/strong> = Not applicable\u003c/p>\n \u003cdiv id=\"cabItems\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"annual\" aria-labelledby=\"annualTitle\" hidden>\n \u003ch2 id=\"annualTitle\">Annual service only\u003c/h2>\u003cp class=\"sub\">Annual service items from the checklist. Select N/A for work that does not apply; no results are selected automatically.\u003c/p>\n \u003cp class=\"legend\">\u003cstrong>OK\u003c/strong> = Inspected &amp; OK &nbsp; \u003cstrong>R\u003c/strong> = Minor repairs made\u003cbr>\u003cstrong>SR\u003c/strong> = Shop repairs required &nbsp; \u003cstrong>N/A\u003c/strong> = Not applicable\u003c/p>\n \u003cdiv id=\"annualItems\">\u003c/div>\u003c/section>\n  \u003csection class=\"panel\" id=\"tiresPanel\" aria-labelledby=\"tiresTitle\" hidden>\n   \u003ch2 id=\"tiresTitle\">Tires - 10 positions\u003c/h2>\n   \u003cp class=\"sub\">Driver and passenger sides are viewed facing forward. Front drive is the forward axle of the tandem; rear drive is the rearmost axle. Inner tires are nearest the chassis; outer tires are nearest the outside of the tractor.\u003c/p>\n   \u003cp class=\"sub\">Record PSI and tread depth in 32nds of an inch. Entries can include notes or other units.\u003c/p>\u003cdiv id=\"tires\">\u003c/div>\n   \u003cdiv class=\"notes\">\u003clabel for=\"notes\">Comments / notes\u003c/label>\u003ctextarea id=\"notes\" data-key=\"notes\" rows=\"5\">\u003c/textarea>\u003c/div>\n  \u003c/section>\n  \u003csection class=\"panel\" id=\"review\" aria-labelledby=\"reviewTitle\" hidden>\n   \u003ch2 id=\"reviewTitle\">Review &amp; open email\u003c/h2>\u003cp class=\"sub\">The full inspection goes in the email body. Review the draft in your email app, then send it.\u003c/p>\n   \u003cdiv id=\"completion\" class=\"notice\">\u003c/div>\n   \u003cdiv class=\"recipients\">\u003cstrong>Email recipients\u003c/strong>\u003cspan id=\"recipientList\">\u003c/span>\u003c/div>\n   \u003cdiv class=\"actions\">\u003ca id=\"openEmail\" class=\"button primary\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">Open filled-out email\u003c/a>\u003c/div>\n   \u003cp id=\"mailStatus\" class=\"status\" role=\"status\">\u003c/p>\n   \u003clabel for=\"reportText\">Complete email body\u003c/label>\u003ctextarea id=\"reportText\" class=\"report\" readonly spellcheck=\"false\">\u003c/textarea>\n   \u003cp class=\"field-help\">Check that your email includes all 10 tire positions and ends with END OF INSPECTION.\u003c/p>\n   \u003cdetails class=\"backup\" id=\"backup\">\u003csummary>Backup if the email opens with missing text\u003c/summary>\n    \u003cp class=\"sub\">This is a long inspection. If your phone limits the email text, copy the complete report, open the addressed email, and paste into the body.\u003c/p>\n    \u003cdiv class=\"actions\">\u003cbutton id=\"copyReport\" class=\"button\" type=\"button\">1. Copy full report\u003c/button>\u003ca id=\"shortEmail\" class=\"button\" href=\"mailto:NSrentals@magtecalaska.com,nsshop@magtecalaska.com,nsd-mgr@magtecalaska.com\">2. Open email to paste\u003c/a>\u003c/div>\n    \u003cbutton id=\"selectReport\" class=\"button\" type=\"button\">Select report for manual copy\u003c/button>\u003cp id=\"copyStatus\" class=\"status\" role=\"status\">\u003c/p>\n    \u003cp class=\"field-help\">If your device blocks copying or opening email from this browser, use your approved email app with the recipient addresses and full report shown above.\u003c/p>\n   \u003c/details>\n  \u003c/section>\n \u003c/div>\n \u003cdiv class=\"foot\" id=\"foot\" hidden>\u003cbutton class=\"button\" id=\"back\" type=\"button\">Back\u003c/button>\u003cbutton class=\"button primary grow\" id=\"next\" type=\"button\">Next\u003c/button>\u003c/div>\n \u003cfooter class=\"bottom\">\u003csmall id=\"draftStatus\" role=\"status\">Your entries stay here while you fill out the form.\u003c/small>\u003cbutton class=\"button\" id=\"clear\" type=\"button\">Start over\u003c/button>\u003c/footer>\n\u003c/main>\n\u003cscript id=\"inspectionTextLayout\">var InspectionTextLayout=(function(){\n'use strict';\nvar COLUMN=24,WIDTH=78,RULE='-'.repeat(WIDTH);\nfunction text(value){return String(value==null?'':value);}\nfunction wrap(value,width){\n re

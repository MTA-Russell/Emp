<style>
:root{color-scheme:dark;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#14181c;color:#eef1f4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
[hidden]{display:none!important}
.toolbar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 20px;border-bottom:1px solid #36404a;background:#1c2127}
.toolbar button{min-height:42px;border:1px solid #f5a623;background:#f5a623;color:#211809;font:600 14px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:6px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.toolbar button:focus-visible{outline:3px solid #eef1f4;outline-offset:2px}
.toolbar button.reset-button{border-color:#59626d;background:#272e35;color:#eef1f4}
.toolbar span{font-size:14px;font-weight:600;text-align:right}
#views{height:100vh;height:100dvh}
body.form-open #views{height:calc(100vh - 60px);height:calc(100dvh - 60px)}
.view{display:block;width:100%;height:100%;border:0;background:#14181c}
noscript{display:block;padding:24px}
@media(max-width:560px){.toolbar{padding:8px 12px}.toolbar span{font-size:12px}.toolbar button{padding:9px 11px}}
dialog{color:#eef1f4;background:#1c2127;border:1px solid #36404a;border-radius:12px;padding:24px;width:calc(100% - 32px);max-width:440px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font-size:20px;margin:0 0 20px;font-weight:600}
.location-options{display:flex;gap:12px;margin-bottom:18px}
dialog button{min-height:48px;padding:12px;border:1px solid #36404a;border-radius:7px;background:#14181c;color:#eef1f4;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}
.location-options button{flex:1;min-width:0;background:#f5a623;border-color:#f5a623;color:#211809}
dialog button:focus-visible{outline:3px solid #eef1f4;outline-offset:3px}
.combined-view{height:calc(100vh - 60px);height:calc(100dvh - 60px);overflow:auto;padding:20px 12px 32px}
.combined-card{max-width:880px;margin:auto;background:#1c2127;border:1px solid #36404a;border-radius:12px;padding:24px}
.combined-card h1{font-size:24px;font-weight:600;margin:0 0 20px}
.combined-card label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.combined-card textarea{width:100%;background:#14181c;color:#eef1f4;border:1px solid #36404a;border-radius:6px;padding:12px;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical;min-height:420px}
.combined-actions{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 18px}
.combined-actions:last-child{margin:18px 0 0}
.combined-button{flex:1;min-height:48px;padding:12px 16px;border:1px solid #36404a;border-radius:7px;background:#14181c;color:#eef1f4;font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}
.combined-button.primary{background:#f5a623;border-color:#f5a623;color:#211809}
.combined-button:disabled{opacity:.5;cursor:default}
.combined-button:focus-visible{outline:3px solid #eef1f4;outline-offset:3px}
.toolbar span{max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){.combined-view{padding:0}.combined-card{border:0;border-radius:0;padding:20px 16px}.combined-card h1{font-size:22px}}
</style>
</head>

\u003eDVIR / Pre-Trip / Pre-Use / Walk-Around Inspection\u003c/span\u003e\u003c/a\u003e\n    \u003c/nav\u003e\n    \u003cdetails class=\"mp-section\"\u003e\n      \u003csummary class=\"cursor-interaction\"\u003e\u003cspan class=\"mp-symbol\" aria-hidden=\"true\"\u003eSE\u003c/span\u003e\u003cspan\u003e\u003cspan class=\"mp-section-title\"\u003eService\u003c/span\u003e\u003cspan class=\"mp-section-sub\"\u003eService orders \u0026amp; inspections\u003c/span\u003e\u003c/span\u003e\u003c/summary\u003e\n      \u003cdiv class=\"mp-service-groups\"\u003e\n        \u003cdetails class=\"mp-subcategory\"\u003e\n          \u003csummary class=\"cursor-interaction\"\u003e\u003cspan class=\"mp-section-title\"\u003eService Orders\u003c/span\u003e\u003c/summary\u003e\n          \u003cnav class=\"mp-submenu\" aria-label=\"Service Orders submenu\"\u003e\n\u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eSE Request\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eRequest work on an asset. Include the issue, location, priority, and your contact information.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#REQ\" data-form=\"REQ\" aria-label=\"Open Service Order Request\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n\u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eWorksheet\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eRecord service work, repairs, parts used, and labor time. Prepare the completed worksheet for email.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#SEFill\" data-form=\"SEFill\" aria-label=\"Open Service Order Worksheet\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n          \u003c/nav\u003e\n        \u003c/details\u003e\n        \u003cdetails class=\"mp-subcategory\"\u003e\n          \u003csummary class=\"cursor-interaction\"\u003e\u003cspan class=\"mp-section-title\"\u003eInspection Forms\u003c/span\u003e\u003c/summary\u003e\n          \u003cnav class=\"mp-submenu\" aria-label=\"Inspection Forms submenu\"\u003e\n\u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eACB Inspection\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eComplete the ACB inspection checklist, identify needed repairs, and prepare the inspection email.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#ACBinsp\" data-form=\"ACBinsp\" aria-label=\"Open ACB Inspection\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n\u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eLight Duty Inspection\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eComplete the light duty vehicle checklist, record tire readings and comments, and prepare the inspection email.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#LDinsp\" data-form=\"LDinsp\" aria-label=\"Open Light Duty Inspection\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n\u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eHeavy Duty Inspection\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eComplete the tractor inspection, record tire and brake readings, and prepare the inspection email.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#HDinsp\" data-form=\"HDinsp\" aria-label=\"Open Heavy Duty Inspection\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n\u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eTank Inspection\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eInspect 400 BBL and 600 BBL tanks for In, Out, or Yard use. Record equipment and foam conditions.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#TANKinsp\" data-form=\"TANKinsp\" aria-label=\"Open Tank Inspection\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n\u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eEV Inspection\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eInspect Envirovac units, check tanks and interior components, and record conditions and repair notes.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#EVinsp\" data-form=\"EVinsp\" aria-label=\"Open EV Inspection\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n\u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eTrailer Inspection\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eInspect trailer components, brakes, suspension, landing gear, and all 12 tire positions.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#TRLinsp\" data-form=\"TRLinsp\" aria-label=\"Open Trailer Inspection\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n          \u003c/nav\u003e\n        \u003c/details\u003e\n      \u003c/div\u003e\n    \u003c/details\u003e\n    \u003cdetails class=\"mp-section\"\u003e\n      \u003csummary class=\"cursor-interaction\"\u003e\u003cspan class=\"mp-symbol\" aria-hidden=\"true\"\u003eFW\u003c/span\u003e\u003cspan\u003e\u003cspan class=\"mp-section-title\"\u003eFacilities\u003c/span\u003e\u003cspan class=\"mp-section-sub\"\u003eFuel, water/sewer \u0026amp; trash requests\u003c/span\u003e\u003c/span\u003e\u003c/summary\u003e\n      \u003cnav class=\"mp-submenu\" aria-label=\"Facilities submenu\"\u003e\n        \u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eFuel Request\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eRequest gas, diesel, or both. Record gallons, asset, location, and priority.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#Fuel\" data-form=\"Fuel\" aria-label=\"Open Fuel Request\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n        \u003c/article\u003e\n        \u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eWater/Sewer Request\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eRequest water, sewer service, or both. Include water-connex gallons when applicable.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#Facil\" data-form=\"Facil\" aria-label=\"Open Water/Sewer Request\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n        \u003c/article\u003e\n              \u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eTrash Pickup Request\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eRequest pickup for an almost full or full dumpster.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#Trash\" data-form=\"Trash\" aria-label=\"Open Trash Pickup Request\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n        \u003c/article\u003e\n      \u003c/nav\u003e\n    \u003c/details\u003e\n    \u003cdetails class=\"mp-section\"\u003e\n      \u003csummary class=\"cursor-interaction\"\u003e\u003cspan class=\"mp-symbol\" aria-hidden=\"true\"\u003eGS\u003c/span\u003e\u003cspan\u003e\u003cspan class=\"mp-section-title\"\u003eBilleting\u003c/span\u003e\u003cspan class=\"mp-section-sub\"\u003eGuest stays \u0026amp; arrival details\u003c/span\u003e\u003c/span\u003e\u003c/summary\u003e\n      \u003cnav class=\"mp-submenu mp-single\" aria-label=\"Billeting submenu\"\u003e\n        \u003carticle class=\"mp-tool\"\u003e\n          \u003ch2\u003eGuest Stay\u003c/h2\u003e\n          \u003cp class=\"mp-description\"\u003eSubmit guest details, arrival and departure dates, a purchase order, and an internal project code.\u003c/p\u003e\n          \u003ca class=\"mp-open cursor-interaction\" href=\"#BillREQ\" data-form=\"BillREQ\" aria-label=\"Open Guest Stay\"\u003eOpen form \u003cspan aria-hidden=\"true\"\u003e\u0026#8594;\u003c/span\u003e\u003c/a\u003e\n          \n        \u003c/article\u003e\n      \u003c/nav\u003e\n    \u003c/details\u003e\n    \n      \u003cnav class=\"mp-shortcuts mp-bottom\" aria-label=\"Equipment swap\"\u003e\n      \u003ca class=\"mp-direct cursor-interaction\" href=\"#SpotSwap\" data-form=\"SpotSwap\"\u003e\u003cspan class=\"mp-symbol\" aria-hidden=\"true\"\u003eES\u003c/span\u003e\u003cspan class=\"mp-section-title\"\u003eEquipment Swap\u003c/span\u003e\u003c/a\u003e\n    \u003c/nav\u003e\n  \u003c/main\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\n(function(){\n'use strict';\ndocument.querySelectorAll('[data-form]').forEach(function(link){\nlink.addEventListener('click',function(event){event.preventDefault();window.parent.MagTecPortal.show(link.dataset.form);});\n});\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e"},"REQ":{"title":"Service Order Request","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"\u003e\n\u003cmeta name=\"theme-color\" content=\"#14181c\"\u003e\n\u003ctitle\u003eService Order Request\u003c/title\u003e\n\u003cstyle\u003e\n:root{color-scheme:dark;--bg:#14181c;--panel:#1c2127;--line:#36404a;--text:#eef1f4;--amber:#f5a623}\n*{box-sizing:border-box}[hidden]{display:none!important}\nbody{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 12px 32px}\n.app{max-width:880px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}\nheader{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}\nh1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 0}h2{font-size:20px;font-weight:600;margin:0 0 18px}\n.content{padding:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}.wide{grid-column:1/-1}\nlabel{display:block;font-size:14px;font-weight:600;margin-bottom:7px}\ninput,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:16px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif}\ninput,select{min-height:48px}textarea{resize:vertical;min-height:88px}#reportText{font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:280px}\ninput:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}\n.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}\nbutton{flex:1;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;color:var(--text);background:var(--bg);font:600 15px/1.4 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;cursor:pointer}\nbutton.primary{background:var(--amber);border-color:var(--amber);color:#211809}button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}\n@media(max-width:620px){body{padding:0}.app{border:0;border-radius:0}header,.content{padding:20px 16px}.fields{grid-template-columns:1fr}h1{font-size:22px}.actions button{flex:1 1 120px}}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cmain class=\"app\"\u003e\n\u003cheader\u003e\u003cdiv class=\"brand\"\u003eMagTec Alaska\u003c/div\u003e\u003ch1\u003eService Order Request\u003c/h1\u003e\u003c/header\u003e\n\u003cdiv class=\"content\"\u003e\n\u003csection id=\"entryPanel\" aria-label=\"Details\"\u003e\n\u003cform id=\"entryForm\"\u003e\u003cdiv id=\"fields\" class=\"fields\"\u003e\u003c/div\u003e\n\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"reviewButton\" class=\"primary\" type=\"submit\"\u003eReview\u003c/button\u003e\u003cbutton id=\"clearEntry\" type=\"button\"\u003eStart Over\u003c/button\u003e\u003c/div\u003e\u003c/form\u003e\n\u003c/section\u003e\n\u003csection id=\"reviewPanel\" aria-labelledby=\"reviewTitle\" hidden\u003e\n\u003ch2 id=\"reviewTitle\"\u003eReview\u003c/h2\u003e\n\u003clabel for=\"reportText\"\u003eEmail body\u003c/label\u003e\u003ctextarea id=\"reportText\" readonly spellcheck=\"false\" rows=\"14\"\u003e\u003c/textarea\u003e\n\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"openEmail\" class=\"primary\" type=\"button\"\u003eOpen Email\u003c/button\u003e\u003cbutton id=\"edit\" type=\"button\"\u003eEdit\u003c/button\u003e\u003cbutton id=\"clearReview\" type=\"button\"\u003eStart Over\u003c/button\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003c/div\u003e\n\u003c/main\u003e\n\u003cscript\u003e\nvar CompactConfig={\"key\": \"REQ\", \"title\": \"Service Order Request\", \"subjectField\": \"assetNo\", \"fields\": [{\"key\": \"name\", \"label\": \"Your name\", \"autocomplete\": \"name\"}, {\"key\": \"phone\", \"label\": \"Contact phone number\", \"autocomplete\": \"tel\"}, {\"key\": \"assetNo\", \"label\": \"Asset number\"}, {\"key\": \"location\", \"label\": \"Where is the asset right now?\"}, {\"key\": \"priority\", \"label\": \"Priority level\", \"options\": [[\"LOW\", \"Low\"], [\"MEDIUM\", \"Med\"], [\"HIGH\", \"High\"]]}, {\"key\": \"complaint\", \"label\": \"Description of complaint\", \"type\": \"textarea\", \"wide\": true}]};\n(function(C){\n'use strict';\nvar KEY='magtec-compact-'+C.key+'-v1',state=fresh();\nfunction el(id){return document.getElementById(id);}\nfunction today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\nfunction fresh(){var data={};C.fields.forEach(function(f){data[f.key]=f.today?today():'';});return data;}\ntry{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved)C.fields.forEach(function(f){var v=saved[f.key];if(typeof v==='string'\u0026\u0026(!f.options||v===''||f.options.some(function(o){return (typeof o==='string'?o:o[0])===v;})))state[f.key]=v;});}catch(e){}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}\nfunction visible(f){return !f.when||f.when.every(function(condition){return condition.values.indexOf(state[condition.key])\u003e=0;});}\nfunction updateVisibility(){C.fields.forEach(function(f){el('field-'+f.key).hidden=!visible(f);});}\nfunction option(select,value,text){var n=document.createElement('option');n.value=value;n.textContent=text;select.appendChild(n);}\nC.fields.forEach(function(f){\n var wrap=document.createElement('div');wrap.id='field-'+f.key;if(f.wide)wrap.className='wide';\n var label=document.createElement('label');label.htmlFor=f.key;label.textContent=f.label;\n var input=document.createElement(f.options?'select':f.type==='textarea'?'textarea':'input');input.id=f.key;input.name=f.key;input.dataset.key=f.key;\n if(f.options){option(input,'','Select');f.options.forEach(function(o){option(input,typeof o==='string'?o:o[0],typeof o==='string'?o:o[1]);});}\n else if(f.type==='textarea')input.rows=3;\n else{input.type=f.type==='date'?'date':'text';input.autocomplete=f.autocomplete||'off';}\n input.value=state[f.key];\n function changed(){state[f.key]=input.value;save();updateVisibility();}\n input.addEventListener('input',changed);input.addEventListener('change',changed);wrap.append(label,input);el('fields').appendChild(wrap);\n});\nfunction display(f){var value=state[f.key];if(f.options){var selected=f.options.find(function(o){return (typeof o==='string'?o:o[0])===value;});if(selected\u0026\u0026typeof selected!=='string')value=selected[1];}return value.trim()?value:'Not entered';}\nfunction report(){var lines=[C.title.toUpperCase(),''];C.fields.forEach(function(f){if(visible(f))lines.push(f.label+': '+display(f));});if(C.footer)lines.push('',C.footer);return lines.join('\\n').replace(/\\r\\n|\\r|\\n/g,'\\r\\n');}\nfunction showReview(){save();el('reportText').value=report();el('entryPanel').hidden=true;el('reviewPanel').hidden=false;window.scrollTo(0,0);}\nfunction showEntry(){el('entryPanel').hidden=false;el('reviewPanel').hidden=true;window.scrollTo(0,0);}\nfunction reset(){if(!window.confirm('Clear this form and start over?'))return;state=fresh();C.fields.forEach(function(f){el(f.key).value=state[f.key];});save();updateVisibility();el('reportText').value='';showEntry();}\nfunction encode(value){var s=String(value||'');if(s.toWellFormed)s=s.toWellFormed();else s=s.replace(/[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDFFF]/g,function(m){return m.length===2?m:'\\uFFFD';});return encodeURIComponent(s);}\nel('entryForm').addEventListener('submit',function(event){event.preventDefault();showReview();});\nel('edit').addEventListener('click',showEntry);el('clearEntry').addEventListener('click',reset);el('clearReview').addEventListener('click',reset);\nel('openEmail').addEventListener('click',function(){var detail=state[C.subjectField]||'';window.parent.MagTecPortal.requestEmail(C.key,'mailto:?subject='+encode(C.title+(detail?' - '+detail:''))+'\u0026body='+encode(report()));});\nwindow.CompactForm={report:report,showReview:showReview,showEntry:showEntry};updateVisibility();\n})(CompactConfig);\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},"SEFill":{"title":"Service Order Worksheet","html":"\u003c!DOCTYPE html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1.0,viewport-fit=cover\"\u003e\u003cmeta name=\"theme-color\" content=\"#14181c\"\u003e\u003ctitle\u003eMagTec Service Order Worksheet\u003c/title\u003e\ /\\r\\n|\\r/g,'\\n').split('\\n');\n return paragraphs.map(function(line){\n  var lines=[];\n  while(line.length\u003e80){\n   var end=80;\n   while(end\u003e0\u0026\u0026!/[ \\t]/.test(line.charAt(end)))end--;\n   if(end===0)end=80;\n   // Keep a UTF-16 surrogate pair together when a long word needs to be split.\n   if(end\u003cline.length\u0026\u0026/[\\uD800-\\uDBFF]/.test(line.charAt(end-1))\u0026\u0026/[\\uDC00-\\uDFFF]/.test(line.charAt(end)))end--;\n   lines.push(line.slice(0,end));\n   line=line.slice(end).replace(/^[ \\t]+/,'');\n  }\n  lines.push(line);return lines.join('\\n');\n }).join('\\n');\n}\n\nfunction report(state){\n var f=state.fields,lines=['MAGTEC SERVICE ORDER WORKSHEET',''];\n fields.forEach(function(field){lines.push(field.label+': '+str(f[field.key]));});\n lines.push('','Description of complaint:',wrapWorksheetComments(f.complaint),'','Correction description:',wrapWorksheetComments(f.correction),'','Parts:');\n var parts=state.parts.filter(function(p){return str(p.desc).trim()||str(p.partNo).trim()||str(p.qty).trim();});\n if(!parts.length)lines.push('None entered');\n parts.forEach(function(part,i){lines.push('Part '+(i+1)+': '+str(part.desc)+' | Part #: '+str(part.partNo)+' | Quantity: '+str(part.qty));});\n lines.push('','Labor time: '+str(f.laborTime),'','END OF WORKSHEET');\n return lines.join('\\n').replace(/\\r\\n|\\r|\\n/g,'\\r\\n');\n}\nfunction packet(state){\n return {state:JSON.parse(JSON.stringify(state)),subject:'SE '+str(state.fields.serviceOrderNo)+' - Asset '+str(state.fields.assetNo),body:report(state),details:{associatedSE:str(state.fields.serviceOrderNo),asset:str(state.fields.assetNo),technician:str(state.fields.techName),date:str(state.fields.date),hours:str(state.fields.hours)}};\n}\nreturn {fields:fields,fresh:fresh,normalize:normalize,report:report,packet:packet};\n})();\n(function(R){\n'use strict';\nvar KEY='magtec-service-worksheet-v2',state=R.fresh(),step=0,combination=null;\nvar panels=['worksheetDetails','wo
